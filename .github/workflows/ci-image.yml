name: CI image

# Builds bench/ci/Dockerfile and pushes it for ci.yml and specs.yml to run in
# (`:latest`; the commit's tag is kept to roll back to).
on:
  push:
    branches: [main]
    paths: ["bench/ci/**", "rust-toolchain", ".github/workflows/ci-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: tag
        run: |
          tag="$(git rev-parse --short=8 HEAD)"
          docker buildx build -f bench/ci/Dockerfile \
            -t "ghcr.io/solana-foundation/machine-trading-ci:$tag" \
            -t ghcr.io/solana-foundation/machine-trading-ci:latest --push bench/ci
          echo "pushed machine-trading-ci:$tag"
