name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run `mtx gates --fast` on (default: every task)"
        required: false
  schedule:
    # Weekly: catch a Surfpool or Phoenix change that breaks the task image.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # No commit names an AI as its co-author: a pull request's commits are
  # checked, since a squash merge carries their trailers into main.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The title is a conventional commit
        # A squash merge makes the title main's commit subject.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if ! [[ "$TITLE" =~ ^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\([a-z0-9./-]+\))?!?:\ [^[:space:]] ]]; then
            echo "::error::the title isn't a conventional commit: type(scope): summary, as in 'fix(grader): …'"
            echo "$TITLE"
            exit 1
          fi
      - name: No AI co-authors
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          found="$(git log --format='%h %B' "$BASE..$HEAD" \
            | grep -iE '^co-authored-by:.*(anthropic|claude|openai|chatgpt|codex|copilot|cursor|gemini)' || true)"
          if [ -n "$found" ]; then
            echo "::error::a commit names an AI as its co-author; reword it without the trailer"
            echo "$found"
            exit 1
          fi

  # Fast checks that need no Rust build.
  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Harbor
        run: uv tool install harbor==0.25.0
      - uses: extractions/setup-just@v2
      - name: Each oracle is its task's reference bot
        # The Justfile's `check-solution`: every source file, and the model
        # the bot reads, if any, for each task in bench/tasks/tasks.just.
        run: just check-solution
      - name: Lint every task
        # Images are pinned by `just release`; between releases a task may
        # point at an unpinned local tag.
        run: |
          for task in bench/tasks/*/; do
            harbor lint "$task" --select ALL --ignore unpinned-image
          done
      - name: The play viewer's script parses
        # viewer.html is embedded in mtx; a syntax error would only show as a
        # blank page.
        run: |
          sed -n '/<script>/,/<\/script>/p' crates/cli/src/viewer.html | sed '1d;$d' > "$RUNNER_TEMP/viewer.js"
          node --check "$RUNNER_TEMP/viewer.js"
      - name: Scenarios carry a reference baseline
        # The rest of a scenario, its mandate included, is checked by
        # crates/grader/tests/files.rs. A task that keeps its reference out of
        # practice (`practice_reference = false` in task.toml) carries none:
        # agents shown the reference's PnL tune toward it.
        run: |
          for f in bench/tasks/*/environment/practice/*.json; do
            task="${f%%/environment/*}"
            if grep -q '^practice_reference *= *false' "$task/task.toml"; then
              echo "$f: no baseline expected ($task hides its reference from practice)"
              jq -e '(.reference_pnl_usd == null) and (.path | length > 0)' "$f" > /dev/null \
                || { echo "::error file=$f::a hidden reference's practice scenario has a baseline, or no path"; exit 1; }
              continue
            fi
            jq -e '(.reference_pnl_usd | type == "number") and (.path | length > 0)' "$f" > /dev/null \
              || { echo "::error file=$f::missing reference_pnl_usd or path"; exit 1; }
          done

  # The image the Rust jobs run in: built first when bench/ci changes, so no
  # job races a stale one (see ci-image.yml).
  ci-image:
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  rust:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ${{ needs.ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and libraries
        if: needs.ci-image.outputs.prebuilt != 'true'
        run: bash bench/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo +nightly fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: mtx-kit, every feature
        # The workspace builds mtx-kit with the features its users ask for;
        # the rest (adapters no bot uses yet, test-util) only build here.
        run: |
          cargo clippy -p mtx-kit --all-features --all-targets -- -D warnings
          cargo test -p mtx-kit --all-features
      - name: Strategy components
        # The starter, the references and the spot, pool and router smokes build for
        # wasm32-wasip2 too, as do the kit's spot venue decoders, the
        # flash-crash reference's and the spot smoke's components load in
        # the grader's host, the probe's sheet and market round-trip
        # through the interface, and the raw-send probe is answered in a
        # session as its scenario allows.
        run: |
          rustup target add wasm32-wasip2
          for package in mtx-bot-starter mtx-bot-printer mtx-bot-first-strategy mtx-bot-spot-smoke mtx-bot-amm-smoke mtx-bot-router-smoke mtx-bot-wit-probe mtx-bot-raw-probe mtx-bot-actors-smoke mtx-bot-rfq-desk mtx-bot-rfq-dust $(just --evaluate reference_packages); do
            cargo clippy -p "$package" --lib --target wasm32-wasip2 -- -D warnings
          done
          cargo clippy -p mtx-kit --no-default-features --features component,venue,phoenix-v1-venue,openbook-v2-venue,raydium-clmm,meteora-dlmm --lib --target wasm32-wasip2 -- -D warnings
          just --justfile bots/starter/Justfile build
          just --justfile bench/tasks/flash-crash-spcx/reference/Justfile build
          just --justfile bots/spot-smoke/Justfile build
          just --justfile bots/wit-probe/Justfile build
          just --justfile bots/raw-probe/Justfile build
          MTX_TEST_WASM="$PWD/bench/tasks/flash-crash-spcx/reference/bot.wasm" MTX_TEST_PROBE_WASM="$PWD/bots/wit-probe/bot.wasm" \
            cargo test -p mtx-grader wasm::tests -- --ignored
          MTX_TEST_SPOT_WASM="$PWD/bots/spot-smoke/buyer/bot.wasm" cargo test -p mtx-grader the_spot_smoke_component -- --ignored
          MTX_TEST_RAW_PROBE_WASM="$PWD/bots/raw-probe/bot.wasm" \
            cargo test -p mtx-grader raw::tests -- --ignored

  # The tasks `gates` checks: those a pull request or a push to main
  # changes, or the one (or every task) a manual run names. A JSON array, for
  # the `gates` matrix.
  changed-tasks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which tasks
        id: tasks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          TASK: ${{ inputs.task }}
        run: |
          git config --global --add safe.directory "$PWD"
          case "$EVENT" in
            pull_request) changed="$(git diff --name-only "origin/$BASE_REF...HEAD" -- bench/tasks)" ;;
            push) git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
                    && changed="$(git diff --name-only "$BEFORE" HEAD -- bench/tasks)" || changed= ;;
            *) changed= ;;
          esac
          if [ "$EVENT" = workflow_dispatch ]; then
            candidates="${TASK:-$(ls bench/tasks)}"
          else
            candidates="$(echo "$changed" | sed -n 's|^bench/tasks/\([^/]*\)/.*|\1|p' | sort -u)"
          fi
          # Deleted or renamed-away tasks have no task.toml left to gate.
          tasks=
          for task in $candidates; do
            [ -f "bench/tasks/$task/task.toml" ] && tasks="$tasks $task"
          done
          # shellcheck disable=SC2086 # task names hold no spaces
          echo "tasks=$(jq -cn '$ARGS.positional' --args $tasks)" >> "$GITHUB_OUTPUT"
          echo "gating:${tasks:- nothing changed}"

  # The quality bar's cheap checks (`mtx gates --fast`: task files, a
  # one-set ladder) for each task a pull request or a push to main changes,
  # one job a task; run by hand, for one task (or all), with the reports
  # uploaded. The fast ladder takes about half an hour a task on 16 cores,
  # which the matrix spreads over runners. The image checks (a full
  # `mtx gates`) need Docker and Harbor: run those on a dev machine.
  gates:
    name: gates (${{ matrix.task }})
    needs: [ci-image, rust, changed-tasks]
    if: github.event_name != 'schedule' && needs.changed-tasks.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.changed-tasks.outputs.tasks) }}
    container:
      image: ${{ needs.ci-image.outputs.image }}
      # Bots run as their own users; the grader needs to switch to them.
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and libraries
        if: needs.ci-image.outputs.prebuilt != 'true'
        run: bash bench/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for the matrix: every job builds the same mtx.
          shared-key: gates
      - name: Build mtx
        run: cargo build --release --locked -p mtx-cli
      - name: mtx gates
        env:
          TASK: ${{ matrix.task }}
        run: |
          status=0
          target/release/mtx gates "$TASK" --fast > /dev/null || status=1
          cat "target/gates/$TASK/gates.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: gates-${{ matrix.task }}
          path: target/gates

  # The expensive end-to-end check: build the task image from this commit and
  # run the oracle through Harbor. Weekly and on demand only.
  image:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - uses: docker/setup-buildx-action@v3
      - name: Install Harbor
        run: uv tool install harbor==0.25.0
      - name: Build the task image
        run: just image
      - name: The oracle grades as the reference, on a fresh hidden set
        # The verifier grades the reference on the same drawn sessions, and
        # the world waits for each bot's turn, so the oracle (the reference
        # itself) scores skill 1 exactly.
        run: |
          export MTX_EVAL_SEED="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          harbor run -p bench/tasks/flash-crash-spcx -a oracle -o jobs
          skill=$(jq '.skill' "$(find jobs -name reward.json | head -1)")
          echo "oracle skill: $skill"
          jq -en "$skill > 0.999 and $skill < 1.001" > /dev/null
