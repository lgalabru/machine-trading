name: Specs

# The Machine Trading Protocol site: specs/ rendered by specs/site/build.mjs,
# served by this repository's GitHub Pages at lgalabru.github.io/machine-trading.
# It carries the benchmark too, at /bench/: every release in bench/results,
# shown by the same page `mtx bench review` serves, with its data written out
# as files (`mtx bench export`). Publishing a release (committing
# bench/results/<version>) republishes the site.
# Pushes to main publish it; pull requests only build it.
on:
  push:
    branches: [main]
    paths: ["specs/**", "bench/results/**", "crates/**", "Cargo.lock", ".github/workflows/specs.yml"]
  pull_request:
    paths: ["specs/**", "bench/results/**", "crates/**", "Cargo.lock", ".github/workflows/specs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    # bench/ci/Dockerfile: the Rust build's system libraries, preinstalled.
    container: ghcr.io/solana-foundation/machine-trading-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: specs/site/package-lock.json
      - name: Build the site
        working-directory: specs/site
        run: |
          npm ci
          npm run build
      - uses: Swatinem/rust-cache@v2
      - name: Export the benchmark
        run: |
          cargo build --release --locked -p mtx-cli
          target/release/mtx bench export specs/site/_site/bench --site https://lgalabru.github.io/machine-trading
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: specs/site/_site

  deploy:
    needs: site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
