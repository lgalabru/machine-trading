sources = ["Solana public RPC getBlock (json, full transactions, maxSupportedTransactionVersion 1): 300 blocks in six runs of 50 consecutive slots, two per regime window", "Solana public RPC getBlock (rewards only): one slot per 1,500 from 468167733 to 468817233 (about 39 h), the leader's fee reward per block, for the regimes", "Solana public RPC getBlockProduction (current epoch), getVoteAccounts, getRecentPerformanceSamples, getAccountInfo (to check each hot account's program and mints)", "Jito public validator list (kobe.mainnet.jito.network /api/v1/validators) and six polls of the tip floor (bundles.jito.wtf /api/v1/bundles/tip_floor), 3 minutes apart"]
limits = ["Price per block and account: the 25th percentile of the compute-unit price among the landed transactions that write it and pay a price, when the account is contended: their consumed compute units at least 2% of the 12M account cap (10% of the 100M block cap for the block); 0 otherwise. Unpriced transactions are left out because most land through Jito bundles that pay tips instead (about two thirds of non-vote transactions carry no price); the percentile rather than the minimum keeps one outlier from setting the price.", "Utilization counts consumed compute units, not requested ones: requested limits (and the 200k-per-instruction default) add up to more than the block cap in ordinary blocks, while the scheduler refunds what isn't used.", "amm_pool pools three SOL/USDC pools, each its own sample: Orca Whirlpool Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE, Raydium CLMM 3ucNos4NbumPLZNWztqGHNFFgkHeRMBQAVemeeomsUxv, Meteora DLMM BGm1tav58oGcsQJehL9WXBFXF7D27vZsKefj4xJKD5Y (program owner and both mints checked on chain).", "oracle is Pyth's SOL/USD push feed 7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE (feed id checked): its updates are small transactions, so it is never contended by the threshold; its price parameters are amm_pool's, unused while p_contended is 0.", "book has no sample: Phoenix v1 SOL/USDC (4DoNfFBfF7UokCC2FQzriy7yHK6DY6NVdYpuekQ5pRgg) and OpenBook v2 had no transactions in the 300 blocks, and Phoenix Eternal's perp markets weren't identified. Every ghost.book number copies amm_pool; observed.book copies amm_pool's quantiles with n = 0 to mark that it has no sample of its own.", "Regimes come from the leader's fee reward per block (half the base fees plus the priority fees, tips excluded) sampled every 1,500 slots: calm below its median (6023057 lamports), spike at or above its 95th percentile (31267392), busy between. Per-slot transitions take each regime's stay probability over 1,500 slots to the 1/1,500th power and split the rest in proportion to the observed moves; 39 hours hold few regime switches (spike: [7, 13, 2]).", "The windows are labelled by that same series: calm is 2026-11-13 near 05:30-06:00 UTC, busy 2026-11-12 15:45-15:50 UTC (US open hours), spike 2026-11-11 18:20-18:52 UTC, the highest sustained fee rewards of the scan. No token launch was identified in it; a launch-day spike is likely higher.", "log_price_mean and log_price_sd are not moment estimates: for every class and regime with at least 30 samples they minimise the realism gate's distance, max(|F_sim(0) - zero_share|, |F_sim(q) - p/100| over the observed (p, q > 0)), for the model simulated over 20000 slots with the regime pinned, p_contended = 1 - zero_share, the AR(1) at the class's phi and price = round(exp(x)) (a 0.1 x 0.05 grid on (mean, sd), then a 0.01 x 0.005 one around its best, on one fixed draw). The moment fit's sd was too wide for the body of the distribution.", "phi is the lag-1 correlation of the log price across consecutive slots where both are contended; where fewer than 10 such pairs exist it is the default 0.6 (said per class in its source).", "Slots are about 215 ms (getRecentPerformanceSamples), not 400 ms; per-slot rates here are per slot as sampled.", "inversion_p is not fitted (block order mixes Jito bundles, which can't be told apart from the RPC): a default.", "Tips: a lognormal fitted by least squares to the medians of six tip-floor polls' percentiles (landed tips over the engine's recent window); the real distribution has a floor at 1,000 lamports and a heavier tail, so p25 and p99 are the poll medians, not the lognormal's.", "The spike window's high fees were block-wide, not on these pools: amm_pool's spike regime is less often contended than its busy one (6% vs 18%), with a log-sd of about 5 from 18 contended samples (a few priced at single micro-lamports, one near 700k). A task that wants a local spike on a pool pins a regime window in its scenario rather than relying on this one.", "One sample of 300 blocks over two days; other days would add day-to-day spread."]

