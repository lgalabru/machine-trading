# Opening-window jump bounds, one table per asset (the key is the
# calibration's `meta.asset`). HAND-MAINTAINED: the fitter does not write it,
# and the calibration files beside it stay exactly as the fitter wrote them.
#
# What it holds: the highest jump regime the data supports for a stated
# session spec (`jump_rate_per_hour`, `jump_size`), measured in the
# instrument's opening hour (09:31-10:30 New York) with the calibration's own
# jump rule (a 1 m regular-hours return beyond 5 robust sigmas of the trailing
# hour). The realism gate's `stated_regime_bound` check fails a spec that
# states more. The numbers are the table in docs/market-calibration.md
# ("Measured reference values"), from calibration/ JUMP_REGIME_MEASUREMENT
# (Phoenix 1 m mark candles in the fitter's archives, which end 2026-11-12;
# SPCX's ends 2026-11-10). `earnings_per_hour` is the allowance for a spec
# that sets `earnings_day = true`, where the data showed one.
#
# An asset with no table here is bounded by its calibration's all-session
# rate and sizes.

[nvda]
per_hour = 2.75
abs_size_median_pct = 0.305
abs_size_p90_pct = 0.533
measured_from = "2026-06-10"
measured_through = "2026-11-12"
source = "docs/market-calibration.md, Measured reference values (opening hour, NVDA row); Phoenix NVDA 1 m mark candles"

[tsla]
per_hour = 3.9
abs_size_median_pct = 0.382
abs_size_p90_pct = 0.652
earnings_per_hour = 6.7
measured_from = "2026-06-17"
measured_through = "2026-11-12"
source = "docs/market-calibration.md, Measured reference values (opening hour, TSLA row; 6.7 an hour is the opening hour of the three earnings-reaction days, 3 hours of data); Phoenix TSLA 1 m mark candles"

