# The funding-carry reference (bots/carry) as a wasm strategy. Its own
# workspace: it builds for wasm32-wasip2 only, which the repository's
# workspace doesn't target.
[package]
name = "mtx-bot-carry-wasm"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
mtx-kit = { path = "../../crates/kit", default-features = false, features = ["component", "venue"] }

[workspace]

[profile.release]
opt-level = "s"
