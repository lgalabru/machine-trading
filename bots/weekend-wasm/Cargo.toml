# The weekend-gap reference (bots/weekend) as a wasm strategy. Its own
# workspace: it builds for wasm32-wasip2 only, which the repository's
# workspace doesn't target.
[package]
name = "mtx-bot-weekend-wasm"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
borsh = "1"
bs58 = "0.5"
mtx-kit = { path = "../../crates/kit", default-features = false, features = ["component", "venue"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = "s"
