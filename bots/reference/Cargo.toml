# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-reference"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "mtx-reference"
path = "src/main.rs"

[dependencies]
anyhow = "1"
mtx-botkit = { path = "../../crates/botkit" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
