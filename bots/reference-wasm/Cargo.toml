# The flash-crash reference (bots/reference) as a wasm strategy: the spike of
# docs/rfd/0002-wasm-strategies.md. Its own workspace: it builds for
# wasm32-wasip2 only, which the repository's workspace doesn't target.
[package]
name = "mtx-bot-reference-wasm"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
mtx-kit = { path = "../../crates/kit", default-features = false, features = ["component"] }

[workspace]

[profile.release]
opt-level = "s"
