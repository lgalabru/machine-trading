# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-weekend"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "mtx-weekend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
borsh = "1"
bs58 = "0.5"
mtx-kit = { path = "../../crates/kit" }
serde_json = "1"
solana-rpc-client-api = "4.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
