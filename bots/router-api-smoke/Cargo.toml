# No workspace inheritance: bots build outside this workspace too.
[package]
name = "mtx-bot-router-api-smoke"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "mtx-router-api-smoke"
path = "src/main.rs"

[dependencies]
mtx-kit = { path = "../../crates/kit" }
serde_json = "1"
base64 = "0.22"
solana-message = "4"
solana-transaction = "4.3"
solana-rpc-client-api = "4.3"
