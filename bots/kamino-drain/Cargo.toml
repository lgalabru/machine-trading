# No workspace inheritance: bots build outside this workspace too.
[package]
name = "mtx-bot-kamino-drain"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "mtx-kamino-drain"
path = "src/main.rs"

[dependencies]
anyhow = "1"
mtx-kit = { path = "../../crates/kit" }
solana-system-interface = { version = "3", features = ["wincode"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
