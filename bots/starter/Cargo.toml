# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-starter"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "mtx-starter"
path = "src/main.rs"

[dependencies]
mtx-botkit = { path = "../../crates/botkit" }
tracing = "0.1"
# Not used by the starter: the tasks' oracle solutions (`solution/solve.sh`)
# are built in this crate, and use these, as the starter did before 0.11.0.
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
