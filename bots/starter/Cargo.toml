# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-starter"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# A strategy component: `just build` builds it for wasm32-wasip2 into bot.wasm,
# which the grader loads and calls (docs/rfd/0002-wasm-strategies.md).
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# `mtx_kit::features` and `mtx_kit::trees` need no feature. Add "candle" for
# small neural networks (`mtx_kit::candle`, `mtx_kit::nn`); it is off here
# because it adds about 1 MB to the component.
[dependencies]
mtx-kit = { path = "../../crates/kit", default-features = false, features = ["component", "venue"] }
