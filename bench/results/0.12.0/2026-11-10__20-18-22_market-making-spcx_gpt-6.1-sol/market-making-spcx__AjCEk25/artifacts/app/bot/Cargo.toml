# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "bot"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "bot"
path = "src/main.rs"

[dependencies]
mtx-kit = { path = "/opt/mtx/sdk/crates/kit" }
tracing = "0.1"
# Not used by the starter: the tasks' oracle solutions (`solution/solve.sh`)
# are built in this crate, and use these, as the starter did before 0.11.0.
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde_json = "1"
bs58 = "0.5"

solana-rpc-client-api = "4.3"
