# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "spcx-shock-bot"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "spcx-bot"
path = "src/main.rs"

[dependencies]
mtx-kit = { path = "/opt/mtx/sdk/crates/kit" }
tracing = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
