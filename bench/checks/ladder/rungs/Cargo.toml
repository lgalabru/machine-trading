# The ladder's fixed rungs (see ../README.md). Outside the repository's
# workspace, like the exploit bots: they never ship in a task image.
[package]
name = "mtx-ladder-rungs"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
mtx-botkit = { path = "../../../../crates/botkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
