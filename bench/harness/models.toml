# The models `just bench` runs in Hermes by a short name, one table each:
#   api       how Hermes talks to the model: openai (OpenAI's Responses
#             API), anthropic (Anthropic's Messages API) or chat (OpenAI
#             chat completions, which OpenRouter, Gemini and most hosts serve)
#   upstream  the provider's API root, which the bench's key proxy forwards to
#   model     the provider's name for the model
#   reasoning "openrouter" for OpenRouter: the proxy turns the effort Hermes
#             sends into OpenRouter's form
#   key       the environment variable on the bench machine holding the
#             provider's key (from .env or ~/.machine-trading.env); only the
#             proxy reads it, trials get a token
# A name not listed here runs as before: `openai/<model>`, or Anthropic's
# for a bare name. Check a name and its key with `just preflight <name>`.

[gpt-6-1-sol]
api = "openai"
upstream = "https://api.openai.com/v1"
model = "gpt-6.1-sol"
key = "OPENAI_API_KEY"

[claude-opus-5-5]
api = "anthropic"
upstream = "https://api.anthropic.com"
model = "claude-opus-5-5"
key = "ANTHROPIC_API_KEY"

[gemini-3-1-pro]
api = "chat"
upstream = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-3.1-pro-preview"
key = "GEMINI_API_KEY"

[muse-spark-1-3]
api = "chat"
upstream = "https://openrouter.ai/api/v1"
reasoning = "openrouter"
model = "meta/muse-spark-1.3"
key = "OPENROUTER_API_KEY"

[kimi-k3]
api = "chat"
upstream = "https://openrouter.ai/api/v1"
reasoning = "openrouter"
model = "moonshotai/kimi-k3"
key = "OPENROUTER_API_KEY"

[glm-5-3]
api = "chat"
upstream = "https://openrouter.ai/api/v1"
reasoning = "openrouter"
model = "z-ai/glm-5.3"
key = "OPENROUTER_API_KEY"

[nemotron-3-ultra]
api = "chat"
upstream = "https://openrouter.ai/api/v1"
reasoning = "openrouter"
model = "nvidia/nemotron-3-ultra-550b-a55b"
key = "OPENROUTER_API_KEY"

[inkling]
api = "chat"
upstream = "https://openrouter.ai/api/v1"
reasoning = "openrouter"
model = "thinkingmachines/inkling"
key = "OPENROUTER_API_KEY"
