# BlockRun (https://blockrun.ai) on Solana: every model on one gateway, no
# API key or account. The key proxy pays each call in USDC from one wallet
# over x402: the gateway quotes the call (HTTP 402), the proxy signs the
# transfer and sends the call again. SOLANA_WALLET_KEY holds the wallet's
# secret (base58, as the BlockRun SDK and Phantom export it, or
# solana-keygen's JSON array); fund its address (`python3 -I
# bench/harness/models.py wallet blockrun-claude-sonnet-5-5`) with USDC on
# Solana. A call that names no max_tokens is quoted, and capped, at 8,192
# output tokens, and x402 pays the quote, not the tokens used: set
# max_tokens on a table to give a model more room, at that price a call.
# Cap the batch with MTX_X402_BUDGET_USD.

[blockrun-claude-sonnet-5-5]
api = "chat"
pay = "x402-solana"
upstream = "https://sol.blockrun.ai/api/v1"
model = "anthropic/claude-sonnet-5.5"
key = "SOLANA_WALLET_KEY"

[blockrun-claude-opus-5-5]
