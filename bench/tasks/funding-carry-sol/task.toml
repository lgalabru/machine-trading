schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/funding-carry-sol"
version = "0.15.0"
description = "Write a bot that trades Phoenix's SOL perp for the funding its premium pays, a small, slow basis measured on mainnet, against the fees, the index's moves, an arbitrageur that keeps the book on the index and its own price impact, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "funding", "basis", "carry", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
# Every Phoenix Eternal market a cross-margin account can trade, SOL among them.
snapshot = "phoenix-perps-2026-11-13"

[metadata.mtx]
# What the repository's lists are written from (`mtx task sync`).
generator = "funding-carry-sol"
emoji = "🪙"
market = "Phoenix SOL perp"
summary = "collects Phoenix's funding on SOL's premium, measured on mainnet, when it pays for the fees, the impact and the index's risk, and sizes it by how rich the session's basis is"
skill = "prices the carry Phoenix will actually pay on the session's clock, weighs it against what trading costs, and reads how rich this session's basis is"
# Lines only the answers hold, for `just leak-audit`.
leak_needles = ["what a desk that had watched SOL's basis for days would know", "a slow basis and no view"]
headline = "v2"

[verifier]
# Seventy-two hidden sessions drawn from the batch's secret, graded with
# the reference and then the informed bot on the same sessions first, four
# sessions at a time each, then the bot's, four at a time. Each session
# onboards the pinger's accounts and the library's takers first (a few
# seconds), then the world moves only between the bot's turns, so a
# session takes as long as the bot thinks: about a minute and a half for
# the anchors (1,440 to 1,920 slots), a few minutes at worst. Every session
# is graded, a breached one too (scoring v2).
timeout_sec = 21600.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[verifier.environment]
# The verifier's image, built by `just image` from tests/ and pinned by
# `just release`: the runtime image with this task's tests in it. The rest
# as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.15.0-funding-carry-sol-verifier"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.15.0-funding-carry-sol"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment.env]
# For `time-left`: the agent's limit, [agent] timeout_sec times the run's
# --agent-timeout-multiplier (pass it through as MTX_AGENT_TIMEOUT_MULTIPLIER).
MTX_AGENT_TIMEOUT_SEC = "3600"
MTX_AGENT_TIMEOUT_MULTIPLIER = "${MTX_AGENT_TIMEOUT_MULTIPLIER:-1}"
