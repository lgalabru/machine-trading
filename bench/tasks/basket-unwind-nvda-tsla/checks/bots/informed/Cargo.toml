# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-basket-unwind-nvda-informed"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# The informed bot: a component on wasm32-wasip2 (`bot.wasm`), since a
# process trades the primary market only; and a library for the process
# below.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "mtx-basket-unwind-nvda-informed"
path = "src/main.rs"

[dependencies]
mtx-bot-basket-unwind-nvda = { path = "../../../reference", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit", default-features = false, features = ["component", "venue"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit" }
