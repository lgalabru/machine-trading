schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/phoenix-flash-crash"
version = "0.8.0"
description = "Write a bot that trades Phoenix SPCX (SpaceX) perps through flash crashes and squeezes, some of which never revert, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTH_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-spcx-2026-10-29"

[verifier]
# Thirty-six hidden scenarios of 80-180 seconds of market time each (~125s
# on average), one at a time, plus ~20 seconds of setup per session: ~90
# minutes, ~2 hours at worst. Twelve were too few: a good bot's edge is
# about $50 a session against swings of about $240, so a small hidden set
# ranked bots by the luck of its draw.
timeout_sec = 10800.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[environment]
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"
