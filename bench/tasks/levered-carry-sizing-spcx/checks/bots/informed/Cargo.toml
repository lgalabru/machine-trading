# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-levcarry-informed"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[[bin]]
name = "mtx-levcarry-informed"
path = "src/main.rs"

[dependencies]
mtx-bot-levcarry = { path = "../../../reference" }
mtx-kit = { path = "../../../../../../crates/kit" }
