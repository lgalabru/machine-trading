# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-levcarry"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# The strategy: a component on wasm32-wasip2 (`bot.wasm`, what the task
# grades, and its oracle solution), and a library for the process below.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# The same strategy as a process (`bin/bot`): the anchor hidden sets are
# scored against, and the ladder's rungs.
[[bin]]
name = "mtx-levcarry"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
mtx-kit = { path = "../../../../crates/kit", default-features = false, features = ["component", "venue"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mtx-kit = { path = "../../../../crates/kit" }
