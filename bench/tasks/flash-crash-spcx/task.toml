schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/flash-crash-spcx"
version = "0.12.0"
description = "Write a bot that trades Phoenix SPCX (SpaceX) perps through flash crashes and squeezes, some of which never revert, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-spcx-2026-10-29"

[metadata.mtx]
# What the repository's lists are written from (`mtx task sync`).
generator = "flash-crash"
emoji = "📉"
market = "Phoenix SPCX perp"
summary = "fades crashes and squeezes on the SPCX perp that revert, and survives the ones that don't"
skill = "fades crashes and squeezes that revert, and survives the ones that don't"
# Lines only the answers hold, for `just leak-audit`.
leak_needles = ["ride each move while it runs", "then fade it once it stops"]

[verifier]
# Seventy-two hidden sessions drawn from the batch's secret, plus the
# reference on the same sessions first: four of its sessions at a time,
# and of the bot's as many as the memory holds (two in 6 GB). The
# world moves only between the bot's turns, so a session takes as long as
# the bot thinks: a minute or two for most bots, about four at worst. A
# disqualified bot stops at its first breach.
timeout_sec = 14400.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[verifier.environment]
# The verifier's image, built by `just image` from tests/: the runtime
# image with this task's tests in it. The rest as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-flash-crash-spcx-verifier@sha256:d5de44dc1faf6014f3b4a61485940ae436e070f20aa3e61e774427b1360d7532"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-flash-crash-spcx@sha256:fcfb6e049f62c3e0ff85cd81417672d9a1dce26515c4892c60c1f7ccb2c2d31b"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

