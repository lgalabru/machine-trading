schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/weekend-gap-spcx"
version = "0.12.0"
description = "Write a bot that trades Phoenix SPCX (SpaceX) perps over a weekend, while SpaceX's own market is closed and Phoenix prices the index from its own book, and through the reopen, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "surfpool", "rust", "price-discovery"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-spcx-2026-10-29"
# The reference is graded on the hidden sessions only: practice scenarios
# carry no baseline, and practice grades don't run it.
practice_reference = false

[metadata.mtx]
# What the repository's lists are written from (`mtx task sync`).
generator = "weekend-gap"
emoji = "🌙"
market = "Phoenix SPCX perp"
summary = "reads which weekend flow on the SPCX perp knows where SPCX will open, and holds that gap into the reopen"
skill = "reads which weekend flow knows where SPCX will open, and holds that gap into the reopen"
# Lines only the answers hold, for `just leak-audit`.
leak_needles = ["hold the gap into the reopen"]

[verifier]
# Seventy-two hidden sessions drawn from the batch's secret, plus the
# reference on the same sessions first (four at a time). The world moves
# only between the bot's turns, so a session takes as long as the bot
# thinks: under a minute for most bots, under four at worst (half a second
# a step over 400 steps). A bot that never answers the turn protocol runs
# each session in real time, one at a time: about 2.7 h for 72. A
# disqualified bot stops at its first breach.
timeout_sec = 18000.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[verifier.environment]
# The verifier's image, built by `just image` from tests/: the runtime
# image with this task's tests in it. The rest as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-weekend-gap-spcx-verifier"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-weekend-gap-spcx"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment.env]
# For `time-left`: the agent's limit, [agent] timeout_sec times the run's
# --agent-timeout-multiplier (pass it through as MTX_AGENT_TIMEOUT_MULTIPLIER).
MTX_AGENT_TIMEOUT_SEC = "3600"
MTX_AGENT_TIMEOUT_MULTIPLIER = "${MTX_AGENT_TIMEOUT_MULTIPLIER:-1}"
