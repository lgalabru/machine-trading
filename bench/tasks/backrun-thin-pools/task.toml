schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/backrun-thin-pools"
version = "0.14.0"
description = "Write a bot that backruns large swaps on ten thin Orca and Raydium concentrated pools over SOL, USDC, JitoSOL, JTO and GEOD, searching the graph of pools for the cycle each swap opened and closing it atomically in the swap's own slot, against competing searchers, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "amm", "orca", "raydium", "clmm", "backrun", "atomic-arbitrage", "cycle", "jitosol", "jito", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "thin-pools-2026-11-21"

[metadata.mtx]
generator = "backrun-thin-pools"
anchor = "backrun-thin-pools"
# Amm sessions, atomic groups and trigger steps reach only strategy
# components: the image builds both anchors' bot.wasm and grades with them.
component_anchors = true
emoji = "🕸️"
market = "Orca Whirlpool and Raydium CLMM, ten pools over SOL, USDC, JitoSOL, JTO and GEOD"
summary = "backruns large swaps on thin concentrated pools by searching the graph of ten pools for the cycle each swap opened, skipping cycles whose fees eat the gap, and closing it atomically in the swap's slot"
skill = "searches a graph of pools for the cycle that the latest swap opened, and skips cycles whose fees eat the gap"
# Lines only the answers hold, for `just leak-audit`.
leak_needles = ["weighs the chance no rival above it reaches the slot", "which for one that looks only at a pair's two pools may be far less"]
headline = "v2"

[verifier]
# 144 hidden sessions drawn from the batch's secret (twice most tasks':
# DESIGN.md, "Statistical power"), graded with
# the reference and then the informed bot on the same sessions first, four
# sessions at a time each, then the bot's, four at a time. The world moves
# only between the bot's turns, so a session takes as long as the bot
# thinks: about fifteen seconds for the anchors (200 to 400 steps over ten
# pools), a few minutes at worst. Every session is graded, a breached one too (scoring
# v2).
timeout_sec = 14400.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"
# While it works, the agent reaches its model (the bench adds the key proxy's
# address) and the crates registry, and nothing else: ghcr.io and github.com
# hold the full grader and the reference bots. The install before it runs
# keeps [environment]'s network. `just network-probe` checks it.
network_mode = "allowlist"
allowed_hosts = ["crates.io", "index.crates.io", "static.crates.io"]

[verifier.environment]
# The verifier's image, built by `just image` from tests/: the runtime
# image with this task's tests in it. The rest as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.14.0-backrun-thin-pools-verifier@sha256:40249d36e45c744d5aa14f1cce23b5ba6be9add91ddf74e94333b4b017039029"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.14.0-backrun-thin-pools@sha256:dd1d6c35948200df7a68205f51a836927f1618ca5f03c58bb32bc33ea956fb8f"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

