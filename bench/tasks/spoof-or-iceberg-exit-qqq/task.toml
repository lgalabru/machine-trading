schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/spoof-or-iceberg-exit-qqq"
version = "0.1.0"
description = "A bot sells an inherited long in the Phoenix QQQ perp by the close, timing the sale on what the large orders on the book turn out to be: walls pulled as the price comes, or icebergs that reload where they stand."
keywords = ["solana", "trading", "phoenix", "perpetuals", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-perps-2026-11-13"

[metadata.mtx]
generator = "spoof-or-iceberg"
anchor = "spoof-or-iceberg-exit"
emoji = "🆕"
market = "Phoenix QQQ perp"
summary = "tells a wall that will be pulled from an order that will trade, by its owner's behaviour over time, and times its sale on what each says the price is about to do"
skill = "tells a wall that will be pulled from an order that will trade, by its owner's behaviour over time, and times its sale on what each says the price is about to do"
leak_needles = ["wall is followed by its side and price", "the told wallet that sent a transaction in the slot"]
headline = "v2"

[verifier]
# Seventy-two hidden sessions drawn from the batch's secret, plus the
# reference on the same sessions first: four of its sessions at a time,
# and of the bot's as many as the memory holds (two in 6 GB). The
# world moves only between the bot's turns, so a session takes as long as
# the bot thinks: a minute or two for most bots, about four at worst. A
# disqualified bot stops at its first breach.
timeout_sec = 14400.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"
# While it works, the agent reaches its model (the bench adds the key proxy's
# address) and the crates registry, and nothing else: ghcr.io and github.com
# hold the full grader and the reference bots. The install before it runs
# keeps [environment]'s network. `just network-probe` checks it.
network_mode = "allowlist"
allowed_hosts = ["crates.io", "index.crates.io", "static.crates.io"]

[verifier.environment]
# The verifier's image, built by `just image` from tests/: the runtime
# image with this task's tests in it. The rest as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-spoof-or-iceberg-exit-qqq-verifier"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-spoof-or-iceberg-exit-qqq"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

