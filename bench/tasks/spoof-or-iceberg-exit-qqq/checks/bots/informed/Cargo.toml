# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-spoof-or-iceberg-exit-informed"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# The strategy: a component on wasm32-wasip2 (`bot.wasm`, what the ladder
# runs), and a library for the process below.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "mtx-spoof-or-iceberg-exit-informed"
path = "src/main.rs"

[dependencies]
mtx-bot-spoof-or-iceberg-exit = { path = "../../../reference", default-features = false }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit", default-features = false, features = ["component", "venue"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit" }
