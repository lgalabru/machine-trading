# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-spoof-or-iceberg-exit-informed"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# The strategy, and the process the ladder and the verifier run
# (`bin/bot`): only they hand a bot its session's latent state, so it is
# never a component.
[lib]
path = "src/lib.rs"

[[bin]]
name = "mtx-spoof-or-iceberg-exit-informed"
path = "src/main.rs"

[dependencies]
mtx-bot-spoof-or-iceberg-exit = { path = "../../../reference" }
mtx-kit = { path = "../../../../../../crates/kit" }
serde_json = "1"
