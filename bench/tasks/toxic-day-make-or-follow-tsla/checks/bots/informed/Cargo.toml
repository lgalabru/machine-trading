# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-toxic-day-make-or-follow-informed"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# The strategy: a component (`bot.wasm`) the ladder runs told the session's
# latent state, and the same as a process (`bin/bot`).
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "mtx-toxic-day-make-or-follow-informed"
path = "src/main.rs"

[dependencies]
mtx-bot-toxic-day-make-or-follow = { path = "../../../reference", default-features = false }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit", default-features = false, features = ["component", "venue"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit" }
