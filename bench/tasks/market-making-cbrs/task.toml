schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/market-making-cbrs"
version = "0.15.0"
description = "Write a bot that makes markets in Phoenix's CBRS (Cerebras) perp, a thin, wide book, against a competing maker, an arbitrageur and taker flow measured from mainnet, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "market-making", "cerebras", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-cbrs-2026-11-25"

[metadata.mtx]
# What the repository's lists are written from (`mtx task sync`).
generator = "market-making-cbrs"
# Its sessions have library actors, and the informed bot reads its latent
# state as a strategy component: the image builds both anchors' bot.wasm.
component_anchors = true
emoji = "⚖️"
market = "Phoenix CBRS perp"
summary = "earns the wide CBRS spread from takers measured on mainnet, against a competing maker and an arbitrageur that picks off stale quotes"
skill = "earns the spread where the flow pays for it, and stays out of the way of informed flow and stale quotes"
# Lines only the answers hold, for `just leak-audit`.
leak_needles = ["one tick inside the competitor", "backs off after one-sided fills"]
headline = "v2"

[verifier]
# Seventy-two hidden sessions drawn from the batch's secret, graded with
# the reference and then the informed bot on the same sessions first, four
# sessions at a time each, then the bot's, four at a time. The world moves
# only between the bot's turns, so a session takes as long as the bot
# thinks: about half a minute for the anchors, a few minutes at worst.
# Every session is graded, a breached one too (scoring v2).
timeout_sec = 14400.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[verifier.environment]
# The verifier's image, built by `just image` from tests/: the runtime
# image with this task's tests in it. The rest as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.14.0-market-making-spcx-verifier@sha256:161f82b0fd26e2a2df6aa37535c85f7c60ef7a3cb98395845249d51194e5d446"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.14.0-market-making-spcx@sha256:080d480eb4f75522411384d72e3d48599016d79cf9090688e3d2e6b58d55a3b9"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

