schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/flash-crash-nvda"
version = "0.15.0"
description = "Write a bot that trades Phoenix NVDA (NVIDIA) perps through crashes and squeezes whose odds come from mainnet's tape, against informed takers and its own price impact, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-perps-2026-11-13"

[metadata.mtx]
# What the repository's lists are written from (`mtx task sync`).
generator = "flash-crash-nvda"
emoji = "📉"
market = "Phoenix NVDA perp"
summary = "trades crashes and squeezes on the NVDA perp at the odds mainnet's tape measured, where most moves keep going, against informed takers and chasers, and sits out the sessions where nothing happens"
skill = "tells a shock from noise, rides the ones that keep going and cuts the ones that turn, and pays for every move it trades"
# Lines only the answers hold, for `just leak-audit`.
leak_needles = ["gives back 1.5% or 30% of the move from its extreme", "as anyone could who knew which accounts to watch"]
headline = "v2"

[verifier]
# Seventy-two hidden sessions drawn from the batch's secret, graded with
# the reference and then the informed bot on the same sessions first, four
# sessions at a time each, then the bot's, four at a time. The world moves
# only between the bot's turns, so a session takes as long as the bot
# thinks: a minute or two for most bots, about four at worst. Every session
# is graded, a breached one too (scoring v2).
timeout_sec = 14400.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[verifier.environment]
# The verifier's image, built by `just image` from tests/: the runtime
# image with this task's tests in it. The rest as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.14.0-flash-crash-nvda-verifier"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.14.0-flash-crash-nvda"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

