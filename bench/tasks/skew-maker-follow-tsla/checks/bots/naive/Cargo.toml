# The ladder's rungs for skew-maker-follow-tsla, each a component on
# wasm32-wasip2 built with its rule (`MTX_NAIVE`) set.
[package]
name = "mtx-bot-skew-maker-follow-naive"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
mtx-bot-skew-maker-follow = { path = "../../../reference", features = ["embedded"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit", default-features = false, features = ["component", "venue"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit" }
