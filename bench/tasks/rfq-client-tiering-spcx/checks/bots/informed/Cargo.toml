# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-rfq-client-tiering-informed"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# The strategy, and the process the ladder and calibration run (`bin/bot`):
# only the ladder and the verifier hand a bot its session's latent state.
[lib]
path = "src/lib.rs"

[[bin]]
name = "mtx-rfq-client-tiering-informed"
path = "src/main.rs"

[dependencies]
mtx-bot-rfq-client-tiering = { path = "../../../reference" }
mtx-kit = { path = "../../../../../../crates/kit" }
