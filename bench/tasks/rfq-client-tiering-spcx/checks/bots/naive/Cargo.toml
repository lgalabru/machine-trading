# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-rfq-client-tiering-naive"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# Each rung a component on wasm32-wasip2: RFQs reach components only.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
mtx-bot-rfq-client-tiering = { path = "../../../reference", features = ["embedded"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit", default-features = false, features = ["component", "venue"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mtx-kit = { path = "../../../../../../crates/kit" }
