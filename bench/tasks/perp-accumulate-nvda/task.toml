schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/perp-accumulate-nvda"
version = "0.1.0"
description = "Write a bot that works a client's capped buy order in Phoenix NVDA perps by the close, against taker flow that may know where the price is going and a book that is thin near the touch, and decides how much to leave to the prime broker, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "execution", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (MTX_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-perps-2026-11-13"

[metadata.mtx]
generator = "perp-accumulate"
anchor = "perp-accumulate"
emoji = "🧺"
market = "Phoenix NVDA perp"
summary = "works a capped NVDA buy order against informed flow and a thin book, and leaves the broker what costs more to buy"
skill = "reads whether one-sided taker flow is informed, paces its buying to how fast the book recovers from its own takes, and leaves to the broker what is cheaper to leave"
leak_needles = ["flow through the grader's maker, buy ahead of informed buying", "scoring v2's 1: the reference's order handling"]
headline = "v2"

[verifier]
# Seventy-two hidden sessions drawn from the batch's secret, plus the
# reference on the same sessions first, four at a time, and the bot's four
# at a time. Every session is graded (scoring v2): a breach is priced, not
# a stop. A session onboards its takers and the grader's maker first, then
# the world moves only between the bot's turns.
timeout_sec = 14400.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[verifier.env]
# The batch's secret: the hidden set is drawn from it inside the verifier.
# Set it on the host (`just bench` draws one per batch); the verifier
# refuses to grade without it.
MTX_EVAL_SEED = "${MTX_EVAL_SEED:-}"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[verifier.environment]
# The verifier's image, built by `just image` from tests/: the runtime
# image with this task's tests in it. The rest as [environment].
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-perp-accumulate-nvda-verifier"
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

[environment]
# Built by `just image` from environment/ (pinned by `just release`):
# Harbor builds nothing when a trial starts. Building the tasks' images
# there, at once, has put one task's files into another's image.
docker_image = "ghcr.io/solana-foundation/machine-trading:0.12.0-perp-accumulate-nvda"
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"

