# No workspace inheritance: this crate also builds inside the task image,
# where /opt/mtx/sdk mirrors this repository's crates/ and bots/ layout.
[package]
name = "mtx-bot-event-follow-through-informed"
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

# The strategy, and the process the ladder and calibration run (`bin/bot`):
# only the ladder hands a bot its session's latent state, so it is never a
# component.
[lib]
path = "src/lib.rs"

[[bin]]
name = "mtx-event-follow-through-informed"
path = "src/main.rs"

[dependencies]
mtx-bot-event-follow-through = { path = "../../../reference" }
mtx-kit = { path = "../../../../../../crates/kit" }
serde_json = "1"
