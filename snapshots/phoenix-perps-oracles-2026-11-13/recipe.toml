name = "phoenix-perps-oracles-2026-11-13"
symbol = "SPCX"

# The perps snapshot with the Pyth price accounts the oracle-fault scenarios
# drive: both feeds of TSLA, NVDA, SPY and QQQ (the US equity feed and the
# xStock's), and SPCX's. It starts offline from the perps snapshot, so its
# markets, marks and every account in it are untouched, and adds the accounts
# as they were on mainnet on 2026-11-13. Each file is the account as
# `solana account <address> --output json` printed it; the build checks it is
# the shard 0 account of the feed id, owned by the Pyth Receiver, and decodes
# as that feed's price update.
#
# The copies are stale: no equity feed has a fresh account on Solana mainnet
# (the newest was updated days before the fetch, the US feeds weeks before).
# A session anchors and rewrites a feed it uses; none should read one as it
# is.

[fork]
from_snapshot = "../phoenix-perps-2026-11-13"

[[warmup]]
action = "pyth-feed-account"
name = "pyth Crypto.TSLAX/USD"
feed_id = "47a156470288850a440df3a6ce85a55917b813a19bb5b31128a33a986566a362"
from_file = "accounts/GpoWLTd6GoisYxYgHz7mTcZvgnfJu4SN7T6PxWjgUTFY.json"

