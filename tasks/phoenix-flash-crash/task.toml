schema_version = "1.4"
# The bot is all the verifier receives from the agent's environment.
artifacts = [{ source = "/app/bot", exclude = ["target"] }]

[task]
name = "solana-foundation/phoenix-flash-crash"
version = "0.1.0"
description = "Write a bot that trades through a flash crash on Phoenix SOL perps, on an offline copy of Solana mainnet."
keywords = ["solana", "trading", "phoenix", "perpetuals", "surfpool", "rust"]

[[task.authors]]
name = "Ludo Galabru"
email = "ludo.galabru@solana.org"

[metadata]
difficulty = "hard"
category = "trading"
# Chain state the task trades on (OTT_SNAPSHOT); see snapshots/<name>/manifest.json.
snapshot = "phoenix-sol-2026-10-27"

[verifier]
# Three hidden scenarios of ~75s of market time each, plus setup per session.
timeout_sec = 1200.0
environment_mode = "separate"
# The grader replays everything from the snapshot; it needs no network, and
# a bot must not reach one.
network_mode = "no-network"

[agent]
timeout_sec = 3600.0
# Created in the base image; owns /app, the shared target dir and its cargo home.
user = "agent"

[environment]
# Agents need package registries and their model API. The chain they trade
# on is a local, offline sandbox either way.
network_mode = "public"
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 6144
os = "linux"
