[package]
name = "mtx-acp"
version.workspace = true
edition.workspace = true
# Imported from Axel (see src/lib.rs), which is Apache-2.0.
license = "Apache-2.0"
publish = false
description = "Claude Code and Codex ACP agents in Rust: they drive the `claude` and `codex` commands, with no Node adapter"

[[bin]]
name = "fake_claude"
path = "src/bin/fake_claude.rs"
test = false
doc = false

[[bin]]
name = "fake_codex"
path = "src/bin/fake_codex.rs"
test = false
doc = false

[[bin]]
name = "codex_acp"
path = "src/bin/codex_acp.rs"
test = false
doc = false

[[bin]]
name = "claude_acp"
path = "src/bin/claude_acp.rs"
test = false
doc = false

[dependencies]
anyhow.workspace = true
chrono = "0.4"
libc.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile = "3"
