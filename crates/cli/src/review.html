async function renderTrial(n, tab) {
  const trial = await api(`/api/trial/${n}`);
  const t = trial.summary;
  trialHeader(n, t, tab);
  if (tab === "sessions") return trialSessions(n, trial);
  if (tab === "agent") return trialAgent(n, trial);
  if (tab === "bot") return trialFiles(n, trial, trial.files.map((f) => f.path), "artifacts/app/bot/");
  if (tab === "logs") return trialLogs(n, trial);
  if (tab === "raw") {
    div(`<details open><summary>verifier/report.json (sessions folded)</summary><pre class="code wrap">${esc(JSON.stringify(trial.report ? { ...trial.report, scenarios: `${(trial.report.scenarios || []).length} sessions: see the Sessions tab` } : null, null, 2))}</pre></details>
      <details><summary>verifier/reward.json</summary><pre class="code">${esc(JSON.stringify(trial.rewards, null, 2))}</pre></details>
      <details><summary>Harbor config</summary><pre class="code">${esc(JSON.stringify(trial.config, null, 2))}</pre></details>
      <details><summary>Timings</summary><pre class="code">${esc(JSON.stringify(trial.timings, null, 2))}</pre></details>
      ${trial.exception ? `<details><summary>Exception</summary><pre class="code wrap">${esc(trial.exception.exception_traceback || JSON.stringify(trial.exception, null, 2))}</pre></details>` : ""}`);
  }
}

function describeAnnotation(a) {
  if (!a) return "";
  if (a.shape) {
    const s = a.shape;
    const parts = [s.direction, s.aftermath].filter(Boolean);
    if (Array.isArray(s.legs)) parts.push(`${s.legs.length} leg${s.legs.length === 1 ? "" : "s"}`);
    return parts.join(" · ") || JSON.stringify(s).slice(0, 60);
  }
  if (Array.isArray(a.informed)) { const k = a.informed.filter(Boolean).length; return k ? `${k} informed orders` : "no informed flow"; }
  return "";
}

function trialSessions(n, trial) {
  const scenarios = trial.report?.scenarios || [];
  if (!scenarios.length) { div(`<div class="empty">No sessions in this trial's report.</div>`); return; }
  const stats = trial.session_stats || {};
  const rows = scenarios.map((s, i) => ({ i, ...s, stat: stats[s.scenario] || {}, delta: isNum(s.reference_pnl_usd) ? s.pnl_usd - s.reference_pnl_usd : null }));
  const host = div();
  const xs = [-0.6, rows.length - 0.4];
  const every = Math.max(1, Math.ceil(rows.length / 24));
  const xticks = rows.map((r) => r.i).filter((i) => i % every === 0);
  const group = new Group(); group.label = (x) => rows[Math.round(x)]?.scenario ?? "";
  const open = (x) => { const r = rows[Math.round(x)]; if (r && trial.sessions.bot.includes(r.scenario)) location.hash = `${home()}trial/${n}/session/${encodeURIComponent(r.scenario)}`; };
  const bars = chart(host, {
    title: "PnL by session", height: 220, x: xs, xticks, zero: true, snap: Math.round, yfmt: (v) => usd(v, 0), xfmt: (i) => String(Math.round(i) + 1),
    series: [
      { label: "bot", type: "bars", color: "var(--accent)", width: 0.42, offset: -0.5, data: rows.map((r) => [r.i, r.pnl_usd]), colorOf: (p) => rows[p[0]].disqualified ? "var(--ask)" : "var(--accent)", fmt: susd },
      { label: "reference", type: "bars", color: "var(--ref)", width: 0.42, offset: 0.5, data: rows.map((r) => [r.i, r.reference_pnl_usd]), opacity: 0.75, fmt: susd },
    ],
    onClick: open,
  });
  let cb = 0, cr = 0;
  const cum = chart(host, {
    title: "Cumulative PnL", height: 180, x: xs, xticks, zero: true, snap: Math.round, yfmt: (v) => usd(v, 0), xfmt: (i) => String(Math.round(i) + 1),
    series: [
      { label: "bot", color: "var(--accent)", width: 2, data: rows.map((r) => [r.i, (cb += r.pnl_usd)]), fmt: susd },
      { label: "reference", color: "var(--ref)", width: 2, data: rows.map((r) => [r.i, (cr += r.reference_pnl_usd ?? 0)]), fmt: susd },
    ],
    onClick: open,
  });
  group.add(bars); group.add(cum);
  if (!trial.sessions.bot.length) div(`<div class="sub" style="margin:6px 0 0">This trial has no step-by-step session files (it was graded before the verifier recorded them), so there's no timeline per session.</div>`);
  section("Sessions", "click one for its timeline");
  const t = div();
  table(t, rows, [
    { key: "i", label: "#", r: true, fmt: (r) => r.i + 1 },
    { key: "scenario", label: "Session", mono: true, fmt: (r) => `${esc(r.scenario)}${r.disqualified ? ` <span class="badge bad" title="${esc(r.disqualified)}">disqualified</span>` : ""}` },
    { key: "kind", label: "Drawn as", sort: (r) => describeAnnotation(r.stat.annotation), fmt: (r) => `<span class="muted">${esc(describeAnnotation(r.stat.annotation))}</span>` },
    { key: "pnl_usd", label: "PnL", r: true, fmt: (r) => `<span class="${cls(r.pnl_usd)}">${susd(r.pnl_usd)}</span>` },
    { key: "reference_pnl_usd", label: "Reference", r: true, fmt: (r) => susd(r.reference_pnl_usd) },
    { key: "delta", label: "Δ", r: true, fmt: (r) => `<span class="${cls(r.delta)}">${susd(r.delta)}</span>` },
    { key: "max_drawdown_usd", label: "Drawdown", r: true, fmt: (r) => usd(r.max_drawdown_usd) },
    { key: "peak_position", label: "Peak pos", r: true, fmt: (r) => fix(r.peak_position) },
    { key: "end_position", label: "End pos", r: true, fmt: (r) => fix(r.end_position) },
    { key: "txs", label: "Txs", r: true, sort: (r) => r.stat.txs, fmt: (r) => int(r.stat.txs) + (r.stat.failed ? ` <span class="neg">(${r.stat.failed} failed)</span>` : "") + (r.stat.duplicates ? ` <span style="color:var(--warn)">(${r.stat.duplicates} dup)</span>` : "") },
    { key: "refused", label: "Refused", r: true, sort: (r) => (r.refused_calls || []).length, fmt: (r) => (r.refused_calls || []).length ? `<span class="neg">${r.refused_calls.length}</span>` : "0" },
    { key: "overran", label: "Overran", r: true, sort: (r) => r.turns?.overran, fmt: (r) => r.turns?.legacy ? `<span class="badge warn">no turns</span>` : int(r.turns?.overran) },
    { key: "turn", label: "Turn time", r: true, sort: (r) => r.turns?.wall_ms, fmt: (r) => isNum(r.turns?.wall_ms) ? `${fix(r.turns.wall_ms / 1000, 1)}s` : "–" },
    { key: "exit", label: "Bot exit", fmt: (r) => r.bot_exit ? `<span class="badge warn">${esc(r.bot_exit)}</span>` : "" },
  ], { onClick: (r) => { if (trial.sessions.bot.includes(r.scenario)) location.hash = `${home()}trial/${n}/session/${encodeURIComponent(r.scenario)}`; } });
}

async function trialAgent(n, trial) {
  if (!trial.trajectory) { div(`<div class="empty">No agent trajectory in this trial.</div>`); return; }
  const host = div(`<div class="loading">Loading the trajectory…</div>`);
  const tr = await api(`/api/trajectory/${n}`);
  const fm = tr.final_metrics || {};
  const steps = tr.steps || [];
  const t0 = Date.parse(steps[0]?.timestamp);
  const toolCounts = {};
  for (const s of steps) for (const c of s.tools) toolCounts[c.name] = (toolCounts[c.name] || 0) + 1;
  host.innerHTML = `<div class="cards">
    ${card("Steps", int(fm.total_steps ?? steps.length), `${esc(tr.agent?.name || "")} ${esc(tr.agent?.version || "")}`)}
    ${card("Tool calls", int(sum(Object.values(toolCounts))), Object.entries(toolCounts).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, v]) => `${k} ${v}`).join(" · "))}
    ${card("Prompt tokens", compact(fm.total_prompt_tokens), `${compact(fm.total_cached_tokens)} cached`)}
    ${card("Output tokens", compact(fm.total_completion_tokens), "")}
    ${card("Cost", usd(fm.total_cost_usd), "")}
  </div>`;
  // Activity: tool calls over the agent's time.
  if (isNum(t0) && steps.length > 1) {
    const tEnd = Date.parse(steps[steps.length - 1].timestamp);
    const names = Object.keys(toolCounts).sort((a, b) => toolCounts[b] - toolCounts[a]).slice(0, 6);
    const palette = ["var(--accent)", "var(--ref)", "var(--index)", "var(--bid)", "var(--ask)", "#c084fc"];
    lanes(host, {
      title: "Activity", x: [0, (tEnd - t0) / 60000], xfmt: (m) => `${Math.round(m)}m`,
      rows: [
        { label: "message", events: steps.filter((s) => s.source === "agent" && s.message && !s.tools.length).map((s) => ({ x: (Date.parse(s.timestamp) - t0) / 60000, color: "var(--text-2)", title: esc(String(s.message).slice(0, 80)) })) },
        ...names.map((name, i) => ({ label: name.slice(0, 9), events: steps.flatMap((s) => s.tools.filter((c) => c.name === name).map((c) => ({ x: (Date.parse(s.timestamp) - t0) / 60000, color: palette[i], shape: "bar", title: esc(String(c.description || c.input).slice(0, 90)) }))) })),
      ],
    }).group = { move: (x, ev) => showTip(`<b>${fix(x, 1)} min</b>`, ev), leave: hideTip };
  }
  const bar = document.createElement("div"); bar.className = "btns";
  bar.innerHTML = `<input class="search" placeholder="Filter steps (text, tool, output)…"> <button class="btn" data-f="all">All</button><button class="btn" data-f="msg">Messages</button><button class="btn" data-f="tools">Tool calls</button>`;
  host.appendChild(bar);
  const list = document.createElement("div"); host.appendChild(list);
  let filter = "all", query = "";
  const draw = () => {
    const q = query.toLowerCase();
    const shown = steps.filter((s) => (filter === "all" || (filter === "msg" ? s.message && s.source !== "system" : s.tools.length)) &&
      (!q || JSON.stringify(s).toLowerCase().includes(q)));
    list.innerHTML = shown.slice(0, 300).map((s) => {
      const off = isNum(t0) ? `+${fix((Date.parse(s.timestamp) - t0) / 60000, 1)}m` : "";
      const tools = s.tools.map((c) => `<details><summary>${esc(c.name)}${c.description ? ` — ${esc(c.description)}` : ""}</summary><pre class="code wrap">${esc(c.input)}</pre>${c.output !== null && c.output !== undefined ? `<pre class="code wrap" style="color:var(--text-2)">${esc(ansi(c.output))}</pre>` : ""}</details>`).join("");
      const message = s.source === "user" && s.message.length > 1200
        ? `<details><summary>${esc(s.id === 1 ? "The task's instruction" : "User message")} (${int(s.message.length)} characters)</summary><div class="msg">${esc(s.message)}</div></details>`
        : s.message ? `<div class="msg">${esc(s.message)}</div>` : "";
      return `<div class="step"><div class="head"><b>#${esc(s.id)}</b><span>${esc(s.source)}</span><span class="num">${off}</span>${s.metrics?.completion_tokens ? `<span class="num">${compact(s.metrics.completion_tokens)} out</span>` : ""}</div><div class="body">${message}${s.reasoning ? `<details><summary>reasoning</summary><pre class="code wrap">${esc(s.reasoning)}</pre></details>` : ""}${tools}</div></div>`;
    }).join("") + (shown.length > 300 ? `<div class="sub">${shown.length - 300} more steps; narrow the filter.</div>` : "") || `<div class="empty">No steps match.</div>`;
    bar.querySelectorAll("[data-f]").forEach((b) => b.classList.toggle("on", b.dataset.f === filter));
  };
  bar.querySelector("input").addEventListener("input", (e) => { query = e.target.value; draw(); });
  bar.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; draw(); }));
  draw();
}

function trialFiles(n, trial, paths, prefix) {
  if (!paths.length) { div(`<div class="empty">No files.</div>`); return; }
  const host = div("", "files");
  const list = document.createElement("div"); list.className = "list";
  const view = document.createElement("div");
  host.append(list, view);
  const sizes = Object.fromEntries((trial.files || []).map((f) => [f.path, f.bytes]));
  const show = async (path) => {
    list.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.dataset.p === path));
    view.innerHTML = `<div class="loading">Loading…</div>`;
    try {
      const text = ansi(await api(fileUrl(n, path), true));
      const lines = text.split("\n");
      view.innerHTML = `<div class="sub num" style="margin-bottom:6px">${esc(path)} · ${int(lines.length)} lines</div><pre class="code">${lines.map((l, i) => `<span style="color:var(--text-4);user-select:none">${String(i + 1).padStart(4)}  </span>${esc(l)}`).join("\n")}</pre>`;
    } catch (e) { view.innerHTML = `<div class="error">${esc(e.message)}</div>`; }
  };
  list.innerHTML = paths.map((p) => `<a href="javascript:void 0" data-p="${esc(p)}"><span>${esc(p.startsWith(prefix) ? p.slice(prefix.length) : p)}</span><span class="muted">${sizes[p] !== undefined ? compact(sizes[p]) + "B" : ""}</span></a>`).join("");
  list.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => show(a.dataset.p)));
  const first = paths.find((p) => /src\/main\.rs$/.test(p)) || paths.find((p) => /\.(rs|py|ts|js)$/.test(p)) || paths[0];
  show(first);
}

function trialLogs(n, trial) {
  const paths = [...trial.logs];
  for (const s of trial.report?.scenarios || []) paths.push(`verifier/bot/${s.scenario}.log`);
  trialFiles(n, trial, paths, "");
}

// ---------- session ----------
async function renderSession(n, name) {
  const trial = await api(`/api/trial/${n}`);
  const t = trial.summary;
  setCrumbs([[index.name || "bench", home()], [shortTask(t.task), taskHref(t.task)], [`${shortModel(t.model)} · ${t.trial}`, `${home()}trial/${n}`], [name, null]]);
  delete app.dataset.task;
  app.innerHTML = `<div class="loading">Loading ${esc(name)}…</div>`;
  const [bot, ref] = await Promise.all([
    api(`/api/session/${n}/bot/${encodeURIComponent(name)}`),
    trial.sessions.reference.includes(name) ? api(`/api/session/${n}/reference/${encodeURIComponent(name)}`).catch(() => null) : null,
  ]);
  app.innerHTML = "";
  const names = trial.sessions.bot, idx = names.indexOf(name);
  const nav = (i) => names[i] ? `<a class="btn" href="${home()}trial/${n}/session/${encodeURIComponent(names[i])}">${i < idx ? "← " : ""}${esc(names[i])}${i > idx ? " →" : ""}</a>` : "";
  const rep = bot.report, tl = bot.timeline, sc = bot.scenario;
  const making = !!sc.making;
  div(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px"><div><h1>${esc(name)} <small>${esc(shortModel(t.model))} · ${esc(shortTask(t.task))}</small></h1><div class="sub">${esc(sc.description || "")}</div><div class="sub">${esc(describeAnnotation(bot.annotation))}${bot.disqualified ? ` <span class="badge bad">${esc(bot.disqualified)}</span>` : ""}</div></div><div class="btns">${nav(idx - 1)}${nav(idx + 1)}</div></div>`);
  const refPnl = ref?.report?.pnl_usd ?? sc.reference_pnl_usd;
  const txs = tl.transactions || [], failed = txs.filter((x) => !x.ok);
  div(`<div class="cards">
    ${card("PnL", `<span class="${cls(rep.pnl_usd)}">${susd(rep.pnl_usd)}</span>`, `reference ${susd(refPnl)}`, false)}
    ${card("Vs reference", isNum(refPnl) ? `<span class="${cls(rep.pnl_usd - refPnl)}">${susd(rep.pnl_usd - refPnl)}</span>` : "–", "")}
    ${card("Bound", usd(bot.bound_pnl_usd), "hindsight (+ spread)")}
    ${card("Max drawdown", usd(rep.max_drawdown_usd), `limit ${usd(rep.mandate?.limits?.max_drawdown_usd)}`)}
    ${card("Peak position", fix(rep.peak_position), `cap ${fix(rep.mandate?.universe?.[0]?.max_position)} · end ${fix(rep.end_position)}`)}
    ${card("Transactions", int(txs.length), [failed.filter((x) => !x.duplicate).length ? `<span class="neg">${failed.filter((x) => !x.duplicate).length} failed</span>` : "none failed", txs.some((x) => x.duplicate) ? `<span style="color:var(--warn)">${txs.filter((x) => x.duplicate).length} duplicates</span>` : ""].filter(Boolean).join(" · "))}
    ${card("Mark", usd(rep.end_mark_usd), `from ${usd(rep.start_mark_usd)} (${pct(rep.end_mark_usd / rep.start_mark_usd - 1)}) · valued at the ${esc(rep.valuation)}`)}
    ${card("Turns", int(rep.turns?.steps), rep.turns?.legacy ? "never answered the hello" : `${int(rep.turns?.overran)} overran · ${fix((rep.turns?.wall_ms || 0) / 1000, 1)}s`)}
  </div>`);

  const steps = tl.steps || [], rsteps = ref?.timeline?.steps || [];
  const xEnd = Math.max(tl.end_slot - tl.start_slot, steps.length ? steps[steps.length - 1].at : 1);
  const X = [0, xEnd];
  const group = new Group(); group.label = (x) => `${clock(x)} · slot +${Math.round(x)}`;
  const host = div();
  // Price: mark, index, the planned level, the book's best bid and ask, and the bot's orders.
  const orderMarks = [];
  for (const tx of txs) {
    if (!isNum(tx.at)) continue;
    for (const ix of tx.instructions || []) {
      const o = ix.order; if (!o || !isNum(o.price_usd)) continue;
      const bid = o.side === "bid";
      orderMarks.push(o.kind === "ImmediateOrCancel"
        ? { x: tx.at, y: o.price_usd, shape: bid ? "up" : "down", color: bid ? "var(--bid)" : "var(--ask)", r: 3.5 }
        : { x: tx.at, y: o.price_usd, shape: "tick", color: bid ? "var(--bid)" : "var(--ask)", r: 3, opacity: tx.ok ? 0.7 : 0.25 });
    }
  }
  const P = (k) => steps.map((s) => [s.at, s[k]]);
  const priceChart = chart(host, {
    title: "Price", height: 260, x: X, xfmt: clock, yfmt: (v) => "$" + fix(v), marks: orderMarks.length > 3000 ? orderMarks.filter((_, i) => i % Math.ceil(orderMarks.length / 3000) === 0) : orderMarks,
    series: [
      { label: "best bid / ask", type: "band", color: "var(--text-2)", opacity: 0.1, data: steps.filter((s) => isNum(s.best_bid_usd) && isNum(s.best_ask_usd)).map((s) => [s.at, s.best_bid_usd, s.best_ask_usd]) },
      { label: "best bid", color: "var(--bid)", width: 1, opacity: 0.55, step: true, data: P("best_bid_usd"), fmt: (v) => "$" + fix(v) },
      { label: "best ask", color: "var(--ask)", width: 1, opacity: 0.55, step: true, data: P("best_ask_usd"), fmt: (v) => "$" + fix(v) },
      { label: "planned level", color: "var(--text-3)", dash: "4 3", width: 1.2, step: true, data: P("level_usd"), fmt: (v) => "$" + fix(v) },
      { label: "index", color: "var(--index)", width: 1.2, step: true, data: P("index_usd"), fmt: (v) => "$" + fix(v) },
      { label: "mark", color: "var(--text)", width: 1.6, step: true, data: P("mark_usd"), fmt: (v) => "$" + fix(v) },
    ],
    legendExtra: orderMarks.length ? `<span><i style="background:var(--bid)"></i>bot bids</span><span><i style="background:var(--ask)"></i>bot asks</span><span class="muted">▲▼ market orders</span>` : "",
  });
  group.add(priceChart);
  const cap = rep.mandate?.universe?.[0]?.max_position;
  group.add(chart(host, {
    title: "Position", height: 150, x: X, xfmt: clock, zero: true, yfmt: (v) => fix(v, 1),
    hlines: isNum(cap) ? [{ y: cap, color: "var(--ask)", label: `cap ${fix(cap, 0)}`, fit: false }, { y: -cap, color: "var(--ask)", fit: false }] : [],
    series: [
      { label: "bot", color: "var(--accent)", width: 1.8, step: true, data: P("position"), fmt: (v) => fix(v, 3) },
      ...(rsteps.length ? [{ label: "reference", color: "var(--ref)", width: 1.4, step: true, opacity: 0.85, data: rsteps.map((s) => [s.at, s.position]), fmt: (v) => fix(v, 3) }] : []),
    ],
  }));
  const ddLimit = rep.mandate?.limits?.max_drawdown_usd;
  // Drawdown from the running peak: what the limit is measured against.
  let peak = -Infinity;
  const drawdown = steps.map((s) => { peak = Math.max(peak, s.pnl_usd); return [s.at, s.pnl_usd - Math.max(peak, 0)]; });
  group.add(chart(host, {
    title: "PnL", height: 190, x: X, xfmt: clock, zero: true, yfmt: (v) => usd(v, 0),
    hlines: isNum(ddLimit) ? [{ y: -ddLimit, color: "var(--ask)", label: `drawdown limit ${usd(ddLimit, 0)}`, fit: false }] : [],
    series: [
      { label: "drawdown", color: "var(--ask)", width: 1, opacity: 0.5, step: true, data: drawdown, fmt: susd },
      ...(rsteps.length ? [{ label: "reference", color: "var(--ref)", width: 1.5, step: true, data: rsteps.map((s) => [s.at, s.pnl_usd]), fmt: susd }] : []),
      { label: "bot", color: "var(--accent)", width: 2, step: true, data: P("pnl_usd"), fmt: susd },
    ],
  }));
  // Events: the scenario's moves, the bot's transactions and refusals, the takers.
  const informed = Array.isArray(bot.annotation?.informed) ? bot.annotation.informed : [];
  const rows = [];
  let last = 0;
  rows.push({ label: "scenario", events: (sc.path || []).map((w) => { const e = { x: w.slot, color: "var(--text-2)", shape: "bar", title: `level ${w.level_pct > 0 ? "+" : ""}${fix(w.level_pct)}% (${w.level_pct - last >= 0 ? "+" : ""}${fix(w.level_pct - last)} pts)` }; last = w.level_pct; return e; }).filter((e) => e.x <= xEnd) });
  const describeTx = (tx) => (tx.instructions || []).filter((i) => i.program !== "compute_budget").map((i) => i.order ? `${i.order.kind === "ImmediateOrCancel" ? "market" : "limit"} ${i.order.side} ${fix(i.order.size, 3)}${isNum(i.order.price_usd) ? " @ $" + fix(i.order.price_usd) : ""}` : (i.name || i.program.slice(0, 8))).join(", ") || "transaction";
  // What the account traded each step: the position's change, whoever's
  // order it was (the bot's market orders, or takers filling its quotes).
  const fills = [];
  for (let i = 1; i < steps.length; i++) {
    const d = steps[i].position - steps[i - 1].position;
    if (Math.abs(d) > 1e-9) fills.push({ x: steps[i].at, color: d > 0 ? "var(--bid)" : "var(--ask)", r: Math.min(6, 1.8 + Math.sqrt(Math.abs(d))), opacity: 0.8, title: `${d > 0 ? "bought" : "sold"} ${fix(Math.abs(d), 3)} → ${fix(steps[i].position, 3)}` });
  }
  rows.push({ label: "position Δ", events: fills });
  rows.push({ label: "bot tx", events: txs.filter((x) => isNum(x.at)).map((x) => ({ x: x.at, color: x.ok ? "var(--accent)" : "var(--ask)", r: 2.4, opacity: 0.7, title: `${x.ok ? "" : "FAILED "}${esc(describeTx(x))}` })) });
  if (failed.length) rows.push({ label: "not run", events: failed.map((x) => ({ x: x.at ?? (isNum(x.step) ? steps[x.step]?.at : 0) ?? 0, color: x.duplicate ? "var(--warn)" : "var(--ask)", shape: "x", title: esc((x.duplicate ? "duplicate: " + describeTx(x) : x.error || "").slice(0, 120)) })) });
  const calls = tl.calls || {};
  const stepAt = (k) => isNum(k) ? (steps[k]?.at ?? k * tl.slots_per_step) : 0;
  if ((calls.refused || []).length) rows.push({ label: "refused", events: calls.refused.map((c) => ({ x: stepAt(c.step), color: "var(--critical)", shape: "x", title: esc(c.method) })) });
  if ((calls.late || []).length) rows.push({ label: "late send", events: calls.late.map((c) => ({ x: stepAt(c.step), color: "var(--warn)", title: "sent while the world moved" })) });
  const over = steps.filter((s) => s.answered === false);
  if (over.length) rows.push({ label: "overran", events: over.map((s) => ({ x: s.at, color: "var(--warn)", shape: "bar", title: `turn took ${s.turn_ms} ms` })) });
  if (making) {
    const takers = tl.taker_orders || [];
    const ev = (side) => takers.map((o, i) => ({ o, i })).filter(({ o }) => o.side === side).map(({ o, i }) => ({ x: o.at, color: side === "buy" ? "var(--bid)" : "var(--ask)", r: informed[i] ? 3.4 : 2.2, fill: informed[i] ? "transparent" : undefined, stroke: informed[i] ? (side === "buy" ? "var(--bid)" : "var(--ask)") : undefined, opacity: informed[i] ? 1 : 0.55, title: `${side} ${fix(o.size, 3)} (limit $${fix(o.limit_usd)})${informed[i] ? " · informed" : ""}${o.ok ? "" : " · FAILED " + esc(o.error || "")}` }));
    rows.push({ label: "taker buy", events: ev("buy") }, { label: "taker sell", events: ev("sell") });
  }
  group.add(lanes(host, { title: "Events", x: X, xfmt: clock, rows, legend: making ? `<span class="muted">○ informed taker orders</span>` : "" }));
  if (steps.some((s) => isNum(s.turn_ms))) {
    group.add(chart(host, {
      title: "Turn time", height: 110, x: X, xfmt: clock, yfmt: (v) => `${Math.round(v)}ms`, zero: true,
      series: [{ label: "bot turn", type: "bars", color: "var(--text-3)", width: tl.slots_per_step * 0.8, data: steps.filter((s) => isNum(s.turn_ms)).map((s) => [s.at, s.turn_ms]), colorOf: (p) => steps.find((s) => s.at === p[0])?.answered === false ? "var(--warn)" : "var(--text-3)", fmt: (v) => `${v} ms` }],
      readout: (x) => { const s = at(steps.map((q) => [q.at, q]), x)?.[1]; return s && isNum(s.turn_ms) ? `<div class="row"><span>turn ${s.k}</span><span>${s.turn_ms} ms${s.answered === false ? " (overran)" : ""}</span></div>` : ""; },
    }));
  }

  // Side by side.
  section("Bot and reference");
  const cmp = div("", "grid2");
  const metric = (r) => r ? {
    "PnL": susd(r.report.pnl_usd), "End value": usd(r.report.end_value_usd), "Max drawdown": usd(r.report.max_drawdown_usd),
    "Peak position": fix(r.report.peak_position, 3), "End position": fix(r.report.end_position, 3),
    "Transactions": int((r.timeline.transactions || []).length), "Failed": int((r.timeline.transactions || []).filter((x) => !x.ok && !x.duplicate).length),
    "Duplicates (didn't run)": int((r.timeline.transactions || []).filter((x) => x.duplicate).length),
    "Orders placed": int((r.timeline.transactions || []).flatMap((x) => x.instructions || []).filter((i) => i.order).length),
    "Refused calls": int((r.report.refused_calls || []).length), "Late sends": int(r.report.turns?.late_sends),
    "Turns overran": int(r.report.turns?.overran), "Turn time": `${fix((r.report.turns?.wall_ms || 0) / 1000, 1)}s`,
    "Session wall": isNum(r.report.wall_ms) ? `${fix(r.report.wall_ms / 1000, 1)}s` : "–", "Bot exit": r.report.bot_exit || "ran to the end",
  } : null;
  const mb = metric(bot), mr = metric(ref);
  cmp.innerHTML = `<div class="panel"><table class="cmp"><thead><tr><th></th><th class="r">bot</th><th class="r">reference</th></tr></thead><tbody>${Object.keys(mb).map((k) => `<tr><td>${k}</td><td class="r num">${mb[k]}</td><td class="r num">${mr ? mr[k] : "–"}</td></tr>`).join("")}</tbody></table></div>
    <div class="panel"><div class="k" style="margin-bottom:8px">RPC calls by method</div><table class="cmp"><tbody>${Object.entries(calls.methods || {}).sort((a, b) => b[1] - a[1]).map(([m, c]) => `<tr><td class="num">${esc(m)}</td><td class="r num">${int(c)}</td><td class="r num muted">${ref?.timeline?.calls?.methods?.[m] !== undefined ? int(ref.timeline.calls.methods[m]) : ""}</td></tr>`).join("") || `<tr><td class="muted">none recorded</td></tr>`}</tbody></table>${calls.sends_dropped ? `<div class="sub">${int(calls.sends_dropped)} sends past the log's limit weren't kept.</div>` : ""}</div>`;

  section("Transactions", `${int(txs.length)} sent by the bot`);
  const txHost = div();
  const fbar = document.createElement("div"); fbar.className = "btns";
  fbar.innerHTML = ["all", "orders", "market", "failed", "duplicate"].map((f) => `<button class="btn" data-f="${f}">${f}</button>`).join("");
  txHost.appendChild(fbar);
  const txTable = document.createElement("div"); txHost.appendChild(txTable);
  let txFilter = "all";
  const drawTx = () => {
    fbar.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.f === txFilter));
    const list = txs.filter((x) => txFilter === "all" || (txFilter === "failed" ? !x.ok && !x.duplicate : txFilter === "duplicate" ? x.duplicate : txFilter === "market" ? (x.instructions || []).some((i) => i.order?.kind === "ImmediateOrCancel") : (x.instructions || []).some((i) => i.order)));
    txTable.innerHTML = "";
    table(txTable, list, [
      { key: "step", label: "Turn", r: true, fmt: (x) => int(x.step) },
      { key: "at", label: "Time", mono: true, fmt: (x) => isNum(x.at) ? `${clock(x.at)} <span class="muted">+${x.at}</span>` : "–" },
      { key: "ok", label: "", fmt: (x) => x.ok ? `<span class="pos">✓</span>` : x.duplicate ? `<span class="badge warn">duplicate</span>` : `<span class="neg">✗</span>` },
      { key: "what", label: "Instructions", sort: describeTx, fmt: (x) => esc(describeTx(x)) },
      { key: "compute_units", label: "CU", r: true, fmt: (x) => int(x.compute_units) },
      { key: "error", label: "Error", fmt: (x) => x.error ? `<span class="neg" title="${esc(x.error)}">${esc(String(x.error).slice(0, 80))}</span>` : "" },
      { key: "signature", label: "Signature", mono: true, fmt: (x) => `<span class="muted" title="${esc(x.signature || "")}">${esc(String(x.signature || "").slice(0, 16))}${x.signature ? "…" : ""}</span>` },
    ], { maxHeight: "460px", limit: 300 });
    const failedRows = list.filter((x) => !x.ok && (x.logs || []).length).slice(0, 5);
    if (failedRows.length) {
      const d = document.createElement("div");
      d.innerHTML = failedRows.map((x) => `<details><summary>logs of the failed transaction at ${isNum(x.at) ? clock(x.at) : "?"}: ${esc(String(x.error || "").slice(0, 60))}</summary><pre class="code wrap">${esc(x.logs.join("\n"))}</pre></details>`).join("");
      txTable.appendChild(d);
    }
  };
  fbar.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { txFilter = b.dataset.f; drawTx(); }));
  drawTx();

  if (making && (tl.taker_orders || []).length) {
    section("Taker flow", `${int(tl.taker_orders.length)} orders · ${int(informed.filter(Boolean).length)} informed`);
    const h = div();
    table(h, tl.taker_orders.map((o, i) => ({ ...o, i, informed: !!informed[i] })), [
      { key: "at", label: "Time", mono: true, fmt: (o) => `${clock(o.at)} <span class="muted">+${o.at}</span>` },
      { key: "side", label: "Side", fmt: (o) => `<span class="${o.side === "buy" ? "pos" : "neg"}">${o.side}</span>` },
      { key: "size", label: "Size", r: true, fmt: (o) => fix(o.size, 3) },
      { key: "limit_usd", label: "Limit", r: true, fmt: (o) => "$" + fix(o.limit_usd) },
      { key: "account", label: "Account", r: true },
      { key: "informed", label: "Informed", fmt: (o) => o.informed ? `<span class="badge warn">informed</span>` : "" },
      { key: "ok", label: "", fmt: (o) => o.ok ? "" : `<span class="neg" title="${esc(o.error || "")}">failed</span>` },
    ], { maxHeight: "360px" });
  }

  section("Scenario", `${int((sc.path || []).length)} waypoints · ${int(sc.duration_slots)} slots (${clock(sc.duration_slots)})`);
  div(`<details><summary>The scenario as drawn${bot.annotation ? ", with what it was drawn as" : ""}</summary><pre class="code">${esc(JSON.stringify({ annotation: bot.annotation, ...sc, making: sc.making ? { ...sc.making, takers: `${sc.making.takers.length} orders: see Taker flow` } : undefined }, null, 2))}</pre></details>`);

  section("Logs");
  const logs = div("", "grid2");
  const logPanel = async (label, path) => {
    const d = document.createElement("div");
    d.innerHTML = `<div class="k" style="margin-bottom:6px">${esc(label)}</div><pre class="code wrap" style="max-height:420px">Loading…</pre>`;
    logs.appendChild(d);
    try { const text = ansi(await api(fileUrl(n, path), true)); d.querySelector("pre").textContent = text || "(empty)"; }
    catch (e) { d.querySelector("pre").textContent = e.message; }
  };
  logPanel("Bot log", `verifier/bot/${name}.log`);
  logPanel("Reference log", `verifier/bot/reference/${name}.log`);
}

loadIndex().then(route).catch(fail);
</script>
</body>
</html>
