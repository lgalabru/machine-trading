<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtx · bench review</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --panel: #09090b;
    --panel-2: #0e0e10;
    --line: #27272a;
    --line-soft: #18181b;
    --text: #fafafa;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --text-4: #52525b;
    --accent: #a2ef5b;
    --accent-soft: rgba(162, 239, 91, 0.14);
    --ref: #7aa2f7;
    --ref-soft: rgba(122, 162, 247, 0.16);
    --index: #f5b74a;
    --bid: #34d399;
    --ask: #f87171;
    --critical: #ef4444;
    --warn: #f59e0b;
    --up: #5ed16a;
    --down: #ff5f57;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  /* The header: the bench, its version, and a summary chart. */
  header.hero {
    border-bottom: 1px solid var(--line); position: relative; overflow: hidden;
    background: radial-gradient(ellipse 70% 120% at 85% -20%, rgba(94, 209, 106, 0.10), transparent 60%), var(--bg);
  }
  .hero-inner { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 40px; padding: 24px 32px 26px; }
  .hero-left { display: flex; flex-direction: column; min-width: 0; }
  .hero h1 { font-size: 30px; letter-spacing: -0.03em; margin: 20px 0 4px; line-height: 1.1; }
  .hero .ver { color: var(--text-3); font: 500 12px var(--mono); }
  .hero .ver b { color: var(--text); font-weight: 600; }
  .hero .meta { color: var(--text-3); font-size: 12px; margin-top: 6px; }
  .hero .tallies { display: flex; gap: 14px; margin-top: 12px; font: 500 12px var(--mono); color: var(--text-2); }
  .hero .tallies span { display: inline-flex; align-items: center; gap: 6px; }
  .hero .tallies .light { width: 7px; height: 7px; }
  /* The watchlist: one row per model, like a stock ticker. */
  .watch { margin-top: 20px; border-top: 1px solid var(--line-soft); }
  .watch .row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 76px; align-items: center; gap: 12px; padding: 10px 8px; border-bottom: 1px solid var(--line-soft); cursor: pointer; border-radius: 6px; }
  .watch .row:hover { background: rgba(255,255,255,.03); }
  .watch .row.on { background: rgba(255,255,255,.07); }
  .watch .name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .watch .sub { color: var(--text-3); font-size: 11px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .watch .chip { justify-self: end; width: 72px; text-align: right; padding: 4px 8px; border-radius: 6px; font: 600 13px var(--mono); color: var(--text-2); background: #2c2c2e; }
  .watch .chip.up { background: var(--up); color: #04160a; }
  .watch .chip.down { background: var(--down); color: #fff; }
  .hero-right { min-width: 0; display: flex; flex-direction: column; }
  .seg { display: flex; gap: 2px; padding: 2px; background: #1c1c1e; border-radius: 9px; width: fit-content; }
  .seg a { padding: 5px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--text-2); text-decoration: none; }
  .seg a.on { background: #3a3a3c; color: var(--text); }
  .hero-bar .eyebrow { font-size: 13px; font-weight: 600; color: var(--text); }
  .hero-bar .eyebrow .muted { font: 500 11px var(--mono); color: var(--text-3); margin-left: 8px; }
  .hero-bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .rel { display: flex; align-items: center; gap: 10px; }
  .cmp-link { font-size: 12px; font-weight: 600; color: var(--text-2); text-decoration: none; }
  .cmp-link:hover { color: var(--text); }
  /* Compare: one card per task. */
  .cmp-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 6px; }
  .cmp-card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 16px 18px; margin: 18px 0; }
  .cmp-head { display: flex; align-items: baseline; gap: 12px; }
  .cmp-head h2 { margin: 0; }
  .cmp-grid { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.4fr); gap: 28px; align-items: center; margin-top: 10px; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cmp-table th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .cmp-table td { padding: 9px 8px; border-bottom: 1px solid var(--line-soft); }
  .cmp-table .num { text-align: right; font-family: var(--mono); }
  .cmp-table .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; }
  .delta { display: inline-block; min-width: 64px; text-align: right; padding: 3px 8px; border-radius: 6px; font: 600 12px var(--mono); background: #2c2c2e; color: var(--text-2); }
  .delta.up { background: var(--up); color: #04160a; } .delta.down { background: var(--down); color: #fff; }
  .cmp-chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .cmp-chart .ylab { font: 500 11px var(--mono); fill: #8e8e93; }
  .cmp-chart .xlab { font: 600 11px var(--mono); fill: #8e8e93; }
  .quote { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 18px 0 4px; }
  .quote .big { font: 600 42px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .quote .chg { font: 600 15px var(--mono); }
  .quote .chg.up { color: var(--up); } .quote .chg.down { color: var(--down); }
  .quote-sub { color: var(--text-3); font-size: 12px; min-height: 18px; }
  .quote-sub .key { display: inline-flex; align-items: center; gap: 6px; margin-left: 14px; }
  .quote-sub b { color: var(--text-2); font-weight: 500; }
  .area { position: relative; margin-top: 12px; height: 240px; }
  .area svg { display: block; width: 100%; height: 100%; overflow: visible; touch-action: none; }
  .area .ylab { font: 500 11px var(--mono); fill: #8e8e93; }
  .area .xlab { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #8e8e93; }
  .area-empty { height: 240px; display: grid; place-items: center; color: var(--text-3); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; margin-top: 12px; }
  .light { display: inline-block; width: 9px; height: 9px; border-radius: 99px; flex: none; }
  .light.l-success { background: var(--accent); box-shadow: 0 0 8px rgba(162,239,91,.55); }
  .light.l-error { background: var(--critical); box-shadow: 0 0 8px rgba(239,68,68,.55); }
  .light.l-pending { background: var(--warn); box-shadow: 0 0 8px rgba(245,158,11,.55); animation: blink 1.2s ease-in-out infinite; }
  .light.l-queued { background: var(--text-4); }
  @keyframes blink { 50% { opacity: .35; } }
  .body { min-height: 60vh; }
  /* Tasks as app tiles (after pay-kit's playground): a rounded rectangle,
     a subtle vertical gradient, white text, a ring on the one shown. */
  :root {
    --ios-blue: #0A84FF; --ios-blue-2: #0070DB;
    --ios-pink: #FF375F; --ios-pink-2: #E22A4F;
    --ios-yellow: #FFD60A; --ios-yellow-2: #F0BD00;
    --ios-green: #30D158; --ios-green-2: #22B648;
    --ios-orange: #FF9F0A; --ios-orange-2: #E58A00;
    --ios-purple: #BF5AF2; --ios-purple-2: #A646DB;
    --ios-teal: #40C8E0; --ios-teal-2: #2AAEC6;
    --ios-gray: #8E8E93; --ios-gray-2: #76767B;
  }
  nav.tiles { display: flex; gap: 12px; padding: 16px 32px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--panel); scrollbar-width: thin; }
  nav.tiles:empty { display: none; }
  .tile {
    --tile: var(--ios-gray); --tile-2: var(--ios-gray-2);
    display: flex; flex-direction: column; justify-content: space-between; gap: 6px; flex: none;
    width: 240px; height: 112px; padding: 12px 14px; border-radius: 16px;
    background: linear-gradient(180deg, var(--tile) 0%, var(--tile-2) 100%);
    color: #fff; text-decoration: none; font-size: 12px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.06);
    transition: transform .12s ease, box-shadow .15s ease, filter .15s ease;
  }
  .tile:hover { filter: brightness(1.06); transform: translateY(-2px); }
  .tile:active { transform: translateY(0); filter: brightness(.94); }
  .tile.on { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--tile), 0 2px 8px rgba(0,0,0,.18); }
  .tile.c0 { --tile: var(--ios-pink); --tile-2: var(--ios-pink-2); }
  .tile.c1 { --tile: var(--ios-blue); --tile-2: var(--ios-blue-2); }
  .tile.c2 { --tile: var(--ios-yellow); --tile-2: var(--ios-yellow-2); color: #0a0a0a; }
  .tile.c3 { --tile: var(--ios-green); --tile-2: var(--ios-green-2); color: #0a0a0a; }
  .tile.c4 { --tile: var(--ios-orange); --tile-2: var(--ios-orange-2); }
  .tile.c5 { --tile: var(--ios-purple); --tile-2: var(--ios-purple-2); }
  .tile.c6 { --tile: var(--ios-teal); --tile-2: var(--ios-teal-2); color: #0a0a0a; }
  .tile .row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .tile .tbadge { font: 700 10px var(--mono); padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,.22); letter-spacing: .03em; }
  .tile .title { font-weight: 600; font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .desc { opacity: .88; font-size: 11px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .foot { opacity: .8; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .tile .live { width: 6px; height: 6px; border-radius: 99px; background: currentColor; animation: blink 1.2s ease-in-out infinite; }
  .tile.c2 .tbadge, .tile.c3 .tbadge, .tile.c6 .tbadge { background: rgba(0,0,0,.18); }
  #crumbs { display: flex; gap: 8px; color: var(--text-3); font-size: 13px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; letter-spacing: -0.01em; }
  .brand .dot { width: 9px; height: 9px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 12px rgba(162,239,91,.6); }
  .brand small { color: var(--text-3); font-weight: 500; }
  #crumbs { display: flex; gap: 8px; color: var(--text-3); font-size: 13px; flex-wrap: wrap; }
  #crumbs a { text-decoration: none; color: var(--text-2); }
  #crumbs a:hover { color: var(--text); }
  #crumbs .sep { color: var(--text-4); }
  main { padding: 22px 28px 80px; min-width: 0; }
  .legend-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .who { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; cursor: pointer; user-select: none; }
  .who.off { opacity: .35; }
  .who .sw { width: 14px; height: 3px; border-radius: 2px; }
  .who .pnl { font: 12px var(--mono); }
  .scrub { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .scrub input[type=range] { flex: 1; accent-color: var(--accent); }
  .scrub .t { font: 600 14px var(--mono); color: var(--accent); min-width: 150px; }
  .now { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 1200px) { .now { grid-template-columns: 1fr; } }
  .evlog { max-height: 420px; overflow: auto; font: 12px/1.6 var(--mono); }
  .evlog .ev { display: grid; grid-template-columns: 100px 160px 1fr; gap: 10px; padding: 2px 4px; border-bottom: 1px solid var(--line-soft); }
  .evlog .ev.cur { background: var(--accent-soft); }
  .evlog .ev .who-l { display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  td.heat { font-family: var(--mono); text-align: right; }
  tr.sel td { background: var(--accent-soft); }
  h1 { font-size: 24px; letter-spacing: -0.02em; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 12px; color: var(--text); letter-spacing: -0.01em; }
  h2 small, h1 small { color: var(--text-3); font-weight: 500; font-size: 13px; margin-left: 8px; }
  .sub { color: var(--text-3); font-size: 13px; }
  .muted { color: var(--text-3); }
  .k { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .card .v { font: 600 20px/1.2 var(--mono); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .v.big { font-size: 30px; color: var(--accent); }
  .card .d { color: var(--text-3); font-size: 12px; margin-top: 2px; }
  .pos { color: var(--accent); } .neg { color: var(--ask); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
  .badge.bad { color: #fecaca; border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.12); }
  .badge.warn { color: #fde68a; border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.1); }
  .badge.good { color: var(--accent); border-color: rgba(162,239,91,.45); background: var(--accent-soft); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  th { color: var(--text-3); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; position: sticky; top: 0; background: var(--bg); cursor: default; }
  th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
  td.r, th.r { text-align: right; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--panel-2); }
  .table-wrap { border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 640px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 22px 0 18px; }
  .tabs a { padding: 9px 14px; text-decoration: none; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tabs a.on { color: var(--text); border-color: var(--accent); }
  .tabs a:hover { color: var(--text); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1000px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .chart { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 6px; margin-bottom: 10px; }
  .chart .title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .chart .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
  .chart .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .axis text { fill: var(--text-4); font: 10.5px var(--mono); }
  .axis line, .grid line { stroke: var(--line-soft); }
  .zero { stroke: var(--text-4); stroke-dasharray: 2 3; }
  .cross { stroke: rgba(250,250,250,.35); pointer-events: none; }
  .tip { position: fixed; pointer-events: none; z-index: 20; background: rgba(9,9,11,.96); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 var(--mono); color: var(--text-2); display: none; max-width: 420px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .tip b { color: var(--text); font-weight: 600; }
  .tip .row { display: flex; justify-content: space-between; gap: 16px; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  pre.code { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 12px/1.55 var(--mono); color: #d4d4d8; overflow: auto; max-height: 720px; white-space: pre; }
  pre.wrap { white-space: pre-wrap; word-break: break-word; }
  .files { display: grid; grid-template-columns: 280px 1fr; gap: 14px; }
  .files .list { border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 720px; }
  .files .list a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; text-decoration: none; color: var(--text-2); font: 12px var(--mono); border-bottom: 1px solid var(--line-soft); }
  .files .list a.on, .files .list a:hover { background: var(--panel-2); color: var(--text); }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); color: var(--text-2); border-radius: 7px; padding: 5px 10px; font: 500 12px inherit; cursor: pointer; }
  .btn.on, .btn:hover { color: var(--text); border-color: var(--text-4); }
  .btn.on { background: var(--accent-soft); border-color: rgba(162,239,91,.45); color: var(--accent); }
  input.search { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 6px 10px; font: 13px inherit; width: 260px; }
  .step { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--panel); }
  .step > .head { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12px; color: var(--text-3); }
  .step > .head b { color: var(--text-2); }
  .step .body { padding: 8px 12px; }
  .step .msg { white-space: pre-wrap; word-break: break-word; font-size: 13px; color: #e4e4e7; }
  details { margin: 6px 0; }
  details > summary { cursor: pointer; color: var(--text-2); font: 12px var(--mono); }
  details > summary:hover { color: var(--text); }
  details pre { margin: 6px 0 0; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--text-3); }
  .kv dd { margin: 0; font-family: var(--mono); color: var(--text); overflow-wrap: anywhere; }
  .cmp { width: 100%; }
  .cmp td:first-child { color: var(--text-3); }
  .error { color: #fecaca; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.4); border-radius: 10px; padding: 12px 14px; margin: 12px 0; white-space: pre-wrap; }
  .empty { color: var(--text-3); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .loading { color: var(--text-3); padding: 40px 0; }
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<nav class="tiles" id="side" aria-label="Tasks"></nav>
<div class="body">
  <main><nav id="crumbs"></nav><div id="app"><div class="loading">Loading…</div></div></main>
</div>
<div class="tip" id="tip"></div>
<script>
"use strict";
// ---------- data ----------
const cache = new Map();
async function api(path, text = false) {
  const key = (text ? "t:" : "j:") + path;
  if (!cache.has(key)) {
    cache.set(key, fetch(path).then(async (r) => {
      if (!r.ok) {
        let message = r.statusText;
        try { message = (await r.json()).error || message; } catch (_) {}
        throw new Error(`${path}: ${message}`);
      }
      return text ? r.text() : r.json();
    }));
  }
  try { return await cache.get(key); } catch (e) { cache.delete(key); throw e; }
}
const fileUrl = (n, path) => `/api/file/${n}/${path.split("/").map(encodeURIComponent).join("/")}`;

// ---------- formatting ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = (x) => typeof x === "number" && Number.isFinite(x);
const fix = (x, d = 2) => isNum(x) ? x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
const usd = (x, d = 2) => isNum(x) ? (x < 0 ? "−$" : "$") + fix(Math.abs(x), d) : "–";
const susd = (x, d = 2) => isNum(x) ? (x > 0 ? "+" : x < 0 ? "−" : "") + "$" + fix(Math.abs(x), d) : "–";

  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  try {
    // #/@0.9.0/…: a published release.
    const want = parts[0]?.startsWith("@") ? parts.shift().slice(1) : null;
    if (!index || want !== release) {
      release = want; heroPickReset(); currentTask = null;
      await loadIndex();
    }
    onCompare = parts[0] === "compare";
    if (onCompare) {
      renderSide();
      return await renderCompare(...(parts.slice(1).join("/").split(/\.{2,3}/)));
    }
    if (parts[0] === "trial") {
      // A trial of another release: show that release around it.
      if (!trialById(+parts[1])) {
        const other = (await api(`/api/trial/${+parts[1]}`)).summary?.release;
        const primary = index.releases.find((r) => r.primary)?.label;
        if (other && other !== (release ?? primary)) { release = other === primary ? null : other; heroPickReset(); await loadIndex(); }
      }
      const t = trialById(+parts[1]);
      if (t?.task && t.task !== currentTask) { currentTask = t.task; renderHero(); }
      renderSide();
      if (parts.length >= 4 && parts[2] === "session") return await renderSession(+parts[1], parts[3]);
      return await renderTrial(+parts[1], parts[2] || "sessions");
    }
    const task = parts[0] === "task" ? parts[1] : index.tasks[0]?.name;
    if (currentTask !== task) { currentTask = task; renderHero(); }
    renderSide();
    if (!task) { app.innerHTML = `<div class="empty">No trials yet.</div>`; return; }
    return await renderTask(task, parts[2] || null, parts[3] !== undefined ? +parts[3] : null);
  } catch (e) { fail(e); }
}
addEventListener("hashchange", () => { route(); });
let resizeTimer, lastWidth = innerWidth;
addEventListener("resize", () => { if (Math.abs(innerWidth - lastWidth) < 40) return; lastWidth = innerWidth; clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { renderHero(); route(); }, 250); });

// ---------- header ----------
// The bench at a glance, styled like a stock quote: a watchlist of models on
// the left, and the selected model's equity curve on the right. The curve is
// its cumulative PnL over the hidden sessions, in order, against the
// reference's on the same sessions.
// The model picked per task; else the best mean skill.
let heroPick = {};
const heroPickReset = () => { heroPick = {}; };
const naturalCmp = (a, b) => a.localeCompare(b, "en", { numeric: true });
// A task's curves: per model, the mean PnL of its graded trials on each
// session of the most common hidden set, accumulated; and the reference's.
function equity(taskName) {
  const graded = index.trials.filter((t) => t.task === taskName && t.graded && t.pnls && Object.keys(t.pnls).length);
  const bySeed = new Map();
  for (const t of graded) { const k = t.eval_seed_sha256 || "?"; bySeed.set(k, [...(bySeed.get(k) || []), t]); }
  let set = []; for (const v of bySeed.values()) if (v.length > set.length) set = v;
  const sessions = [...new Set(set.flatMap((t) => Object.keys(t.pnls)))].sort(naturalCmp);
  const curve = (ts, key) => {
    let acc = 0;
    return [0, ...sessions.map((s) => { acc += mean(ts.map((t) => t[key]?.[s])) ?? 0; return acc; })];
  };
  const models = modelOrder.map((m) => {
    const all = index.trials.filter((t) => t.task === taskName && t.model === m);
    const mine = set.filter((t) => t.model === m);
    return {
      model: m, trials: all.length, graded: mine.length,
      running: all.filter((t) => t.status === "pending").length,
      skill: mean(mine.map((t) => t.skill)),
      curve: mine.length ? curve(mine, "pnls") : null,
    };
  }).filter((r) => r.trials);
  return { sessions, models, reference: set.length ? curve(set, "reference_pnls") : null };
}
const compactUsd = (x) => (x > 0 ? "+" : x < 0 ? "−" : "") + "$" + compact(Math.abs(x));
const trend = (x) => isNum(x) ? (x >= 0 ? "up" : "down") : "";
function sparkline(curve, cls) {
  if (!curve || curve.length < 2) return `<svg width="64" height="26"></svg>`;
  const lo = Math.min(0, ...curve), hi = Math.max(0, ...curve), r = hi - lo || 1;
  const pts = curve.map((y, i) => `${(i / (curve.length - 1) * 62 + 1).toFixed(1)},${(24 - (y - lo) / r * 22).toFixed(1)}`).join(" ");
  const z = (24 - (0 - lo) / r * 22).toFixed(1);
  return `<svg width="64" height="26" viewBox="0 0 64 26"><line x1="1" x2="63" y1="${z}" y2="${z}" stroke="#3a3a3c" stroke-dasharray="1 2"/><polyline points="${pts}" fill="none" stroke="var(--${cls || "text-3"})" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}
function renderHero() {

  const all = index.tasks.reduce((c, t) => { for (const k in t.counts) c[k] = (c[k] || 0) + t.counts[k]; return c; }, {});
  const cost = sum(trials.map((t) => t.cost_usd));
  const agentMs = sum(trials.map((t) => span(t.agent_execution)));
  const b = index.batch;
  const dataset = index.dataset || "machine-trading";
  const task = index.tasks.find((t) => t.name === currentTask) || index.tasks[0];
  const eq = task ? equity(task.name) : { models: [], sessions: [] };
  // The selected model: the user's pick, else the best mean skill.
  const ranked = [...eq.models].sort((x, y) => (y.skill ?? -Infinity) - (x.skill ?? -Infinity));
  const key = task?.name;
  if (!eq.models.some((m) => m.model === heroPick[key])) heroPick[key] = ranked[0]?.model ?? null;
  const heroModel = heroPick[key];
  const pick = eq.models.find((m) => m.model === heroModel);
  hero.innerHTML = `<div class="hero-inner"><div class="hero-left">
      <a class="brand" href="${home()}"><span class="dot"></span>mtx <small>bench review</small></a>
      <h1>${esc(shortTask(dataset).replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()))}</h1>
      <div class="ver">${esc(dataset)} <b>${esc(index.version || "?")}</b></div>
      <div class="meta">${esc(index.name || "")}${b ? ` · ${b.models.length} models × ${b.attempts}` : ""} · ${usd(cost, 0)} · ${dur(agentMs)} agent time</div>
      <div class="tallies">${["success", "error", "pending", "queued"].map((k) => `<span title="${k === "pending" ? "running" : k}">${light(k)}${int(all[k] || 0)}</span>`).join("")}</div>
      <div class="watch">${ranked.map((m) => {
        const last = m.curve?.at(-1);
        return `<div class="row ${m.model === heroModel ? "on" : ""}" data-model="${esc(m.model)}">
          <div style="min-width:0"><div class="name">${esc(shortModel(m.model))}</div><div class="sub">${m.graded ? `${susd(last, 0)} · ${m.graded}/${m.trials}` : m.running ? `${m.running} running` : "not graded"}</div></div>
          ${sparkline(m.curve, trend(last))}
          ${isNum(m.skill) ? `<div class="chip ${Math.round(m.skill * 100) >= 100 ? "up" : "down"}" title="skill: PnL over the reference's">${times(m.skill)}</div>`
            : `<div class="chip ${trend(last)}" title="PnL">${isNum(last) ? compactUsd(last) : "–"}</div>`}
        </div>`;

    </div><div class="hero-right">
      <div class="hero-bar">
        <span class="eyebrow">${task ? `${esc(taskTitle(task.short))} <span class="muted">${esc(task.name)}</span>` : ""}</span>
        ${releaseBar()}
      </div>
      <div class="quote"><span class="big" id="q-big"></span><span class="chg" id="q-chg"></span></div>
      <div class="quote-sub" id="q-sub"></div>
      <div id="q-area"></div>
    </div></div>`;
  hero.querySelectorAll(".watch .row").forEach((r) => r.addEventListener("click", () => { heroPick[key] = r.dataset.model; renderHero(); }));
  const area = document.getElementById("q-area");
  const big = document.getElementById("q-big"), chg = document.getElementById("q-chg"), sub = document.getElementById("q-sub");
  if (!pick?.curve) {
    big.textContent = pick ? shortModel(pick.model) : "No trials";
    sub.innerHTML = pick?.running ? `${pick.running} trial${pick.running > 1 ? "s" : ""} still running` : "";
    area.outerHTML = `<div class="area-empty">${pick?.running ? "Waiting for the first graded trial" : "Nothing graded yet"}</div>`;
    return;
  }
  // The quote: the PnL so far, and how it stands against the reference's.
  const quote = (i) => {
    const y = pick.curve[i], r = eq.reference?.[i];
    big.textContent = susd(y, 0);
    big.style.color = "";
    const d = isNum(r) ? y - r : null;
    chg.className = "chg " + (isNum(d) && Math.abs(d) < 0.5 ? "" : trend(d));
    chg.textContent = !isNum(d) ? "" : Math.abs(d) < 0.5 ? "matches the reference" : `${susd(d, 0)} vs reference`;
    const at = i === pick.curve.length - 1
      ? `<b>${esc(shortModel(pick.model))}</b> · cumulative PnL over ${eq.sessions.length} hidden session${eq.sessions.length > 1 ? "s" : ""}${isNum(pick.skill) ? ` · skill <b>${times(pick.skill)}</b>` : ""}`
      : i === 0 ? `<b>${esc(shortModel(pick.model))}</b> · before the first session`

    sub.innerHTML = at + (eq.reference ? `<span class="key"><svg width="18" height="6"><line x1="0" x2="18" y1="3" y2="3" stroke="#8e8e93" stroke-dasharray="4 3"/></svg>reference</span>` : "");
  };

}
// Releases newest first, after the batch reviewed if it isn't one.
const releaseOrder = (rs) => [...rs.filter((r) => !r.published), ...rs.filter((r) => r.published).sort((x, y) => naturalCmp(y.label, x.label))];
// The releases to switch to, and a comparison with the one before.
function releaseBar() {
  const rs = releaseOrder(index.releases || []);
  if (rs.length < 2) return "";
  const here = index.release;
  const prev = compareTarget()?.[1];
  const href = (r) => r.primary ? "#/" : `#/@${encodeURIComponent(r.label)}/`;
  return `<div class="rel"><span class="k">Release</span><div class="seg">${rs.map((r) => `<a class="${r.label === here ? "on" : ""}" href="${href(r)}" title="${r.published ? "published in bench/results" : "the batch reviewed"}">${esc(r.label)}</a>`).join("")}</div>
    ${prev && prev !== here ? `<a class="cmp-link" href="#/compare/${encodeURIComponent(here)}...${encodeURIComponent(prev)}">Compare with ${esc(prev)} →</a>` : ""}</div>`;
}
// A stock-style area chart: a line with a gradient under it, a quiet grid,
// values on the right. Green when the curve ends at or above zero.
function areaChart(host, { y, ref, labels, onScrub }) {
  host.className = "area";
  host.innerHTML = "";
  const W = Math.max(320, host.clientWidth), H = host.clientHeight || 230;
  const L = 4, R = 64, T = 10, B = 24;
  const vals = [...y, ...(ref || [])].filter(isNum);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const n = y.length;
  const sx = (i) => L + (n > 1 ? i / (n - 1) : 0.5) * (W - L - R);
  const sy = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const color = (y.at(-1) ?? 0) >= 0 ? "var(--up)" : "var(--down)";
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}` }, host);
  const id = "g" + Math.random().toString(36).slice(2, 8);
  const defs = el("defs", {}, svg);
  const g = el("linearGradient", { id, x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
  el("stop", { offset: "0%", "stop-color": color, "stop-opacity": 0.42 }, g);
  el("stop", { offset: "100%", "stop-color": color, "stop-opacity": 0.02 }, g);
  // Grid: four values, on the right.
  for (const v of ticks(lo, hi, 4)) {
    if (v < lo || v > hi) continue;
    el("line", { x1: L, x2: W - R, y1: sy(v), y2: sy(v), stroke: "#2c2c2e", "stroke-width": 1 }, svg);
    const t = el("text", { x: W - R + 10, y: sy(v) + 4, class: "ylab" }, svg); t.textContent = susd(v, 0).replace("+", "");
  }
  if (lo < 0 && hi > 0) el("line", { x1: L, x2: W - R, y1: sy(0), y2: sy(0), stroke: "#48484a", "stroke-width": 1, "stroke-dasharray": "2 3" }, svg);
  // Session labels along the bottom, at most about one per 90 px.
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - L - R) / 90))));
  for (let i = every; i < n; i += every) {
    el("line", { x1: sx(i), x2: sx(i), y1: T, y2: H - B, stroke: "#1c1c1e", "stroke-width": 1 }, svg);
    const t = el("text", { x: sx(i), y: H - 6, class: "xlab", "text-anchor": "middle" }, svg); t.textContent = String(labels[i]).replace(/^hidden-/, "#");
  }
  const path = (ys) => ys.map((v, i) => `${i ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join("");
  if (ref) {
    el("path", { d: path(ref), fill: "none", stroke: "#8e8e93", "stroke-width": 1.2, "stroke-dasharray": "4 4", opacity: 0.7 }, svg);
  }
  el("path", { d: `${path(y)}L${sx(n - 1)},${H - B}L${sx(0)},${H - B}Z`, fill: `url(#${id})` }, svg);
  el("path", { d: path(y), fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  el("circle", { cx: sx(n - 1), cy: sy(y.at(-1)), r: 3.5, fill: color }, svg);
  // Scrub: a cursor and a dot follow the pointer; the quote follows them.
  const cur = el("line", { y1: T, y2: H - B, stroke: "#d1d1d6", "stroke-width": 1, opacity: 0 }, svg);
  const dot = el("circle", { r: 5, fill: color, stroke: "#000", "stroke-width": 2, opacity: 0 }, svg);
  const rdot = el("circle", { r: 3.5, fill: "#8e8e93", opacity: 0 }, svg);
  const show = (i) => {
    const on = i !== null;
    for (const e of [cur, dot]) e.setAttribute("opacity", on ? 1 : 0);
    rdot.setAttribute("opacity", on && ref ? 1 : 0);
    if (on) {
      cur.setAttribute("x1", sx(i)); cur.setAttribute("x2", sx(i));
      dot.setAttribute("cx", sx(i)); dot.setAttribute("cy", sy(y[i]));
      if (ref) { rdot.setAttribute("cx", sx(i)); rdot.setAttribute("cy", sy(ref[i])); }
    }
    onScrub?.(i);
  };
  svg.addEventListener("pointermove", (ev) => {
    const box = svg.getBoundingClientRect();
    const x = (ev.clientX - box.left) / box.width * W;
    show(Math.max(0, Math.min(n - 1, Math.round((x - L) / (W - L - R) * (n - 1)))));
  });
  svg.addEventListener("pointerleave", () => show(null));
}

// ---------- tiles ----------
// The venue a task trades, as a tile's badge: phoenix-… is PHX.
const VENUES = { phoenix: "PHX", kamino: "KMN", pump: "PUMP", oracle: "ORCL", spot: "SPOT" };
const taskBadge = (short) => VENUES[short.split("-")[0]] || short.slice(0, 3).toUpperCase();
// "phoenix-flash-crash" reads as "Flash crash".
const taskTitle = (short) => { const words = short.split("-"); if (VENUES[words[0]] && words.length > 1) words.shift(); const t = words.join(" "); return t.charAt(0).toUpperCase() + t.slice(1); };
let onCompare = false;
function renderSide() {
  const tiles = index.tasks.map((t, i) => {
    const c = t.counts;
    const foot = [t.version ? `v${esc(t.version)}` : null, `${c.success} graded`, c.error ? `${c.error} failed` : null, c.pending ? `${c.pending} running` : null, c.queued ? `${c.queued} queued` : null].filter(Boolean).join(" · ");
    return `<a class="tile c${i % 7} ${!onCompare && t.name === currentTask ? "on" : ""}" href="${taskHref(t.name)}" title="${esc(t.name)}">
      <span class="row"><span class="tbadge">${esc(taskBadge(t.short))}</span><span class="title">${esc(taskTitle(t.short))}</span></span>
      <span class="desc">${esc(t.description || t.name)}</span>
      <span class="foot">${c.pending ? `<span class="live"></span>` : ""}${foot}</span>
    </a>`;
  });
  // Like the playground's Docs tile: a gray one for comparing releases.
  const cmp = compareTarget();
  if (cmp) tiles.push(`<a class="tile ${onCompare ? "on" : ""}" href="#/compare/${encodeURIComponent(cmp[0])}...${encodeURIComponent(cmp[1])}">
      <span class="row"><span class="tbadge">CMP</span><span class="title">Compare</span></span>
      <span class="desc">Each model's skill across releases, task by task.</span>
      <span class="foot">${esc(cmp[0])} vs ${esc(cmp[1])}</span>
    </a>`);

// What to compare by default: the release shown against the one before it.
function compareTarget() {
  const rs = releaseOrder(index.releases || []);
  if (rs.length < 2) return null;
  const here = index.release;
  const published = rs.filter((r) => r.published).map((r) => r.label);
  const at = published.indexOf(here);
  const prev = at >= 0 ? published[at + 1] : published[0];
  return prev && prev !== here ? [here, prev] : null;
}

// ---------- task ----------
// Trials of a task that can be compared session by session: the ones graded
// on the most common hidden set.
function comparable(trials) {
  const bySeed = new Map();
  for (const t of trials) if (t.details) { const k = t.eval_seed_sha256 || "files"; bySeed.set(k, [...(bySeed.get(k) || []), t]); }
  let best = []; for (const v of bySeed.values()) if (v.length > best.length) best = v;
  return best;
}
// A label per trial: its model, and its attempt among that model's trials.
function who(trials) {
  const seen = {};
  return trials.map((t) => {
    const k = (seen[t.model] = (seen[t.model] || 0) + 1);
    return { t, model: t.model, attempt: k, color: modelColor(t.model), dash: DASHES[(k - 1) % DASHES.length], shape: SHAPES[(k - 1) % SHAPES.length], label: `${shortModel(t.model)} #${k}` };
  });
}

async function renderTask(name, variant, at) {
  const task = index.tasks.find((t) => t.name === name);
  if (!task) { fail(new Error(`no task ${name}`)); return; }
  setCrumbs([[index.name || "bench", home()], [task.short, null]]);
  const trials = task.trials.map(trialById).filter(Boolean);
  // Re-rendering the same task (a new variant): keep the page, swap the explorer.
  const same = app.dataset.task === name && app.querySelector("#explorer");
  if (!same) {
    app.innerHTML = ""; app.dataset.task = name;
    const st = taskStatus(task.counts);
    div(`<h1>${light(st)} ${esc(task.short)} <small>${esc(task.name)}${task.version ? " · " + esc(task.version) : ""}</small></h1>${task.description ? `<div class="sub" style="max-width:900px;font-size:14px;color:var(--text-2)">${esc(task.description)}</div>` : ""}`);
    taskLeaderboard(trials);
    div("", "", app).id = "explorer";
  }
  await renderExplorer(document.getElementById("explorer"), task, trials, variant, at);
}

function taskLeaderboard(trials) {

    return {

  section("Trials", "click one for its agent, bot and logs", right);
  table(right, trials, [
    { key: "status", label: "", sort: (t) => t.status, fmt: (t) => light(t.status === "success" && t.exception ? "success" : t.status, t.status) },

    { key: "trial", label: "Trial", mono: true, fmt: (t) => esc(String(t.trial || "").split("__").pop()) },

    { key: "pnl_usd", label: "PnL", r: true, fmt: (t) => `<span class="${cls(t.pnl_usd)}">${susd(t.pnl_usd, 0)}</span>` },
    { key: "agent", label: "Agent", r: true, sort: (t) => span(t.agent_execution), fmt: (t) => dur(span(t.agent_execution)) },
    { key: "badges", label: "", sort: (t) => t.exception?.type || "", fmt: statusBadges },
  ], { onClick: (t) => { location.hash = `${home()}trial/${t.id}`; }, maxHeight: "none" });
}

// The variants (sessions) every comparable trial ran, and one of them
// charted across all of them.
async function renderExplorer(host, task, trials, variant, at) {
  const set = comparable(trials);
  host.innerHTML = "";
  section("Variants", set.length ? `${set.length} trial${set.length === 1 ? "" : "s"} on the same hidden set` : "", host);
  if (!set.length) { div(`<div class="empty">No trial of this task has step-by-step session files yet${trials.some((t) => t.status === "pending") ? " (some are still running)" : ""}. Trials graded before they existed have their sessions on the trial page.</div>`, "", host); return; }
  const people = who(set);
  // What each variant was drawn as, from one trial's detail files.
  const first = await api(`/api/trial/${set[0].id}`);
  const names = first.sessions.bot;
  const stats = first.session_stats || {};
  const v = variant && names.includes(variant) ? variant : names[0];
  const rows = names.map((n, i) => ({ i, name: n, kind: [stats[n]?.description, describeAnnotation(stats[n]?.annotation)].filter(Boolean).join(" · "), ref: set[0].reference_pnls?.[n], pnl: Object.fromEntries(people.map((p) => [p.t.id, p.t.pnls?.[n]])) }));
  const wrap = div("", "", host);
  const all = rows.flatMap((r) => Object.values(r.pnl)).filter(isNum).map(Math.abs);
  const scale = Math.max(1, ...all);
  const heat = (x) => isNum(x) ? `<span style="color:${x >= 0 ? "var(--accent)" : "var(--ask)"};opacity:${0.45 + 0.55 * Math.min(1, Math.abs(x) / scale)}">${susd(x, 0)}</span>` : "–";
  table(wrap, rows, [
    { key: "i", label: "#", r: true, fmt: (r) => r.i + 1 },
    { key: "name", label: "Variant", mono: true },
    { key: "kind", label: "Drawn as", fmt: (r) => `<span class="muted" title="${esc(r.kind)}">${esc(r.kind.length > 70 ? r.kind.slice(0, 70) + "…" : r.kind)}</span>` },
    { key: "ref", label: "Reference", r: true, fmt: (r) => susd(r.ref, 0) },
    ...people.map((p) => ({ key: "p" + p.t.id, label: p.label, r: true, sort: (r) => r.pnl[p.t.id], fmt: (r) => heat(r.pnl[p.t.id]) })),
  ], { maxHeight: "300px", onClick: (r) => { location.hash = `${taskHref(task.name)}/${encodeURIComponent(r.name)}`; } });
  wrap.querySelectorAll("tbody tr").forEach((tr) => { if (rows[+tr.dataset.i]?.name === v) { tr.classList.add("sel"); } });
  const view = div("", "", host);
  await renderVariant(view, task, people, v, at);
}

async function renderVariant(host, task, people, name, startAt) {
  host.innerHTML = `<div class="loading">Loading ${esc(name)} for ${people.length} trials…</div>`;
  const details = await Promise.all(people.map((p) => api(`/api/session/${p.t.id}/bot/${encodeURIComponent(name)}`).catch(() => null)));
  const ref = await api(`/api/session/${people[0].t.id}/reference/${encodeURIComponent(name)}`).catch(() => null);
  const runs = people.map((p, i) => ({ ...p, d: details[i] })).filter((r) => r.d);
  if (!runs.length) { host.innerHTML = `<div class="empty">No detail file for ${esc(name)}.</div>`; return; }
  const base = ref || runs[0].d, sc = base.scenario, tl = base.timeline;
  const making = !!sc.making;
  const steps = tl.steps || [];
  const xEnd = Math.max(tl.end_slot - tl.start_slot, steps.length ? steps[steps.length - 1].at : 1);
  const X = [0, xEnd];
  const informed = Array.isArray(base.annotation?.informed) ? base.annotation.informed : [];
  const everyone = [...(ref ? [{ label: "reference", color: REFERENCE.color, dash: REFERENCE.dash, shape: "circle", d: ref, reference: true, t: { id: people[0].t.id } }] : []), ...runs];
  const hidden = new Set(JSON.parse(sessionStorage.getItem("hidden") || "[]"));
  const visible = () => everyone.filter((r) => !hidden.has(r.label));
  host.innerHTML = "";
  div(`<h2 style="margin-top:18px">${esc(name)} <small>${esc(describeAnnotation(base.annotation))} · ${esc(sc.description || "")}</small></h2>`, "", host);
  // Legend: who did what; click to show or hide.
  const legend = div("", "legend-bar", host);
  const drawLegend = () => {
    legend.innerHTML = everyone.map((r) => `<span class="who ${hidden.has(r.label) ? "off" : ""}" data-l="${esc(r.label)}"><span class="sw" style="background:${r.color};${r.dash ? `background:repeating-linear-gradient(90deg,${r.color} 0 5px,transparent 5px 8px)` : ""}"></span>${esc(r.label)} <span class="pnl ${cls(r.d.report.pnl_usd)}">${susd(r.d.report.pnl_usd)}</span>${r.d.disqualified ? ` <span class="badge bad" title="${esc(r.d.disqualified)}">DQ</span>` : ""}</span>`).join("") +
      `<span class="who" style="cursor:default"><span style="color:var(--bid)">▲</span><span style="color:var(--ask)">▼</span> market orders · <span style="color:var(--bid)">–</span><span style="color:var(--ask)">–</span> limit orders</span>`;
    legend.querySelectorAll("[data-l]").forEach((e) => e.addEventListener("click", () => { const l = e.dataset.l; hidden.has(l) ? hidden.delete(l) : hidden.add(l); sessionStorage.setItem("hidden", JSON.stringify([...hidden])); drawLegend(); drawCharts(); }));
  };
  const chartsHost = div("", "", host);
  const scrub = div("", "scrub", host);
  const now = div("", "now", host);
  let cursor = 0, pinned = false, group = null;
  // Sends of one turn, alike ones counted together.
  const groupTxs = (txs) => {
    const out = [];
    for (const x of txs) {
      const text = describeTx(x), ok = x.ok || x.duplicate;
      let g = out.find((o) => o.text === text && o.ok === ok);
      if (!g) out.push((g = { text, ok, n: 0, dups: 0 }));
      if (x.duplicate) g.dups += 1; else g.n += 1;
    }
    return out;
  };
  const describeTx = (tx) => (tx.instructions || []).filter((i) => i.program !== "compute_budget").map((i) => i.order ? `${i.order.kind === "ImmediateOrCancel" ? "market" : i.order.kind === "PostOnly" ? "post-only" : "limit"} ${i.order.side} ${fix(i.order.size, 3)}${isNum(i.order.price_usd) ? " @ $" + fix(i.order.price_usd) : ""}` : (i.name || i.program.slice(0, 8))).join(", ") || "transaction";
  const drawCharts = () => {
    chartsHost.innerHTML = "";
    group = new Group(); group.label = (x) => `${clock(x)} · slot +${Math.round(x)}`; group.tips = false;
    const vis = visible();
    // Orders on the price chart, in each trial's color.
    const marks = [];
    // A market order fills near the market, not at its limit (its worst
    // price): it's drawn at the mark.
    const markAt = (x) => at(steps.map((q) => [q.at, q.mark_usd]), x)?.[1];
    for (const r of vis) for (const tx of r.d.timeline.transactions || []) {
      if (!isNum(tx.at) || tx.duplicate) continue;
      for (const ix of tx.instructions || []) {
        const o = ix.order; if (!o || !isNum(o.price_usd)) continue;
        const bid = o.side === "bid";
        marks.push(o.kind === "ImmediateOrCancel"
          ? { x: tx.at, y: markAt(tx.at) ?? o.price_usd, shape: bid ? "up" : "down", color: r.color, r: 4, opacity: tx.ok ? 0.95 : 0.3 }
          : { x: tx.at, y: o.price_usd, shape: "tick", color: r.color, r: 3, opacity: tx.ok ? 0.65 : 0.2 });
      }
    }
    const P = (k) => steps.map((q) => [q.at, q[k]]);
    group.add(chart(chartsHost, {
      title: "Scenario: price and the orders each trial sent", height: 300, x: X, xfmt: clock, yfmt: (v) => "$" + fix(v),
      vlines: (sc.path || []).filter((w) => w.slot <= xEnd).map((w) => ({ x: w.slot, color: "rgba(250,250,250,.06)", dash: "1 0" })),
      marks: marks.length > 6000 ? marks.filter((_, i) => i % Math.ceil(marks.length / 6000) === 0) : marks,
      series: [
        { label: "best bid / ask", type: "band", color: "var(--text-2)", opacity: 0.09, data: steps.filter((q) => isNum(q.best_bid_usd) && isNum(q.best_ask_usd)).map((q) => [q.at, q.best_bid_usd, q.best_ask_usd]) },
        { label: "planned level", color: "var(--text-3)", dash: "4 3", width: 1.2, step: true, data: P("level_usd") },
        { label: "index", color: "var(--index)", width: 1.2, step: true, data: P("index_usd") },
        { label: "mark", color: "var(--text)", width: 1.6, step: true, data: P("mark_usd") },
      ],
    }));
    const overrideRows = [{ label: "overrides", events: (() => { let last = 0; return (sc.path || []).filter((w) => w.slot <= xEnd).map((w) => { const e = { x: w.slot, color: "var(--text-2)", shape: "bar", title: `level ${w.level_pct > 0 ? "+" : ""}${fix(w.level_pct)}%` }; last = w.level_pct; return e; }); })() }];
    if (making) {
      const tk = tl.taker_orders || [];
      for (const side of ["buy", "sell"]) overrideRows.push({ label: `taker ${side}`, events: tk.map((o, i) => ({ o, i })).filter(({ o }) => o.side === side).map(({ o, i }) => ({ x: o.at, color: side === "buy" ? "var(--bid)" : "var(--ask)", r: informed[i] ? 3.4 : 2.1, fill: informed[i] ? "transparent" : undefined, stroke: informed[i] ? (side === "buy" ? "var(--bid)" : "var(--ask)") : undefined, opacity: informed[i] ? 1 : 0.5 })) });
    }
    group.add(lanes(chartsHost, { title: "Scenario events" + (making ? " (○ informed)" : ""), x: X, xfmt: clock, rows: overrideRows }));
    const cap = base.report.mandate?.universe?.[0]?.max_position;
    group.add(chart(chartsHost, {
      title: "Position", height: 170, x: X, xfmt: clock, zero: true, yfmt: (v) => fix(v, 1),
      hlines: isNum(cap) ? [{ y: cap, color: "var(--ask)", label: `cap ${fix(cap, 0)}`, fit: false }, { y: -cap, color: "var(--ask)", fit: false }] : [],
      series: vis.map((r) => ({ label: r.label, color: r.color, dash: r.dash, width: r.reference ? 1.3 : 1.8, step: true, data: r.d.timeline.steps.map((q) => [q.at, q.position]) })),
    }));
    group.add(chart(chartsHost, {
      title: "PnL", height: 190, x: X, xfmt: clock, zero: true, yfmt: (v) => usd(v, 0),
      series: vis.map((r) => ({ label: r.label, color: r.color, dash: r.dash, width: r.reference ? 1.3 : 2, step: true, data: r.d.timeline.steps.map((q) => [q.at, q.pnl_usd]) })),
    }));
    group.add(lanes(chartsHost, {
      title: "Transactions by trial", x: X, xfmt: clock, left: 110,
      rows: vis.map((r) => ({ label: r.label.slice(0, 15), events: (r.d.timeline.transactions || []).filter((x) => isNum(x.at) || isNum(x.step)).map((x) => ({ x: isNum(x.at) ? x.at : (r.d.timeline.steps[x.step]?.at ?? 0), color: x.duplicate ? "var(--warn)" : x.ok ? r.color : "var(--ask)", shape: x.ok ? undefined : "x", r: 2.3, opacity: 0.75 })) })),
    }));
    group.onMove = (x) => { if (!pinned) setCursor(x, false); };
    group.onClick = (x) => { pinned = true; setCursor(x, true); };
    group.pin(cursor);
  };
  // The cursor: a slider over the session, steps with the arrow keys.
  const stepAt = (x) => { let best = 0; for (let i = 0; i < steps.length; i++) if (steps[i].at <= x) best = i; return best; };
  scrub.innerHTML = `<button class="btn" data-d="-1" title="Previous step (←)">◀</button><button class="btn" data-d="1" title="Next step (→)">▶</button><span class="t"></span><input type="range" min="0" max="${steps.length - 1}" value="0"><button class="btn" data-pin title="Pin the cursor (click a chart to pin it there)">pin</button><span class="muted" style="font-size:12px">hover a chart to scrub · click to pin · ← → step</span>`;
  const slider = scrub.querySelector("input");
  const pinBtn = scrub.querySelector("[data-pin]");
  function setCursor(x, fromUser) {
    const i = stepAt(x);
    cursor = steps[i]?.at ?? 0;
    slider.value = i;
    pinBtn.classList.toggle("on", pinned);
    scrub.querySelector(".t").textContent = `${clock(cursor)} · slot +${cursor} · step ${i}`;
    if (group) group.pin(cursor);
    drawNow(i);
    // A pinned cursor goes in the address, so the moment can be shared.
    if (pinned && fromUser) history.replaceState(null, "", `${taskHref(task.name)}/${encodeURIComponent(name)}/${cursor}`);
  }
  slider.addEventListener("input", () => { pinned = true; setCursor(steps[+slider.value]?.at ?? 0, true); });
  scrub.querySelectorAll("[data-d]").forEach((b) => b.addEventListener("click", () => { pinned = true; const i = Math.min(steps.length - 1, Math.max(0, stepAt(cursor) + +b.dataset.d)); setCursor(steps[i].at, true); }));
  pinBtn.addEventListener("click", () => { pinned = !pinned; setCursor(cursor, true); });
  const onKey = (e) => {
    if (!document.body.contains(scrub)) { removeEventListener("keydown", onKey); return; }
    if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); pinned = true;
    const i = Math.min(steps.length - 1, Math.max(0, stepAt(cursor) + (e.key === "ArrowRight" ? 1 : -1)));
    setCursor(steps[i].at, true);
  };
  addEventListener("keydown", onKey);

  // Beneath the charts: the world and each trial at the cursor, and every
  // event around it.
  const WINDOW = 40; // slots either side: 10 s
  function drawNow(i) {
    const s = steps[i] || {}, t = s.at ?? 0, prev = steps[i - 1];
    const path = sc.path || [];
    const lastW = [...path].reverse().find((w) => w.slot <= t), nextW = path.find((w) => w.slot > t);
    const vis = visible();
    const per = vis.map((r) => {
      const rs = r.d.timeline.steps, k = Math.min(rs.length - 1, i), q = rs[k] || {}, p = rs[k - 1];
      const here = (r.d.timeline.transactions || []).filter((x) => (isNum(x.step) ? x.step === k : x.at === t));
      return { r, q, d: p ? q.position - p.position : 0, here };
    });
    const world = `<div class="panel"><div class="k" style="margin-bottom:8px">The world at ${clock(t)}</div><dl class="kv">
      <dt>Mark</dt><dd>${usd(s.mark_usd)} <span class="muted">${prev ? susd(s.mark_usd - prev.mark_usd) : ""}</span></dd>
      <dt>Index</dt><dd>${usd(s.index_usd)}</dd>
      <dt>Planned level</dt><dd>${usd(s.level_usd)} <span class="muted">${isNum(s.level_usd) && isNum(tl.start_mark_usd) ? pct(s.level_usd / tl.start_mark_usd - 1, 2) : ""}</span></dd>
      <dt>Best bid / ask</dt><dd>${usd(s.best_bid_usd)} / ${usd(s.best_ask_usd)} <span class="muted">${isNum(s.best_bid_usd) && isNum(s.best_ask_usd) ? fix((s.best_ask_usd - s.best_bid_usd) / s.mark_usd * 1e4, 1) + " bp" : ""}</span></dd>
      <dt>Last override</dt><dd>${lastW ? `${clock(lastW.slot)}: level ${lastW.level_pct > 0 ? "+" : ""}${fix(lastW.level_pct)}%` : "none yet"}</dd>
      <dt>Next override</dt><dd>${nextW ? `in ${clock(nextW.slot - t)}: level ${nextW.level_pct > 0 ? "+" : ""}${fix(nextW.level_pct)}%` : "none"}</dd>
      ${making ? `<dt>Takers this step</dt><dd>${(tl.taker_orders || []).map((o, j) => ({ o, j })).filter(({ o }) => o.at > (prev?.at ?? -1) && o.at <= t).map(({ o, j }) => `${o.side} ${fix(o.size, 2)}${informed[j] ? " (informed)" : ""}`).join(", ") || "none"}</dd>` : ""}
    </dl></div>`;
    const who = `<div class="panel"><div class="k" style="margin-bottom:8px">Each trial at ${clock(t)}</div><table class="cmp"><thead><tr><th>Trial</th><th class="r">Position</th><th class="r">Δ</th><th class="r">PnL</th><th>Sent this turn</th></tr></thead><tbody>${per.map(({ r, q, d, here }) => `<tr><td><span class="swatch" style="background:${r.color}"></span>${esc(r.label)}</td><td class="r num">${fix(q.position, 3)}</td><td class="r num ${cls(d)}">${Math.abs(d) > 1e-9 ? (d > 0 ? "+" : "") + fix(d, 3) : ""}</td><td class="r num ${cls(q.pnl_usd)}">${susd(q.pnl_usd)}</td><td style="white-space:normal;font-size:12px">${here.length ? groupTxs(here).map((g) => `<div class="${g.ok ? "" : "neg"}">${g.ok ? "" : "✗ "}${esc(g.text)}${g.n > 1 ? ` <span class="muted">×${g.n}</span>` : ""}${g.dups ? ` <span style="color:var(--warn)" title="the same transaction again: the chain ran it once">${g.dups} duplicate${g.dups > 1 ? "s" : ""}, didn't run</span>` : ""}</div>`).join("") : `<span class="muted">${q.answered === false ? "overran its turn" : "nothing"}</span>`}</td></tr>`).join("")}</tbody></table></div>`;
    // Every event within the window, in time order.
    const events = [];
    for (const w of path) if (Math.abs(w.slot - t) <= WINDOW) events.push({ at: w.slot, who: "scenario", color: "var(--text-2)", text: `override: level ${w.level_pct > 0 ? "+" : ""}${fix(w.level_pct)}%` });
    if (making) (tl.taker_orders || []).forEach((o, j) => { if (Math.abs(o.at - t) <= WINDOW) events.push({ at: o.at, who: "taker", color: o.side === "buy" ? "var(--bid)" : "var(--ask)", text: `${o.side} ${fix(o.size, 3)} (limit $${fix(o.limit_usd)})${informed[j] ? " · informed" : ""}` }); });
    for (const r of vis) {
      for (const x of r.d.timeline.transactions || []) {
        const at = isNum(x.at) ? x.at : r.d.timeline.steps[x.step]?.at;
        if (isNum(at) && Math.abs(at - t) <= WINDOW) events.push({ at, who: r.label, color: r.color, text: `${x.duplicate ? "duplicate (didn't run): " : x.ok ? "" : "FAILED: "}${describeTx(x)}${!x.ok && !x.duplicate && x.error ? " — " + String(x.error).slice(0, 80) : ""}` });
      }
      const rs = r.d.timeline.steps;
      for (let k = 1; k < rs.length; k++) {
        const d = rs[k].position - rs[k - 1].position;
        if (Math.abs(d) > 1e-9 && Math.abs(rs[k].at - t) <= WINDOW) events.push({ at: rs[k].at, who: r.label, color: r.color, text: `position ${d > 0 ? "+" : ""}${fix(d, 3)} → ${fix(rs[k].position, 3)}` });
      }
      for (const c of r.d.timeline.calls?.refused || []) { const at = rs[c.step]?.at; if (isNum(at) && Math.abs(at - t) <= WINDOW) events.push({ at, who: r.label, color: "var(--critical)", text: `REFUSED ${c.method}` }); }
    }
    events.sort((a, b) => a.at - b.at);
    const log = `<div class="panel" style="grid-column:1/-1"><div class="k" style="margin-bottom:8px">Events from ${clock(Math.max(0, t - WINDOW))} to ${clock(t + WINDOW)} <span class="muted" style="text-transform:none;letter-spacing:0">(${events.length})</span></div><div class="evlog">${events.map((e) => `<div class="ev ${e.at > (prev?.at ?? -1) && e.at <= t ? "cur" : ""}"><span>${clock(e.at)} <span class="muted">+${e.at}</span></span><span class="who-l"><span class="swatch" style="background:${e.color}"></span>${esc(e.who)}</span><span>${esc(e.text)}</span></div>`).join("") || `<div class="muted">Nothing happened around here.</div>`}</div></div>`;
    now.innerHTML = world + who + log;
  }
  drawLegend();
  drawCharts();
  if (isNum(startAt)) { pinned = true; setCursor(startAt, false); } else setCursor(0, false);
}

// ---------- compare ----------
// Two releases (or batches), task by task: each model's mean skill on both,
// the change, and the skill over every release published.
async function renderCompare(a, b) {
  const releases = releaseOrder((await api("/api/releases")).releases);
  const label = (r) => r.label;
  const byLabel = new Map(releases.map((r) => [r.label, r]));
  const ra = byLabel.get(a), rb = byLabel.get(b);
  setCrumbs([[index.name || "bench", home()], ["compare", null]]);
  app.innerHTML = ""; delete app.dataset.task;
  const pickers = (side, current) => releases.map((r) => `<a class="${r.label === current ? "on" : ""}" href="#/compare/${encodeURIComponent(side === "a" ? r.label : a)}...${encodeURIComponent(side === "b" ? r.label : b)}">${esc(r.label)}</a>`).join("");
  div(`<h1>${esc(a)} <small>vs</small> ${esc(b)}</h1>
    <div class="cmp-pick"><span class="k">From</span><div class="seg">${pickers("b", b)}</div><span class="k">to</span><div class="seg">${pickers("a", a)}</div>
    <a class="btn" href="#/compare/${encodeURIComponent(b)}...${encodeURIComponent(a)}">swap</a></div>
    <div class="sub">Skill is a model's PnL over the reference's on the same hidden sessions, so it compares across releases whose hidden sets differ. A task's version can change between releases too: it's shown under each.</div>`);
  if (!ra || !rb) { div(`No release named ${esc(!ra ? a : b)}. Known: ${releases.map(label).map(esc).join(", ")}`, "error"); return; }
  // Oldest first, for the lines over releases.
  const ordered = [...releases].filter((r) => r.published || r === ra || r === rb).reverse();
  const models = [...new Set(releases.flatMap((r) => Object.values(r.tasks).flatMap((t) => Object.keys(t.models))))].sort();
  const color = (m) => PALETTE[models.indexOf(m) % PALETTE.length];
  const tasks = [...new Set([...Object.keys(ra.tasks), ...Object.keys(rb.tasks)])].sort();
  for (const task of tasks) {
    const ta = ra.tasks[task], tb = rb.tasks[task];
    const ms = [...new Set([...Object.keys(ta?.models || {}), ...Object.keys(tb?.models || {})])].sort();
    const host = div(`<div class="cmp-head"><h2>${esc(task)}</h2><span class="muted">task ${esc(tb?.version ?? "–")} → ${esc(ta?.version ?? "–")}</span></div>`, "cmp-card");
    const grid = div("", "cmp-grid", host);
    const rows = ms.map((m) => {
      const sa = ta?.models[m]?.skill, sb = tb?.models[m]?.skill;
      const d = isNum(sa) && isNum(sb) ? sa - sb : null;
      return `<tr><td><span class="sw" style="background:${color(m)}"></span>${esc(shortModel(m))}</td>
        <td class="num">${times(sb)}</td><td class="num">${times(sa)}</td>
        <td><span class="delta ${isNum(d) ? (d >= 0 ? "up" : "down") : ""}">${isNum(d) ? (d >= 0 ? "+" : "−") + fix(Math.abs(d)) + "×" : isNum(sa) ? "new" : "–"}</span></td></tr>`;
    }).join("");
    div(`<table class="cmp-table"><thead><tr><th>Model</th><th class="num">${esc(b)}</th><th class="num">${esc(a)}</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table>`, "", grid);
    const chartHost = div("", "cmp-chart", grid);
    const cols = ordered.filter((r) => r.tasks[task]);
    skillLines(chartHost, {
      labels: cols.map(label), marked: [a, b],
      series: ms.map((m) => ({ model: m, color: color(m), ys: cols.map((r) => r.tasks[task].models[m]?.skill ?? null) })),
    });
  }
}
// Each model's skill over releases: lines in the header's style, with the
// two compared releases marked and the reference at 1×.
function skillLines(host, { labels, marked, series }) {
  host.innerHTML = "";
  const W = Math.max(300, host.clientWidth), H = 220, L = 10, R = 58, T = 14, B = 26;
  const vals = [1, 0, ...series.flatMap((s) => s.ys)].filter(isNum);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || 0.5; lo -= pad; hi += pad;
  const n = labels.length;
  const sx = (i) => n > 1 ? L + 16 + i / (n - 1) * (W - L - R - 32) : (L + W - R) / 2;
  const sy = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "lines" }, host);
  for (const v of ticks(lo, hi, 4)) {
    if (v < lo || v > hi) continue;
    el("line", { x1: L, x2: W - R, y1: sy(v), y2: sy(v), stroke: "#2c2c2e" }, svg);
    el("text", { x: W - R + 10, y: sy(v) + 4, class: "ylab" }, svg).textContent = fix(v, 1) + "×";
  }
  el("line", { x1: L, x2: W - R, y1: sy(1), y2: sy(1), stroke: "#8e8e93", "stroke-dasharray": "4 4", opacity: 0.8 }, svg);
  el("text", { x: L + 2, y: sy(1) - 6, class: "ylab" }, svg).textContent = "reference";
  labels.forEach((l, i) => {
    const on = marked.includes(l);
    if (on) el("rect", { x: sx(i) - 18, y: T, width: 36, height: H - T - B, rx: 6, fill: "rgba(255,255,255,.05)" }, svg);
    el("text", { x: sx(i), y: H - 7, class: "xlab", "text-anchor": "middle", fill: on ? "#fafafa" : undefined }, svg).textContent = l;
  });
  for (const s of series) {
    let d = "", pen = false;
    s.ys.forEach((v, i) => { if (!isNum(v)) { pen = false; return; } d += `${pen ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`; pen = true; });
    if (d) el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    s.ys.forEach((v, i) => {
      if (!isNum(v)) return;
      const c = el("circle", { cx: sx(i), cy: sy(v), r: marked.includes(labels[i]) ? 4.5 : 3, fill: s.color, stroke: "#000", "stroke-width": 1.5 }, svg);
      c.addEventListener("mousemove", (ev) => showTip(`<b>${esc(shortModel(s.model))}</b> · ${esc(labels[i])}<br>skill ${times(v)}`, ev));
      c.addEventListener("mouseleave", hideTip);
    });
  }
}

// ---------- trial ----------
function trialHeader(n, t, tab) {
  setCrumbs([[index.name || "bench", home()], [shortTask(t.task), taskHref(t.task)], [`${shortModel(t.model)} · ${t.trial}`, `${home()}trial/${n}`]]);
  app.innerHTML = ""; delete app.dataset.task;
  div(`<h1>${esc(shortModel(t.model))} <small>${esc(shortTask(t.task))} · ${esc(t.trial)}</small></h1><div class="sub">${statusBadges(t)} <span class="num">${esc(t.path)}</span></div>`);
  const agentMs = span(t.agent_execution), verifierMs = span(t.verifier_execution);
  div(`<div class="cards">
    ${card("Skill", times(t.skill), "PnL over the reference's; 1 matches it", true)}
    ${card("Reward", fix(t.reward, 4), "PnL over the hindsight bound")}
    ${card("PnL", `<span class="${cls(t.pnl_usd)}">${susd(t.pnl_usd)}</span>`, `reference ${susd(t.reference_pnl_usd)}`)}
    ${card("Sessions", int(t.sessions), t.disqualified ? `<span class="neg">${t.disqualified} disqualifying</span>` : "none disqualifying")}
    ${card("Worst session", susd(t.risk?.worst_pnl_usd), `tail ${susd(t.risk?.tail_pnl_usd)}`)}
    ${card("Max drawdown", usd(t.risk?.max_drawdown_usd), `${pct(t.risk?.profitable_share, 0)} profitable · sharpe ${fix(t.risk?.sharpe)}`)}
    ${card("Agent", dur(agentMs), `${compact(t.tokens?.output)} output tokens`)}
    ${card("Cost", usd(t.cost_usd), `${compact(t.tokens?.input)} input · ${compact(t.tokens?.cache)} cached`)}
    ${card("Grading", dur(verifierMs), t.eval_seed_sha256 ? `set ${String(t.eval_seed_sha256).slice(0, 12)}…` : "")}
  </div>`);
  if (t.exception) div(`<div class="error"><b>${esc(t.exception.type)}</b>: ${esc(t.exception.message)}</div>`);
  const tabs = [["sessions", "Sessions"], ["agent", "Agent"], ["bot", "Bot"], ["logs", "Logs"], ["raw", "Report"]];
  div(tabs.map(([k, label]) => `<a href="${home()}trial/${n}/${k}" class="${tab === k ? "on" : ""}">${label}</a>`).join(""), "tabs");
