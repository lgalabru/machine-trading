<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtx · bench review</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --panel: #09090b;
    --panel-2: #0e0e10;
    --line: #27272a;
    --line-soft: #18181b;
    --text: #fafafa;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --text-4: #52525b;
    --accent: #a2ef5b;
    --accent-soft: rgba(162, 239, 91, 0.14);
    --ref: #7aa2f7;
    --ref-soft: rgba(122, 162, 247, 0.16);
    --index: #f5b74a;
    --bid: #34d399;
    --ask: #f87171;
    --critical: #ef4444;
    --warn: #f59e0b;
    --up: #5ed16a;
    --down: #ff5f57;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  /* The header: the bench, its version, and a summary chart. */
  header.hero {
    border-bottom: 1px solid var(--line); position: relative; overflow: hidden;
    background: radial-gradient(ellipse 70% 120% at 30% -20%, rgba(94, 209, 106, 0.08), transparent 60%), var(--bg);
  }
  header.hero:empty { display: none; }
  .hero-inner { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px 32px; padding: 22px 32px 24px; }
  /* The model selector: a vertical list of cards, one per model. */
  .watch { display: flex; flex-direction: column; gap: 8px; }
  /* The peek: an attempt opened over the page, Notion-style. */
  .peek-backdrop { position: fixed; inset: 52px 0 0 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 40; }
  .peek-backdrop.on { opacity: 1; pointer-events: auto; cursor: pointer; }
  .peek { position: fixed; top: 52px; right: 0; bottom: 0; left: 440px; min-width: 640px; background: var(--bg); border-left: 1px solid var(--line); box-shadow: -28px 0 60px rgba(0,0,0,.65); z-index: 41; display: flex; flex-direction: column; transform: translateX(104%); transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  .peek.on { transform: none; }
  @media (max-width: 1100px) { .peek { left: 150px; min-width: 0; } }
  .peek-bar { padding: 14px 26px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .peek-row { display: flex; align-items: center; gap: 10px; }
  .peek-head .runstats { margin: 12px 0 2px; background: var(--bg); }
  .peek-head .tabs { margin: 8px 0 -1px; border-bottom: 0; justify-content: center; }
  .peek-head:empty { display: none; }
  .peek-title { margin-right: auto; display: flex; align-items: baseline; gap: 10px; min-width: 0; white-space: nowrap; }
  .peek-title .sw { width: 11px; height: 11px; border-radius: 3px; align-self: center; flex: none; }
  .peek-title .pt-run { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .peek-title .pt-sub { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
  .peek-title .pt-sep { color: var(--text-4); font-size: 16px; }
  .peek-title .pt-scn { font: 600 15px var(--mono); }
  .peek-x { background: none; border: 1px solid var(--line); color: var(--text-2); border-radius: 8px; width: 30px; height: 28px; cursor: pointer; font-size: 13px; }
  .peek-x:hover { color: var(--text); background: #1c1c1e; }
  .peek-body { flex: 1; overflow: auto; padding: 16px 26px 60px; }
  /* A run's stats: stacked bars, and what the agent did. */
  .sbars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 6px; }
  @media (max-width: 1100px) { .sbars { grid-template-columns: 1fr; } }
  .sbar { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 14px; }
  .sbar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; font-size: 12px; }
  .sbar-track { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; }
  .sbar-track i { display: block; min-width: 3px; }
  .sbar-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 9px; font-size: 11.5px; color: var(--text-2); }
  .sbar-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sbar-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .insights { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; margin: 12px 0 16px; }
  @media (max-width: 1300px) { .insights { grid-template-columns: 1fr 1fr; } }
  .ins-card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 14px; min-width: 0; }
  .ins-card .k { margin-bottom: 8px; }
  .ins-card .k .muted { text-transform: none; letter-spacing: 0; font-weight: 500; margin-left: 6px; }
  .tw { display: grid; grid-template-columns: minmax(0, 130px) 1fr 52px 34px; gap: 8px; align-items: center; font-size: 12px; padding: 2px 0; }
  .tw-k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
  .tw-bar { height: 8px; border-radius: 4px; background: #1c1c1e; overflow: hidden; }
  .tw-bar i { display: block; height: 100%; background: var(--ref); border-radius: 4px; }
  .tw .num { text-align: right; }
  svg.mini { display: block; width: 100%; height: 70px; }
  .mini-axis { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--text-4); margin-top: 2px; }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 12px; }
  dl.facts dt { color: var(--text-3); } dl.facts dd { margin: 0; color: var(--text-2); overflow-wrap: anywhere; }
  .pareto { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
  svg.pareto-svg { display: block; width: 100%; height: auto; }
  svg.pareto-svg .ylab { font: 500 10px var(--mono); fill: #8e8e93; }
  svg.pareto-svg .plab { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #d1d1d6; }
  /* A run: its title and numbers, then the tabs. */
  .run-head { margin-top: 2px; }
  .runstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 4px; overflow: hidden; }
  .rs { padding: 9px 12px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); margin: 0 -1px -1px 0; min-width: 0; }
  .rs:last-child { border-right: 0; }
  .rs-k { font-size: 9.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
  .rs-v { font: 600 14px var(--mono); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs-d { font-size: 10.5px; line-height: 1.35; color: var(--text-3); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* The scenarios: a list of cards beside the picked one's timeline. */
  .scn-list .scn-item { display: block; padding: 8px 10px 7px; }
  .scn-top { display: flex; align-items: center; gap: 8px; }
  .scn-name { font: 600 12px var(--mono); }
  .scn-pnl { margin-left: auto; font: 600 13px var(--mono); }
  .scn-spark { display: block; width: 100%; height: 46px; margin: 5px 0 3px; }
  .scn-sub { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-3); }
  .scn-sub span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scn-sub span:last-child { white-space: nowrap; font-family: var(--mono); }
  .scn-view { min-width: 0; }
  .scn-view h1 { font-size: 22px; }
  .scn-view .btns { flex-wrap: nowrap; white-space: nowrap; }
  /* The grid: models › attempts × sessions. */
  .g-card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 16px 18px 12px; }
  .g-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
  .g-top h2 { margin: 0 0 2px; }
  .g-top .muted { font-size: 12.5px; max-width: 720px; }
  .g-row { display: grid; grid-template-columns: minmax(200px, 250px) 58px 76px 50px 56px minmax(0, 1fr); align-items: center; gap: 0 12px; padding: 0 8px; border-radius: 8px; }
  .g-row > .num { text-align: right; font-size: 12.5px; }
  .g-head { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); padding-bottom: 6px; }
  .g-head > span:not(.g-name):not(.strip) { text-align: right; }
  .g-row.run { height: 32px; cursor: pointer; }
  .g-row.run.first { margin-top: 6px; }
  .g-row.run:not(.first) .g-name b { color: var(--text-3); font-weight: 500; }
  .g-row.run:hover { background: rgba(255,255,255,.035); }
  .g-row.run.picked { background: color-mix(in srgb, var(--mc) 7%, transparent); }
  .g-row.run.queued { opacity: .5; cursor: default; }
  .g-name .run-n { font: 600 12px var(--mono); color: var(--text-2); }
  .g-row.model:hover { background: rgba(255,255,255,.03); }
  .g-row.model.picked { background: color-mix(in srgb, var(--mc) 9%, transparent); }
  .g-row.trial { height: 30px; }
  .g-row.trial:hover { background: rgba(255,255,255,.025); }
  .g-row.trial.queued { opacity: .55; }
  .g-row.ref { height: 34px; margin-top: 6px; border-top: 1px dashed var(--line); border-radius: 0; }
  .g-name { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-decoration: none; font-size: 13px; }
  .g-name .muted { font-size: 11.5px; }
  .g-row.trial .g-name { padding-left: 26px; color: var(--text-2); }
  .g-row.trial .g-name:hover { color: var(--text); }
  .g-row.trial .g-name::before { content: ""; position: absolute; }
  .g-name .caret { display: inline-block; width: 12px; color: var(--text-3); transition: transform .15s; font-size: 14px; }
  .g-name .caret.open { transform: rotate(90deg); }
  .g-name .sw { width: 9px; height: 9px; border-radius: 3px; background: var(--mc); flex: none; }
  .g-name .sw.dash { background: repeating-linear-gradient(90deg, #8e8e93 0 3px, transparent 3px 5px); }
  .g-name .light { width: 7px; height: 7px; }
  .g-name .badge { font-size: 10px; padding: 0 6px; }
  .strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; align-items: center; }
  .strip i { display: block; height: 18px; border-radius: 3px; background: #1c1c1e; cursor: pointer; transition: transform .08s, box-shadow .08s; }
  .strip i.na { background: transparent; box-shadow: inset 0 0 0 1px #1c1c1e; }
  .strip i.hc { box-shadow: 0 0 0 1px rgba(255,255,255,.55); }
  .strip i.sel { box-shadow: 0 0 0 1.5px #fff; }
  .strip.axis i { height: 14px; background: none; font: 600 9px var(--mono); color: var(--text-4); text-align: center; line-height: 14px; overflow: visible; white-space: nowrap; border-radius: 3px; }
  .strip.axis i.hc { background: #2c2c2e; box-shadow: none; color: var(--text); }
  .strip.axis i.sel { background: #fff; color: #000; box-shadow: none; }
  .strip-note { font-size: 11.5px; color: var(--text-3); padding-left: 2px; }
  .strip-note.live { color: var(--warn); animation: blink 1.4s ease-in-out infinite; }
  .strip-note.bad { color: var(--down); }
  .g-foot { display: flex; gap: 16px; align-items: center; font-size: 11.5px; color: var(--text-2); margin-top: 12px; padding: 10px 8px 0; border-top: 1px solid var(--line-soft); }
  .g-foot span { display: inline-flex; align-items: center; gap: 6px; }
  .g-foot .lg { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .g-foot .lg.up { background: rgba(94,209,106,.85); } .g-foot .lg.down { background: rgba(255,95,87,.85); }
  .g-foot .muted { margin-left: auto; }
  .grid-empty { margin-top: 18px; padding: 22px; border: 1px dashed var(--line); border-radius: 12px; color: var(--text-3); text-align: center; font-size: 13px; }
  .grid-empty b { color: var(--text-2); }
  .hero-title { grid-column: 1 / -1; }
  .hero-title h1 { margin: 0; }
  .hero-title .sub { max-width: 900px; font-size: 14px; color: var(--text-2); margin-top: 4px; }
  .watch-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .seg.sm a { padding: 3px 9px; font-size: 11px; }
  .watch-hint { color: var(--text-4); font-size: 11px; text-align: right; margin-top: 2px; }
  .quote.multi { gap: 22px; }
  .quote.multi .q { display: flex; flex-direction: column; gap: 2px; }
  .quote.multi .qn { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .quote.multi .qn .sw { width: 8px; height: 8px; border-radius: 3px; }
  .quote.multi .mid { font: 600 26px/1.05 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .quote.multi .chg { font-size: 12px; }
  .watch .row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 72px; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, background .15s; }
  .watch .row:hover { background: var(--panel-2); }
  .watch .row.on { border-color: var(--mc, var(--text-3)); box-shadow: 0 0 0 1px var(--mc, var(--text-3)) inset; }
  .watch .name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
  .watch .name .sw { width: 8px; height: 8px; border-radius: 3px; background: var(--mc); }
  .watch .sub { color: var(--text-3); font-size: 11px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .watch .chip { justify-self: end; width: 68px; text-align: right; padding: 4px 8px; border-radius: 6px; font: 600 13px var(--mono); color: var(--text-2); background: #2c2c2e; }
  .watch .chip.up { background: var(--up); color: #04160a; }
  .watch .chip.down { background: var(--down); color: #fff; }
  /* The breadcrumb: mtx › release › task › trial › session, with menus. */
  nav.crumbbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 4px; padding: 10px 24px; min-height: 52px; background: rgba(0,0,0,.82); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); font-size: 13px; }
  .crumb { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 8px; color: var(--text-2); text-decoration: none; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  a.crumb:hover, .crumb-menu > summary:hover { background: #1c1c1e; color: var(--text); }
  .crumb.here { color: var(--text); font-weight: 600; }
  .crumb.brand { font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  .crumb.brand .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 10px rgba(162,239,91,.6); }
  .crumb .tbadge { font: 700 9px var(--mono); padding: 2px 5px; border-radius: 4px; color: #fff; background: var(--tc, #3a3a3c); }
  .crumb .caret { color: var(--text-4); font-size: 10px; }
  .crumb-sep { color: var(--text-4); font-size: 14px; padding: 0 1px; user-select: none; }
  .crumb-menu { position: relative; }
  .crumb-menu > summary { list-style: none; cursor: pointer; }
  .crumb-menu > summary::-webkit-details-marker { display: none; }
  .crumb-menu[open] > summary { background: #1c1c1e; color: var(--text); }
  .crumb-list { position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; padding: 6px; background: #161618; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.55); z-index: 30; }
  .crumb-list a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--text-2); }
  .crumb-list a:hover { background: #232326; color: var(--text); }
  .crumb-list a.on { color: var(--text); font-weight: 600; }
  .crumb-list a .note { margin-left: auto; color: var(--text-4); font: 11px var(--mono); }
  .crumbbar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font: 500 12px var(--mono); color: var(--text-2); }
  .crumbbar .right span { display: inline-flex; align-items: center; gap: 6px; }
  .crumbbar .right .light { width: 7px; height: 7px; }
  /* The overview: the bench at a glance, before any task is picked. */
  .ov-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .ov-title h1 { font-size: 34px; letter-spacing: -0.03em; margin: 0; }
  .ov-title .ver { font: 600 12px var(--mono); color: var(--text-2); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .ov-lede { color: var(--text-2); max-width: 820px; font-size: 15px; line-height: 1.55; margin: 10px 0 22px; }
  .ov-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .ov-judge { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ov-judge .card p { margin: 6px 0 0; color: var(--text-2); font-size: 13px; line-height: 1.5; }
  @media (max-width: 1100px) { .ov-judge { grid-template-columns: 1fr; } .hero-inner { grid-template-columns: 1fr; } }
  .lb td.cell { cursor: pointer; }
  .hero-right { min-width: 0; display: flex; flex-direction: column; }
  .seg { display: flex; gap: 2px; padding: 2px; background: #1c1c1e; border-radius: 9px; width: fit-content; }
  .seg a { padding: 5px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--text-2); text-decoration: none; }
  .seg a.on { background: #3a3a3c; color: var(--text); }
  /* Compare: one card per task. */
  .cmp-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0 6px; }
  .cmp-card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 16px 18px; margin: 18px 0; }
  .cmp-head { display: flex; align-items: baseline; gap: 12px; }
  .cmp-head h2 { margin: 0; }
  .cmp-grid { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.4fr); gap: 28px; align-items: center; margin-top: 10px; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cmp-table th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .cmp-table td { padding: 9px 8px; border-bottom: 1px solid var(--line-soft); }
  .cmp-table .num { text-align: right; font-family: var(--mono); }
  .cmp-table .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; }
  .delta { display: inline-block; min-width: 64px; text-align: right; padding: 3px 8px; border-radius: 6px; font: 600 12px var(--mono); background: #2c2c2e; color: var(--text-2); }
  .delta.up { background: var(--up); color: #04160a; } .delta.down { background: var(--down); color: #fff; }
  .cmp-chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .cmp-chart .ylab { font: 500 11px var(--mono); fill: #8e8e93; }
  .cmp-chart .xlab { font: 600 11px var(--mono); fill: #8e8e93; }
  .quote { display: flex; align-items: flex-end; gap: 14px; height: 64px; overflow: hidden; margin: 10px 0 4px; }
  .quote:not(.multi) { align-items: baseline; padding-top: 22px; }
  .quote .big { font: 600 42px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .quote .chg { font: 600 15px var(--mono); }
  .quote .chg.up { color: var(--up); } .quote .chg.down { color: var(--down); }
  .quote-sub { color: var(--text-3); font-size: 12px; height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quote-sub .key { display: inline-flex; align-items: center; gap: 6px; margin-left: 14px; }
  .quote-sub b { color: var(--text-2); font-weight: 500; }
  .area { position: relative; margin-top: 12px; height: 240px; }
  .area svg { display: block; width: 100%; height: 100%; overflow: visible; touch-action: none; }
  .area .ylab { font: 500 11px var(--mono); fill: #8e8e93; }
  .area .xlab { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #8e8e93; }
  .area-empty { height: 240px; display: grid; place-items: center; color: var(--text-3); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; margin-top: 12px; }

  section("Leaderboard", "mean skill: PnL over the reference's on the same scenarios; the reference scores 1×");
  const rows = modelOrder.map((m) => {
    const per = index.tasks.map((t) => mean(index.trials.filter((x) => x.task === t.name && x.model === m && x.graded).map((x) => x.skill)));
    return { model: m, per, mean: mean(per) };
  }).sort((x, y) => (y.mean ?? -Infinity) - (x.mean ?? -Infinity));
  const chipFor = (v) => isNum(v) ? `<span class="delta ${Math.round(v * 100) >= 100 ? "up" : "down"}">${times(v)}</span>` : `<span class="muted">–</span>`;
  div(`<table class="cmp-table lb"><thead><tr><th>Model</th>${index.tasks.map((t) => `<th class="num">${esc(taskTitle(t.short))}</th>`).join("")}<th class="num">Mean</th></tr></thead><tbody>${rows.map((r) => `<tr><td><span class="sw" style="background:${modelColor(r.model)}"></span>${esc(shortModel(r.model))}</td>${r.per.map((v, i) => `<td class="num cell" data-task="${esc(index.tasks[i].name)}">${chipFor(v)}</td>`).join("")}<td class="num">${chipFor(r.mean)}</td></tr>`).join("")}</tbody></table>`, "cmp-card");
  app.querySelectorAll("td.cell").forEach((td) => td.addEventListener("click", () => { location.hash = taskHref(td.dataset.task); }));
  // Cost against skill, per task: which models are worth what they cost.
  section("Skill for the money", "each model's mean skill against its mean agent cost per run; the line is the frontier: no model is both cheaper and better");
  const pareto = div("", "pareto");
  for (const t of index.tasks) {
    const pts = modelOrder.map((m) => {
      const ts = index.trials.filter((x) => x.task === t.name && x.model === m);
      return { model: m, cost: mean(ts.map((x) => x.cost_usd)), skill: mean(ts.filter((x) => x.graded).map((x) => x.skill)), n: ts.length };
    }).filter((p) => isNum(p.cost) && isNum(p.skill));
    const cardEl = div(`<div class="k">${esc(taskTitle(t.short))}</div>`, "ins-card", pareto);
    paretoChart(cardEl, pts);
  }
  section("How bots are judged");
  div([
    `<div class="card"><div class="k">The score is PnL</div><p><b>skill</b> is a bot's total PnL over the hidden set divided by the reference bot's on the same scenarios. <b>reward</b> divides it by a hindsight bound no bot reaches.</p></div>`,
    `<div class="card"><div class="k">Risk is a set of limits</div><p>One market, a position cap and a loss limit, checked every step, plus standard RPC only and no liquidation at the end. One breach in any scenario scores 0.</p></div>`,
    `<div class="card"><div class="k">Reported, not scored</div><p>Worst scenario, tail loss, max drawdown, profitable share and Sharpe, per run. Too noisy over a few dozen scenarios to weigh into a score.</p></div>`,
  ].join(""), "ov-judge");
}

// Points by cost (x) and skill (y), the frontier stepped through the ones
// no other point beats on both.
function paretoChart(host, pts) {
  if (!pts.length) { host.insertAdjacentHTML("beforeend", `<div class="muted">Nothing graded yet.</div>`); return; }
  const W = 420, H = 220, L = 46, R = 16, T = 14, B = 30;
  const xs = pts.map((p) => p.cost), ys = [...pts.map((p) => p.skill), 1, 0];
  let x0 = 0, x1 = Math.max(...xs) * 1.15 || 1, y0 = Math.min(...ys), y1 = Math.max(...ys);
  const py = (y1 - y0) * 0.12 || 0.2; y0 -= py; y1 += py;
  const sx = (x) => L + (x - x0) / (x1 - x0) * (W - L - R), sy = (y) => T + (y1 - y) / (y1 - y0) * (H - T - B);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "pareto-svg" }, host);
  for (const v of ticks(y0, y1, 4)) { if (v < y0 || v > y1) continue; el("line", { x1: L, x2: W - R, y1: sy(v), y2: sy(v), stroke: "#2c2c2e" }, svg); el("text", { x: L - 8, y: sy(v) + 4, "text-anchor": "end", class: "ylab" }, svg).textContent = fix(v, 1) + "×"; }
  for (const v of ticks(x0, x1, 4)) { if (v < x0 || v > x1) continue; el("text", { x: sx(v), y: H - 10, "text-anchor": "middle", class: "ylab" }, svg).textContent = usd(v, 0); }
  el("line", { x1: L, x2: W - R, y1: sy(1), y2: sy(1), stroke: "#8e8e93", "stroke-dasharray": "4 4", opacity: 0.7 }, svg);
  el("text", { x: L + 4, y: sy(1) - 5, class: "ylab" }, svg).textContent = "reference";
  const front = []; let best = -Infinity;
  for (const p of [...pts].sort((a, b) => a.cost - b.cost || b.skill - a.skill)) if (p.skill > best) { front.push(p); best = p.skill; }
  if (front.length > 1) el("path", { d: front.map((p, i) => `${i ? `H${sx(p.cost).toFixed(1)}V` : `M${sx(p.cost).toFixed(1)},`}${sy(p.skill).toFixed(1)}`).join(""), fill: "none", stroke: "#5ed16a", "stroke-width": 1.5, opacity: 0.7 }, svg);
  for (const p of pts) {
    const on = front.includes(p);
    const c = el("circle", { cx: sx(p.cost), cy: sy(p.skill), r: on ? 6 : 5, fill: modelColor(p.model), stroke: on ? "#fff" : "#000", "stroke-width": on ? 1.5 : 1 }, svg);
    const right = sx(p.cost) > W - 110;
    el("text", { x: sx(p.cost) + (right ? -10 : 10), y: sy(p.skill) - 9, "text-anchor": right ? "end" : "start", class: "plab" }, svg).textContent = shortModel(p.model);
    c.addEventListener("mousemove", (ev) => showTip(`<b>${esc(shortModel(p.model))}</b><div>skill ${times(p.skill)} · ${usd(p.cost)} a run · ${p.n} run${p.n > 1 ? "s" : ""}</div>${on ? `<div class="muted">on the frontier</div>` : ""}`, ev));
    c.addEventListener("mouseleave", hideTip);
  }
}

// ---------- task ----------
// A trial's attempt number: its place among its model's trials on the task.
function attemptOf(t) {
  const mine = index.trials.filter((x) => x.task === t.task && x.model === t.model);
  return mine.findIndex((x) => x.id === t.id) + 1;
}
// A run reads as its model and its number: opus-5-5 #2.
const runLabel = (t) => `${shortModel(t.model)} #${attemptOf(t)}`;
const trialShort = (t) => String(t.trial || "").split("__").pop();

let gridMode = "vs";          // cells: "vs" the reference, or raw "pnl"

async function renderTask(name, session, at) {
  const task = index.tasks.find((t) => t.name === name);
  if (!task) { fail(new Error(`no task ${name}`)); return; }
  const trials = task.trials.map(trialById).filter(Boolean);
  const eq = equity(task.name);
  const sel = session && eq.sessions.includes(session) ? session : null;
  if (session && !sel) history.replaceState(null, "", link({ task: task.name, run: picks().run }));
  // Re-rendering the same task (another session): keep the page.
  if (!(app.dataset.task === name && app.querySelector("#grid"))) {
    app.innerHTML = ""; app.dataset.task = name;
    div("", "", app).id = "grid";
    div("", "", app).id = "explorer";
  }
  renderGrid(document.getElementById("grid"), task, trials, eq, sel);
  const explorer = document.getElementById("explorer");
  if (!sel) {
    explorer.innerHTML = `<div class="grid-empty"><b>Pick a scenario</b>, a column, to replay it for every run. A row opens the run: its agent, bot and logs.</div>`;
    return;
  }
  await renderAcross(explorer, task, trials, sel, at);
}

// The task as one grid: a row per run, a column per hidden session. Every
// run in a batch is graded on the same sessions, so a column is one
// scenario across every run.
function renderGrid(host, task, trials, eq, sel) {
  const names = eq.sessions;
  const n = names.length;
  const set = new Set(); // the runs on the batch's main hidden set
  for (const t of trials) if (t.graded && t.pnls && n && Object.keys(t.pnls).every((k) => names.includes(k))) set.add(t.id);
  const ref = names.map((s) => mean(trials.filter((t) => set.has(t.id)).map((t) => t.reference_pnls?.[s])));
  // Runs grouped by model, models in the header cards' order; then the
  // batch's queued runs.
  const order = { skill: (m) => m.skill ?? -Infinity, pnl: (m) => m.curve?.at(-1) ?? -Infinity, cost: (m) => -(m.cost ?? Infinity) }[heroSort] || ((m) => m.skill ?? -Infinity);
  const rank = new Map([...eq.models].sort((a, b) => order(b) - order(a)).map((m, i) => [m.model, i]));
  const runs = [...trials].sort((a, b) => (rank.get(a.model) ?? 99) - (rank.get(b.model) ?? 99) || attemptOf(a) - attemptOf(b));
  const plan = index.batch;
  const queued = (plan?.models || []).flatMap((m) => {
    const have = trials.filter((t) => t.model === m).length;
    return Array.from({ length: Math.max(0, (plan.attempts || 0) - have) }, (_, k) => ({ model: m, k: have + k + 1 }));
  }).sort((a, b) => (rank.get(a.model) ?? 99) - (rank.get(b.model) ?? 99) || a.k - b.k);
  const picked = new Set(heroPick[task.name] || []);
  // Cell color: green or red by the value's sign, deeper with its size.
  const value = (v, i) => !isNum(v) ? null : gridMode === "vs" && isNum(ref[i]) ? v - ref[i] : v;
  const all = runs.flatMap((t) => names.map((s, i) => Math.abs(value(t.pnls?.[s], i) ?? 0))).sort((a, b) => a - b);
  const scale = Math.max(1, all[Math.floor(all.length * 0.95)] || 1);
  const paint = (v) => {
    if (!isNum(v)) return "";
    if (Math.abs(v) < 0.5) return "background:#2c2c2e";
    const a = 0.22 + 0.78 * Math.min(1, Math.abs(v) / scale);
    return `background:${v > 0 ? `rgba(94,209,106,${a.toFixed(2)})` : `rgba(255,95,87,${a.toFixed(2)})`}`;
  };
  const strip = (vals, kind, id) => `<div class="strip" style="--n:${n}">${vals.map((v, i) => {
    const style = kind === "ref" ? (gridMode === "vs" ? (isNum(v) ? "background:#3a3a3c" : "") : paint(v)) : paint(value(v, i));
    return `<i data-c="${i}" data-k="${kind}"${id !== undefined ? ` data-t="${id}"` : ""} class="${names[i] === sel ? "sel" : ""} ${isNum(v) ? "" : "na"}" style="${style}"></i>`;
  }).join("")}</div>`;
  const nums = (skill, pnl, cost, time) => `<span class="num">${times(skill)}</span><span class="num ${cls(pnl)}">${susd(pnl, 0)}</span><span class="num muted">${usd(cost, 0)}</span><span class="num muted">${dur(time)}</span>`;
  let prev = null;
  const rows = runs.map((t) => {
    const first = t.model !== prev; prev = t.model;
    const state = t.status === "pending" ? `<div class="strip-note live">running…</div>`
      : !t.graded ? `<div class="strip-note bad">${esc(t.exception?.type || "no grade")}</div>`
      : !set.has(t.id) ? `<div class="strip-note">graded on another hidden set</div>`
      : strip(names.map((s) => t.pnls?.[s]), "run", t.id);
    return `<div class="g-row run ${first ? "first" : ""} ${picked.has(t.model) ? "picked" : ""}" data-run="${t.id}" style="--mc:${modelColor(t.model)}">
      <a class="g-name" href="${link({ task: task.name, run: t.id, session: sel })}"><span class="sw"></span><b>${esc(shortModel(t.model))}</b><span class="run-n">#${attemptOf(t)}</span>${t.status === "pending" ? light("pending", "running") : ""}${t.disqualified ? `<span class="badge bad">DQ</span>` : ""}${t.exception?.type === "AgentTimeoutError" ? `<span class="badge">timeout</span>` : ""}</a>
      ${nums(t.skill, t.pnl_usd, t.cost_usd, span(t.agent_execution))}${state}</div>`;
  }).join("") + queued.map((r) => `<div class="g-row run queued" style="--mc:${modelColor(r.model)}"><span class="g-name"><span class="sw"></span><b>${esc(shortModel(r.model))}</b><span class="run-n">#${r.k}</span></span><span></span><span></span><span></span><span></span><div class="strip-note">queued</div></div>`).join("");
  const refRow = set.size ? `<div class="g-row ref"><span class="g-name"><span class="sw dash"></span>reference</span>${nums(1, sum(ref), null, null)}${strip(ref, "ref")}</div>` : "";
  // Session numbers along the top: a few, and the one under the pointer.
  const every = Math.max(1, Math.ceil(n / 12));
  const axis = `<div class="strip axis" style="--n:${n}">${names.map((s, i) => `<i data-c="${i}" data-k="col" class="${s === sel ? "sel" : ""}">${(i + 1) % every === 0 || i === 0 ? i + 1 : ""}</i>`).join("")}</div>`;
  host.innerHTML = `<div class="g-card">
    <div class="g-top"><div><h2>Runs × scenarios</h2><div class="muted">A run is one model's attempt at the task: its agent writes a bot once, and the bot is graded on each of the ${n} hidden scenarios every run shares.</div></div>
      <div class="seg sm" title="what a cell's color shows">${[["vs", "vs reference"], ["pnl", "PnL"]].map(([k, l]) => `<a href="javascript:void 0" data-mode="${k}" class="${gridMode === k ? "on" : ""}">${l}</a>`).join("")}</div></div>
    <div class="g-grid">
      <div class="g-row g-head"><span class="g-name">Run</span><span>Skill</span><span>PnL</span><span>Cost</span><span>Time</span>${n ? axis : `<span class="muted">no graded scenarios yet</span>`}</div>
      ${rows}${refRow}
    </div>
    <div class="g-foot"><span><i class="lg up"></i>${gridMode === "vs" ? "beat the reference" : "made money"}</span><span><i class="lg down"></i>${gridMode === "vs" ? "trailed it" : "lost money"}</span><span class="muted">a row opens the run · a column replays the scenario for every run · a cell, one run's scenario</span></div>
  </div>`;
  // Session descriptions for the tooltips, from a run with detail files.
  const withDetails = trials.find((t) => t.details && set.has(t.id));
  let described = {};
  if (withDetails) api(`/api/trial/${withDetails.id}`).then((d) => { described = d.session_stats || {}; }).catch(() => {});
  const cellsOf = (i) => host.querySelectorAll(`.strip i[data-c="${i}"]`);
  let hot = null;
  const heat = (i) => {
    if (hot !== null) cellsOf(hot).forEach((c) => c.classList.remove("hc"));
    hot = i;
    if (i !== null) cellsOf(i).forEach((c) => c.classList.add("hc"));
    heroScrub?.(i === null ? null : i + 1);
  };
  host.querySelectorAll(".strip i").forEach((c) => {
    const i = +c.dataset.c;
    c.addEventListener("mouseenter", (ev) => {
      heat(i);
      const s = names[i], d = described[s];
      const t = c.dataset.t !== undefined ? trialById(+c.dataset.t) : null;
      const v = t ? t.pnls?.[s] : ref[i];
      const who = t ? runLabel(t) : c.dataset.k === "ref" ? "reference" : "";
      showTip(`<b>${esc(s)}</b> <span class="muted">${i + 1} of ${n}</span>${d?.description ? `<div class="muted">${esc(d.description)}</div>` : ""}${who ? `<div>${esc(who)}: <b class="${cls(v)}">${susd(v, 0)}</b>${isNum(ref[i]) && t ? ` <span class="muted">· reference ${susd(ref[i], 0)}</span>` : ""}</div>` : ""}`, ev);
    });
    c.addEventListener("mousemove", (ev) => { tip.style.left = ev.clientX + 14 + "px"; tip.style.top = ev.clientY + 14 + "px"; });
    c.addEventListener("click", (e) => {
      e.stopPropagation(); e.preventDefault();
      const t = c.dataset.t !== undefined ? trialById(+c.dataset.t) : null;
      location.hash = link({ task: task.name, run: t ? t.id : null, session: names[i] });
    });
  });
  host.querySelector(".g-grid").addEventListener("mouseleave", () => { heat(null); hideTip(); });
  // A row anywhere but its cells opens the run.
  host.querySelectorAll(".g-row.run[data-run]").forEach((r) => r.addEventListener("click", (e) => {
    if (e.target.closest(".strip i")) return;
    e.preventDefault();
    location.hash = link({ task: task.name, run: +r.dataset.run, session: sel });
  }));
  host.querySelectorAll("[data-mode]").forEach((a) => a.addEventListener("click", () => { gridMode = a.dataset.mode; renderGrid(host, task, trials, eq, sel); }));
}

// One session across every run that has its detail files.
async function renderAcross(host, task, trials, name, at) {
  const set = comparable(trials);
  if (!set.length) {
    host.innerHTML = `<div class="grid-empty">No run of this task has step-by-step scenario files${trials.some((t) => t.status === "pending") ? " yet (some are still running)" : ""}. Trials graded before they existed have their scenarios in the run's panel.</div>`;
    return;
  }
  const people = who(set);
  const view = host.querySelector(".across") || (host.innerHTML = "", div("", "across", host));
  await renderVariant(view, task, people, name, at);
}
// Trials of a task that can be compared session by session: the ones graded
// on the most common hidden set.
function comparable(trials) {
  const bySeed = new Map();
  for (const t of trials) if (t.details) { const k = t.eval_seed_sha256 || "files"; bySeed.set(k, [...(bySeed.get(k) || []), t]); }
  let best = []; for (const v of bySeed.values()) if (v.length > best.length) best = v;
  return best;
}
// A label per trial: its model, and its attempt among that model's trials.
function who(trials) {
  const seen = {};
  return trials.map((t) => {
    const k = (seen[t.model] = (seen[t.model] || 0) + 1);
    return { t, model: t.model, attempt: k, color: modelColor(t.model), dash: DASHES[(k - 1) % DASHES.length], shape: SHAPES[(k - 1) % SHAPES.length], label: runLabel(t) };
  });
}




async function renderVariant(host, task, people, name, startAt) {
  host.innerHTML = `<div class="loading">Loading ${esc(name)} for ${people.length} trials…</div>`;
  const details = await Promise.all(people.map((p) => api(`/api/session/${p.t.id}/bot/${encodeURIComponent(name)}`).catch(() => null)));
  const ref = await api(`/api/session/${people[0].t.id}/reference/${encodeURIComponent(name)}`).catch(() => null);
  const runs = people.map((p, i) => ({ ...p, d: details[i] })).filter((r) => r.d);
  if (!runs.length) { host.innerHTML = `<div class="empty">No detail file for ${esc(name)}.</div>`; return; }
  const base = ref || runs[0].d, sc = base.scenario, tl = base.timeline;
  const making = !!sc.making;
  const steps = tl.steps || [];
  const xEnd = Math.max(tl.end_slot - tl.start_slot, steps.length ? steps[steps.length - 1].at : 1);
  const X = [0, xEnd];
  const informed = Array.isArray(base.annotation?.informed) ? base.annotation.informed : [];
  const everyone = [...(ref ? [{ label: "reference", color: REFERENCE.color, dash: REFERENCE.dash, shape: "circle", d: ref, reference: true, t: { id: people[0].t.id } }] : []), ...runs];
  const hidden = new Set(JSON.parse(sessionStorage.getItem("hidden") || "[]"));
  const visible = () => everyone.filter((r) => !hidden.has(r.label));
  host.innerHTML = "";
  div(`<h2 style="margin-top:18px">${esc(name)} · every run <small>${esc(describeAnnotation(base.annotation))} · ${esc(sc.description || "")}</small></h2>`, "", host);
  // Legend: who did what; click to show or hide.
  const legend = div("", "legend-bar", host);
  const drawLegend = () => {
    legend.innerHTML = everyone.map((r) => `<span class="who ${hidden.has(r.label) ? "off" : ""}" data-l="${esc(r.label)}"><span class="sw" style="background:${r.color};${r.dash ? `background:repeating-linear-gradient(90deg,${r.color} 0 5px,transparent 5px 8px)` : ""}"></span>${esc(r.label)} <span class="pnl ${cls(r.d.report.pnl_usd)}">${susd(r.d.report.pnl_usd)}</span>${r.d.disqualified ? ` <span class="badge bad" title="${esc(r.d.disqualified)}">DQ</span>` : ""}</span>`).join("") +
      `<span class="who" style="cursor:default"><span style="color:var(--bid)">▲</span><span style="color:var(--ask)">▼</span> market orders · <span style="color:var(--bid)">–</span><span style="color:var(--ask)">–</span> limit orders</span>`;
    legend.querySelectorAll("[data-l]").forEach((e) => e.addEventListener("click", () => { const l = e.dataset.l; hidden.has(l) ? hidden.delete(l) : hidden.add(l); sessionStorage.setItem("hidden", JSON.stringify([...hidden])); drawLegend(); drawCharts(); }));
  };
  const chartsHost = div("", "", host);
  const scrub = div("", "scrub", host);
  const now = div("", "now", host);
  let cursor = 0, pinned = false, group = null;
  // Sends of one turn, alike ones counted together.
  const groupTxs = (txs) => {
    const out = [];
    for (const x of txs) {
      const text = describeTx(x), ok = x.ok || x.duplicate;
      let g = out.find((o) => o.text === text && o.ok === ok);
      if (!g) out.push((g = { text, ok, n: 0, dups: 0 }));
      if (x.duplicate) g.dups += 1; else g.n += 1;
    }
    return out;
  };
  const describeTx = (tx) => (tx.instructions || []).filter((i) => i.program !== "compute_budget").map((i) => i.order ? `${i.order.kind === "ImmediateOrCancel" ? "market" : i.order.kind === "PostOnly" ? "post-only" : "limit"} ${i.order.side} ${fix(i.order.size, 3)}${isNum(i.order.price_usd) ? " @ $" + fix(i.order.price_usd) : ""}` : (i.name || i.program.slice(0, 8))).join(", ") || "transaction";
  const drawCharts = () => {
    chartsHost.innerHTML = "";
    group = new Group(); group.label = (x) => `${clock(x)} · slot +${Math.round(x)}`; group.tips = false;
    const vis = visible();
    // Orders on the price chart, in each trial's color.
    const marks = [];
    // A market order fills near the market, not at its limit (its worst
    // price): it's drawn at the mark.
    const markAt = (x) => at(steps.map((q) => [q.at, q.mark_usd]), x)?.[1];
    for (const r of vis) for (const tx of r.d.timeline.transactions || []) {
      if (!isNum(tx.at) || tx.duplicate) continue;
      for (const ix of tx.instructions || []) {
        const o = ix.order; if (!o || !isNum(o.price_usd)) continue;
        const bid = o.side === "bid";
        marks.push(o.kind === "ImmediateOrCancel"
          ? { x: tx.at, y: markAt(tx.at) ?? o.price_usd, shape: bid ? "up" : "down", color: r.color, r: 4, opacity: tx.ok ? 0.95 : 0.3 }
          : { x: tx.at, y: o.price_usd, shape: "tick", color: r.color, r: 3, opacity: tx.ok ? 0.65 : 0.2 });
      }
    }
    const P = (k) => steps.map((q) => [q.at, q[k]]);
    group.add(chart(chartsHost, {
      title: "Scenario: price and the orders each trial sent", height: 300, x: X, xfmt: clock, yfmt: (v) => "$" + fix(v),
      vlines: (sc.path || []).filter((w) => w.slot <= xEnd).map((w) => ({ x: w.slot, color: "rgba(250,250,250,.06)", dash: "1 0" })),
      marks: marks.length > 6000 ? marks.filter((_, i) => i % Math.ceil(marks.length / 6000) === 0) : marks,
      series: [
        { label: "best bid / ask", type: "band", color: "var(--text-2)", opacity: 0.09, data: steps.filter((q) => isNum(q.best_bid_usd) && isNum(q.best_ask_usd)).map((q) => [q.at, q.best_bid_usd, q.best_ask_usd]) },
        { label: "planned level", color: "var(--text-3)", dash: "4 3", width: 1.2, step: true, data: P("level_usd") },
        { label: "index", color: "var(--index)", width: 1.2, step: true, data: P("index_usd") },
        { label: "mark", color: "var(--text)", width: 1.6, step: true, data: P("mark_usd") },
      ],
    }));
    const overrideRows = [{ label: "overrides", events: (() => { let last = 0; return (sc.path || []).filter((w) => w.slot <= xEnd).map((w) => { const e = { x: w.slot, color: "var(--text-2)", shape: "bar", title: `level ${w.level_pct > 0 ? "+" : ""}${fix(w.level_pct)}%` }; last = w.level_pct; return e; }); })() }];
    if (making) {
      const tk = tl.taker_orders || [];
      for (const side of ["buy", "sell"]) overrideRows.push({ label: `taker ${side}`, events: tk.map((o, i) => ({ o, i })).filter(({ o }) => o.side === side).map(({ o, i }) => ({ x: o.at, color: side === "buy" ? "var(--bid)" : "var(--ask)", r: informed[i] ? 3.4 : 2.1, fill: informed[i] ? "transparent" : undefined, stroke: informed[i] ? (side === "buy" ? "var(--bid)" : "var(--ask)") : undefined, opacity: informed[i] ? 1 : 0.5 })) });
    }
    group.add(lanes(chartsHost, { title: "Scenario events" + (making ? " (○ informed)" : ""), x: X, xfmt: clock, rows: overrideRows }));
    const cap = base.report.mandate?.universe?.[0]?.max_position;
    group.add(chart(chartsHost, {
      title: "Position", height: 170, x: X, xfmt: clock, zero: true, yfmt: (v) => fix(v, 1),
      hlines: isNum(cap) ? [{ y: cap, color: "var(--ask)", label: `cap ${fix(cap, 0)}`, fit: false }, { y: -cap, color: "var(--ask)", fit: false }] : [],
      series: vis.map((r) => ({ label: r.label, color: r.color, dash: r.dash, width: r.reference ? 1.3 : 1.8, step: true, data: r.d.timeline.steps.map((q) => [q.at, q.position]) })),
    }));
    group.add(chart(chartsHost, {
      title: "PnL", height: 190, x: X, xfmt: clock, zero: true, yfmt: (v) => usd(v, 0),
      series: vis.map((r) => ({ label: r.label, color: r.color, dash: r.dash, width: r.reference ? 1.3 : 2, step: true, data: r.d.timeline.steps.map((q) => [q.at, q.pnl_usd]) })),
    }));
    group.add(lanes(chartsHost, {
      title: "Transactions by trial", x: X, xfmt: clock, left: 110,
      rows: vis.map((r) => ({ label: r.label.slice(0, 15), events: (r.d.timeline.transactions || []).filter((x) => isNum(x.at) || isNum(x.step)).map((x) => ({ x: isNum(x.at) ? x.at : (r.d.timeline.steps[x.step]?.at ?? 0), color: x.duplicate ? "var(--warn)" : x.ok ? r.color : "var(--ask)", shape: x.ok ? undefined : "x", r: 2.3, opacity: 0.75 })) })),
    }));
    group.onMove = (x) => { if (!pinned) setCursor(x, false); };
    group.onClick = (x) => { pinned = true; setCursor(x, true); };
    group.pin(cursor);
  };
  // The cursor: a slider over the session, steps with the arrow keys.
  const stepAt = (x) => { let best = 0; for (let i = 0; i < steps.length; i++) if (steps[i].at <= x) best = i; return best; };
  scrub.innerHTML = `<button class="btn" data-d="-1" title="Previous step (←)">◀</button><button class="btn" data-d="1" title="Next step (→)">▶</button><span class="t"></span><input type="range" min="0" max="${steps.length - 1}" value="0"><button class="btn" data-pin title="Pin the cursor (click a chart to pin it there)">pin</button><span class="muted" style="font-size:12px">hover a chart to scrub · click to pin · ← → step</span>`;
  const slider = scrub.querySelector("input");
  const pinBtn = scrub.querySelector("[data-pin]");
  function setCursor(x, fromUser) {
    const i = stepAt(x);
    cursor = steps[i]?.at ?? 0;
    slider.value = i;
    pinBtn.classList.toggle("on", pinned);
    scrub.querySelector(".t").textContent = `${clock(cursor)} · slot +${cursor} · step ${i}`;
    if (group) group.pin(cursor);
    drawNow(i);
    // A pinned cursor goes in the address, so the moment can be shared.
    if (pinned && fromUser) history.replaceState(null, "", link({ task: task.name, run: picks().run, session: name, at: cursor }));
  }
  slider.addEventListener("input", () => { pinned = true; setCursor(steps[+slider.value]?.at ?? 0, true); });
  scrub.querySelectorAll("[data-d]").forEach((b) => b.addEventListener("click", () => { pinned = true; const i = Math.min(steps.length - 1, Math.max(0, stepAt(cursor) + +b.dataset.d)); setCursor(steps[i].at, true); }));
  pinBtn.addEventListener("click", () => { pinned = !pinned; setCursor(cursor, true); });
  const onKey = (e) => {
    if (!document.body.contains(scrub)) { removeEventListener("keydown", onKey); return; }
    if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); pinned = true;
    const i = Math.min(steps.length - 1, Math.max(0, stepAt(cursor) + (e.key === "ArrowRight" ? 1 : -1)));
    setCursor(steps[i].at, true);
  };
  addEventListener("keydown", onKey);

  // Beneath the charts: the world and each trial at the cursor, and every
  // event around it.
  const WINDOW = 40; // slots either side: 10 s
  function drawNow(i) {
    const s = steps[i] || {}, t = s.at ?? 0, prev = steps[i - 1];
    const path = sc.path || [];
    const lastW = [...path].reverse().find((w) => w.slot <= t), nextW = path.find((w) => w.slot > t);
    const vis = visible();
    const per = vis.map((r) => {
      const rs = r.d.timeline.steps, k = Math.min(rs.length - 1, i), q = rs[k] || {}, p = rs[k - 1];
      const here = (r.d.timeline.transactions || []).filter((x) => (isNum(x.step) ? x.step === k : x.at === t));
      return { r, q, d: p ? q.position - p.position : 0, here };
    });
    const world = `<div class="panel"><div class="k" style="margin-bottom:8px">The world at ${clock(t)}</div><dl class="kv">
      <dt>Mark</dt><dd>${usd(s.mark_usd)} <span class="muted">${prev ? susd(s.mark_usd - prev.mark_usd) : ""}</span></dd>
      <dt>Index</dt><dd>${usd(s.index_usd)}</dd>
      <dt>Planned level</dt><dd>${usd(s.level_usd)} <span class="muted">${isNum(s.level_usd) && isNum(tl.start_mark_usd) ? pct(s.level_usd / tl.start_mark_usd - 1, 2) : ""}</span></dd>
      <dt>Best bid / ask</dt><dd>${usd(s.best_bid_usd)} / ${usd(s.best_ask_usd)} <span class="muted">${isNum(s.best_bid_usd) && isNum(s.best_ask_usd) ? fix((s.best_ask_usd - s.best_bid_usd) / s.mark_usd * 1e4, 1) + " bp" : ""}</span></dd>
      <dt>Last override</dt><dd>${lastW ? `${clock(lastW.slot)}: level ${lastW.level_pct > 0 ? "+" : ""}${fix(lastW.level_pct)}%` : "none yet"}</dd>
      <dt>Next override</dt><dd>${nextW ? `in ${clock(nextW.slot - t)}: level ${nextW.level_pct > 0 ? "+" : ""}${fix(nextW.level_pct)}%` : "none"}</dd>
      ${making ? `<dt>Takers this step</dt><dd>${(tl.taker_orders || []).map((o, j) => ({ o, j })).filter(({ o }) => o.at > (prev?.at ?? -1) && o.at <= t).map(({ o, j }) => `${o.side} ${fix(o.size, 2)}${informed[j] ? " (informed)" : ""}`).join(", ") || "none"}</dd>` : ""}
    </dl></div>`;
    const who = `<div class="panel"><div class="k" style="margin-bottom:8px">Each trial at ${clock(t)}</div><table class="cmp"><thead><tr><th>Trial</th><th class="r">Position</th><th class="r">Δ</th><th class="r">PnL</th><th>Sent this turn</th></tr></thead><tbody>${per.map(({ r, q, d, here }) => `<tr><td><span class="swatch" style="background:${r.color}"></span>${esc(r.label)}</td><td class="r num">${fix(q.position, 3)}</td><td class="r num ${cls(d)}">${Math.abs(d) > 1e-9 ? (d > 0 ? "+" : "") + fix(d, 3) : ""}</td><td class="r num ${cls(q.pnl_usd)}">${susd(q.pnl_usd)}</td><td style="white-space:normal;font-size:12px">${here.length ? groupTxs(here).map((g) => `<div class="${g.ok ? "" : "neg"}">${g.ok ? "" : "✗ "}${esc(g.text)}${g.n > 1 ? ` <span class="muted">×${g.n}</span>` : ""}${g.dups ? ` <span style="color:var(--warn)" title="the same transaction again: the chain ran it once">${g.dups} duplicate${g.dups > 1 ? "s" : ""}, didn't run</span>` : ""}</div>`).join("") : `<span class="muted">${q.answered === false ? "overran its turn" : "nothing"}</span>`}</td></tr>`).join("")}</tbody></table></div>`;
    // Every event within the window, in time order.
    const events = [];
    for (const w of path) if (Math.abs(w.slot - t) <= WINDOW) events.push({ at: w.slot, who: "scenario", color: "var(--text-2)", text: `override: level ${w.level_pct > 0 ? "+" : ""}${fix(w.level_pct)}%` });
    if (making) (tl.taker_orders || []).forEach((o, j) => { if (Math.abs(o.at - t) <= WINDOW) events.push({ at: o.at, who: "taker", color: o.side === "buy" ? "var(--bid)" : "var(--ask)", text: `${o.side} ${fix(o.size, 3)} (limit $${fix(o.limit_usd)})${informed[j] ? " · informed" : ""}` }); });
    for (const r of vis) {
      for (const x of r.d.timeline.transactions || []) {
        const at = isNum(x.at) ? x.at : r.d.timeline.steps[x.step]?.at;
        if (isNum(at) && Math.abs(at - t) <= WINDOW) events.push({ at, who: r.label, color: r.color, text: `${x.duplicate ? "duplicate (didn't run): " : x.ok ? "" : "FAILED: "}${describeTx(x)}${!x.ok && !x.duplicate && x.error ? " — " + String(x.error).slice(0, 80) : ""}` });
      }
      const rs = r.d.timeline.steps;
      for (let k = 1; k < rs.length; k++) {
        const d = rs[k].position - rs[k - 1].position;
        if (Math.abs(d) > 1e-9 && Math.abs(rs[k].at - t) <= WINDOW) events.push({ at: rs[k].at, who: r.label, color: r.color, text: `position ${d > 0 ? "+" : ""}${fix(d, 3)} → ${fix(rs[k].position, 3)}` });
      }
      for (const c of r.d.timeline.calls?.refused || []) { const at = rs[c.step]?.at; if (isNum(at) && Math.abs(at - t) <= WINDOW) events.push({ at, who: r.label, color: "var(--critical)", text: `REFUSED ${c.method}` }); }
    }
    events.sort((a, b) => a.at - b.at);
    const log = `<div class="panel" style="grid-column:1/-1"><div class="k" style="margin-bottom:8px">Events from ${clock(Math.max(0, t - WINDOW))} to ${clock(t + WINDOW)} <span class="muted" style="text-transform:none;letter-spacing:0">(${events.length})</span></div><div class="evlog">${events.map((e) => `<div class="ev ${e.at > (prev?.at ?? -1) && e.at <= t ? "cur" : ""}"><span>${clock(e.at)} <span class="muted">+${e.at}</span></span><span class="who-l"><span class="swatch" style="background:${e.color}"></span>${esc(e.who)}</span><span>${esc(e.text)}</span></div>`).join("") || `<div class="muted">Nothing happened around here.</div>`}</div></div>`;
    now.innerHTML = world + who + log;
  }
  drawLegend();
  drawCharts();
  if (isNum(startAt)) { pinned = true; setCursor(startAt, false); } else setCursor(0, false);
}

// ---------- compare ----------
// Two releases (or batches), task by task: each model's mean skill on both,
// the change, and the skill over every release published.
async function renderCompare(a, b) {
  const releases = releaseOrder((await api("/api/releases")).releases);
  const label = (r) => r.label;
  const byLabel = new Map(releases.map((r) => [r.label, r]));
  const ra = byLabel.get(a), rb = byLabel.get(b);
  setCrumbs({ extra: `Compare ${a} with ${b}` });
  app.innerHTML = ""; delete app.dataset.task;
  const pickers = (side, current) => releases.map((r) => `<a class="${r.label === current ? "on" : ""}" href="#/compare/${encodeURIComponent(side === "a" ? r.label : a)}...${encodeURIComponent(side === "b" ? r.label : b)}">${esc(r.label)}</a>`).join("");
  div(`<h1>${esc(a)} <small>vs</small> ${esc(b)}</h1>
    <div class="cmp-pick"><span class="k">From</span><div class="seg">${pickers("b", b)}</div><span class="k">to</span><div class="seg">${pickers("a", a)}</div>
    <a class="btn" href="#/compare/${encodeURIComponent(b)}...${encodeURIComponent(a)}">swap</a></div>
    <div class="sub">Skill is a model's PnL over the reference's on the same hidden scenarios, so it compares across releases whose hidden sets differ. A task's version can change between releases too: it's shown under each.</div>`);
  if (!ra || !rb) { div(`No release named ${esc(!ra ? a : b)}. Known: ${releases.map(label).map(esc).join(", ")}`, "error"); return; }
  // Oldest first, for the lines over releases.
  const ordered = [...releases].filter((r) => r.published || r === ra || r === rb).reverse();
  const models = [...new Set(releases.flatMap((r) => Object.values(r.tasks).flatMap((t) => Object.keys(t.models))))].sort();
  const color = (m) => PALETTE[models.indexOf(m) % PALETTE.length];
  const tasks = [...new Set([...Object.keys(ra.tasks), ...Object.keys(rb.tasks)])].sort();
  for (const task of tasks) {
    const ta = ra.tasks[task], tb = rb.tasks[task];
    const ms = [...new Set([...Object.keys(ta?.models || {}), ...Object.keys(tb?.models || {})])].sort();
    const host = div(`<div class="cmp-head"><h2>${esc(task)}</h2><span class="muted">task ${esc(tb?.version ?? "–")} → ${esc(ta?.version ?? "–")}</span></div>`, "cmp-card");
    const grid = div("", "cmp-grid", host);
    const rows = ms.map((m) => {
      const sa = ta?.models[m]?.skill, sb = tb?.models[m]?.skill;
      const d = isNum(sa) && isNum(sb) ? sa - sb : null;
      return `<tr><td><span class="sw" style="background:${color(m)}"></span>${esc(shortModel(m))}</td>
        <td class="num">${times(sb)}</td><td class="num">${times(sa)}</td>
        <td><span class="delta ${isNum(d) ? (d >= 0 ? "up" : "down") : ""}">${isNum(d) ? (d >= 0 ? "+" : "−") + fix(Math.abs(d)) + "×" : isNum(sa) ? "new" : "–"}</span></td></tr>`;
    }).join("");
    div(`<table class="cmp-table"><thead><tr><th>Model</th><th class="num">${esc(b)}</th><th class="num">${esc(a)}</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table>`, "", grid);
    const chartHost = div("", "cmp-chart", grid);
    const cols = ordered.filter((r) => r.tasks[task]);
    skillLines(chartHost, {
      labels: cols.map(label), marked: [a, b],
      series: ms.map((m) => ({ model: m, color: color(m), ys: cols.map((r) => r.tasks[task].models[m]?.skill ?? null) })),
    });
  }
}
// Each model's skill over releases: lines in the header's style, with the
// two compared releases marked and the reference at 1×.
function skillLines(host, { labels, marked, series }) {
  host.innerHTML = "";
  const W = Math.max(300, host.clientWidth), H = 220, L = 10, R = 58, T = 14, B = 26;
  const vals = [1, 0, ...series.flatMap((s) => s.ys)].filter(isNum);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || 0.5; lo -= pad; hi += pad;
  const n = labels.length;
  const sx = (i) => n > 1 ? L + 16 + i / (n - 1) * (W - L - R - 32) : (L + W - R) / 2;
  const sy = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, class: "lines" }, host);
  for (const v of ticks(lo, hi, 4)) {
    if (v < lo || v > hi) continue;
    el("line", { x1: L, x2: W - R, y1: sy(v), y2: sy(v), stroke: "#2c2c2e" }, svg);
    el("text", { x: W - R + 10, y: sy(v) + 4, class: "ylab" }, svg).textContent = fix(v, 1) + "×";
  }
  el("line", { x1: L, x2: W - R, y1: sy(1), y2: sy(1), stroke: "#8e8e93", "stroke-dasharray": "4 4", opacity: 0.8 }, svg);
  el("text", { x: L + 2, y: sy(1) - 6, class: "ylab" }, svg).textContent = "reference";
  labels.forEach((l, i) => {
    const on = marked.includes(l);
    if (on) el("rect", { x: sx(i) - 18, y: T, width: 36, height: H - T - B, rx: 6, fill: "rgba(255,255,255,.05)" }, svg);
    el("text", { x: sx(i), y: H - 7, class: "xlab", "text-anchor": "middle", fill: on ? "#fafafa" : undefined }, svg).textContent = l;
  });
  for (const s of series) {
    let d = "", pen = false;
    s.ys.forEach((v, i) => { if (!isNum(v)) { pen = false; return; } d += `${pen ? "L" : "M"}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`; pen = true; });
    if (d) el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    s.ys.forEach((v, i) => {
      if (!isNum(v)) return;
      const c = el("circle", { cx: sx(i), cy: sy(v), r: marked.includes(labels[i]) ? 4.5 : 3, fill: s.color, stroke: "#000", "stroke-width": 1.5 }, svg);
      c.addEventListener("mousemove", (ev) => showTip(`<b>${esc(shortModel(s.model))}</b> · ${esc(labels[i])}<br>skill ${times(v)}`, ev));
      c.addEventListener("mouseleave", hideTip);
    });
  }
}

// ---------- run stats (after Harbor's viewer, and what it leaves out) ----------
// A run's time by phase: environment setup, agent setup, the agent, grading.
function phaseBar(timings, t) {
  const phases = [
    ["Env setup", timings?.environment_setup, "#636366"],
    ["Agent setup", timings?.agent_setup, "#8e8e93"],
    ["Agent", timings?.agent_execution || t.agent_execution, "var(--ref)"],
    ["Grading", timings?.verifier || t.verifier_execution, "#bf5af2"],
  ].map(([k, p, c]) => ({ k, c, ms: span(p) })).filter((p) => isNum(p.ms) && p.ms > 0);
  if (!phases.length) return "";
  const total = sum(phases.map((p) => p.ms));
  const wall = span(t);
  return `<div class="sbar"><div class="sbar-head"><span class="k">Time</span><span class="muted num">${dur(wall ?? total)} end to end</span></div>
    <div class="sbar-track">${phases.map((p) => `<i style="flex:${Math.max(p.ms / total, 0.015)};background:${p.c}" title="${p.k}: ${dur(p.ms)}"></i>`).join("")}</div>
    <div class="sbar-legend">${phases.map((p) => `<span><i style="background:${p.c}"></i>${p.k} <b class="num">${dur(p.ms)}</b> <span class="muted">${pct(p.ms / total, 0)}</span></span>`).join("")}</div></div>`;
}
// A run's tokens: cache reads, cache writes, fresh input and output. The
// cache is most of an agent's bill; a run that misses it costs several times
// more for the same work.
function tokenBar(t, fm) {
  const input = fm?.total_prompt_tokens ?? t.tokens?.input, read = fm?.total_cached_tokens ?? t.tokens?.cache;
  const write = fm?.extra?.total_cache_creation_input_tokens;
  const out = fm?.total_completion_tokens ?? t.tokens?.output;
  if (!isNum(input)) return "";
  const fresh = Math.max(0, input - (read || 0) - (write || 0));
  const parts = [["Cache read", read, "#48484a"], ["Cache write", write, "#ff9f0a"], ["Fresh input", fresh, "#0a84ff"], ["Output", out, "#5ed16a"]].filter(([, v]) => isNum(v) && v > 0);
  const total = sum(parts.map((p) => p[1]));
  return `<div class="sbar"><div class="sbar-head"><span class="k">Tokens</span><span class="muted num">${compact(total)} · ${pct(isNum(read) ? read / input : null, 0)} of input from cache · ${usd(t.cost_usd ?? fm?.total_cost_usd)}</span></div>
    <div class="sbar-track">${parts.map(([k, v, c]) => `<i style="flex:${Math.max(v / total, 0.012)};background:${c}" title="${k}: ${int(v)}"></i>`).join("")}</div>
    <div class="sbar-legend">${parts.map(([k, v, c]) => `<span><i style="background:${c}"></i>${k} <b class="num">${compact(v)}</b></span>`).join("")}</div></div>`;
}
// What a tool call was, for grouping: the command for Bash (with cargo's
// subcommand), the tool's name otherwise.
function callKind(c) {
  if (c.name !== "Bash") return c.name;
  const cmd = String(c.input || "").replace(/^\s*(cd [^&;]+(&&|;)\s*)+/, "").trim();
  const words = cmd.split(/\s+/).filter((w) => !/^[A-Z_]+=/.test(w));
  const head = (words[0] || "").split("/").pop();
  if (["cargo", "just", "git", "npm", "pnpm", "python3", "python"].includes(head) && words[1] && !words[1].startsWith("-")) return `${head} ${words[1]}`;
  return head || "bash";
}
// Where the agent's time went, how its context grew, and what it spent.
function agentInsights(host, steps, fm) {
  const ts = steps.map((s) => Date.parse(s.timestamp));
  if (steps.length < 2 || !ts.every(isNum)) return;
  const t0 = ts[0];
  // A step's time runs to the next step: split among its tool calls.
  const kinds = new Map();
  steps.forEach((s, i) => {
    const ms = i + 1 < steps.length ? ts[i + 1] - ts[i] : 0;
    const calls = s.tools.length ? s.tools : [{ name: s.source === "agent" ? "thinking / writing" : s.source, input: "" }];
    for (const c of calls) {
      const k = c.name === "thinking / writing" ? c.name : callKind(c);
      const e = kinds.get(k) || { k, n: 0, ms: 0 };
      e.n += s.tools.length ? 1 : 0; e.ms += ms / calls.length;
      kinds.set(k, e);
    }
  });
  const rows = [...kinds.values()].sort((a, b) => b.ms - a.ms);
  const total = sum(rows.map((r) => r.ms)) || 1;
  const top = rows.slice(0, 9);
  const rest = rows.slice(9);
  if (rest.length) top.push({ k: `${rest.length} others`, n: sum(rest.map((r) => r.n)), ms: sum(rest.map((r) => r.ms)) });
  // Context: each step's prompt; cost: running total.
  const ctx = steps.map((s) => s.metrics?.prompt_tokens).filter(isNum);
  let acc = 0; const cost = steps.map((s) => (acc += s.metrics?.cost_usd || 0));
  const mins = ts.map((x) => (x - t0) / 60000);
  const stops = {}; for (const s of steps) if (s.stop_reason) stops[s.stop_reason] = (stops[s.stop_reason] || 0) + 1;
  const sub = steps.filter((s) => s.sidechain).length, copied = steps.filter((s) => s.copied).length, reasoned = steps.filter((s) => s.reasoning).length;
  const models = [...new Set(steps.map((s) => s.model).filter(Boolean))];
  const box = document.createElement("div");
  box.className = "insights";
  box.innerHTML = `<div class="ins-card"><div class="k">Where the agent's time went</div>
      ${top.map((r) => `<div class="tw"><span class="tw-k mono" title="${esc(r.k)}">${esc(r.k)}</span><span class="tw-bar"><i style="width:${(r.ms / total * 100).toFixed(1)}%"></i></span><span class="num">${dur(r.ms)}</span><span class="num muted">${r.n ? `${r.n}×` : ""}</span></div>`).join("")}
    </div>
    <div class="ins-card"><div class="k">Context per step <span class="muted">peak ${compact(Math.max(0, ...ctx))} tokens</span></div>${miniArea(mins.slice(0, ctx.length), ctx, "#0a84ff", (v) => compact(v))}
      <div class="k" style="margin-top:12px">Cost so far <span class="muted">${usd(acc)}</span></div>${miniArea(mins, cost, "#5ed16a", (v) => usd(v, 0))}</div>
    <div class="ins-card"><div class="k">The run</div>
      <dl class="facts">
        <dt>Agent</dt><dd>${esc(models.join(", ") || "–")}</dd>
        <dt>Steps</dt><dd>${int(steps.length)} · ${int(reasoned)} with reasoning</dd>
        <dt>Turn ends</dt><dd>${Object.entries(stops).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)} ${v}`).join(" · ") || "–"}</dd>
        <dt>Subagents</dt><dd>${sub ? `${int(sub)} steps` : "none"}</dd>
        <dt>Compaction</dt><dd>${copied ? `${int(copied)} steps copied after a summary` : "none"}</dd>
        <dt>Cache writes</dt><dd>${compact(fm?.extra?.total_cache_creation_input_tokens)} tokens</dd>
        <dt>Service tier</dt><dd>${esc((fm?.extra?.service_tiers || []).join(", ") || "–")}</dd>
      </dl></div>`;
  host.appendChild(box);
}
// A small area chart over the agent's minutes.
function miniArea(xs, ys, color, fmt) {
  if (ys.length < 2) return `<div class="muted">–</div>`;
  const W = 320, H = 70, P = 2;
  const x0 = xs[0], x1 = xs[xs.length - 1] || 1, hi = Math.max(...ys) || 1;
  const sx = (x) => P + (x - x0) / (x1 - x0 || 1) * (W - 2 * P), sy = (y) => H - P - y / hi * (H - 2 * P - 10);
  const d = ys.map((y, i) => `${i ? "L" : "M"}${sx(xs[i]).toFixed(1)},${sy(y).toFixed(1)}`).join("");
  const id = "m" + Math.random().toString(36).slice(2, 7);
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${sx(xs[ys.length - 1])},${H}L${sx(xs[0])},${H}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="mini-axis"><span>0m</span><span>${fmt(hi)} peak</span><span>${Math.round(x1)}m</span></div>`;
}

// ---------- syntax ----------
// A small highlighter for the bots' files: Rust, TOML and shell. Rules are
// tried in order at each position over the whole file, so block comments and
// multi-line strings work; the tokens are then split into lines.
const RUST_KW = "as async await break const continue crate dyn else enum extern fn for if impl in let loop match mod move mut pub ref return static struct super trait type unsafe use where while";
const SH_KW = "if then else elif fi for while until do done case esac in function select return exit break continue set export local readonly shift trap source";
const kw = (words) => new RegExp(`\\b(?:${words.split(" ").join("|")})\\b`, "y");
const SYNTAX = {
  rust: [
    ["com", /\/\/[^\n]*|\/\*[\s\S]*?\*\//y],
    ["str", /b?r(#*)"[\s\S]*?"\1|b?"(?:\\[\s\S]|[^"\\])*"/y],
    ["str", /b?'(?:\\(?:x[0-9a-fA-F]{2}|u\{[0-9a-fA-F]+\}|.)|[^\\'\n])'/y],
    ["life", /'[a-zA-Z_]\w*\b/y],
    ["attr", /#!?\[[^\]\n]*\]/y],
    ["mac", /\b[a-zA-Z_]\w*!(?=\s*[([{])/y],
    ["num", /\b(?:0x[\da-fA-F_]+|0b[01_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?)(?:_?(?:[iu](?:8|16|32|64|128|size)|f32|f64))?\b/y],
    ["con", /\b(?:true|false|self|Self|None|Some|Ok|Err)\b/y],
    ["kw", kw(RUST_KW)],
    ["type", /\b[A-Z][A-Za-z0-9_]*\b/y],
    ["fn", /\b[a-z_]\w*(?=\s*(?:::<[^>]*>)?\()/y],
  ],
  toml: [
    ["com", /#[^\n]*/y],
    ["table", /(?<=^|\n)[ \t]*\[\[?[^\]\n]+\]\]?/y],
    ["key", /(?<=^|\n|[{,][ \t]*)[ \t]*(?:"[^"\n]*"|[\w.-]+)(?=[ \t]*=)/y],
    ["str", /"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'[^'\n]*'/y],
    ["num", /\b\d{4}-\d{2}-\d{2}(?:[T ][\d:.]+(?:Z|[+-]\d{2}:\d{2})?)?\b|\b(?:0x[\da-fA-F_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?)\b/y],
    ["con", /\b(?:true|false|inf|nan)\b/y],
  ],
  sh: [
    ["com", /^#![^\n]*|(?<![\w$#{])#[^\n]*/y],
    ["str", /'[^']*'|"(?:\\[\s\S]|[^"\\])*"/y],
    ["var", /\$\{[^}\n]*\}|\$[A-Za-z_]\w*|\$[@#?*!$0-9-]/y],
    ["kw", kw(SH_KW)],
    ["flag", /(?<=[ \t])--?[A-Za-z][\w-]*/y],
    ["cmd", /(?<=(?:^|\n|[|;&(]|\bthen|\bdo|\belse)[ \t]*)[A-Za-z_./][\w./-]*/y],
    ["num", /\b\d+\b/y],
  ],
};
function languageOf(path) {
  const name = path.split("/").pop();
  if (/\.rs$/.test(name)) return "rust";
  if (/\.toml$/.test(name) || name === "Cargo.lock") return "toml";
  if (/\.(sh|bash)$/.test(name)) return "sh";
  return null;
}
// Lines of HTML, each balanced, for a file's text.
function highlight(text, lang) {
  const rules = SYNTAX[lang];
  const out = [""];
  const put = (cls, chunk) => chunk.split("\n").forEach((part, k) => {
    if (k) out.push("");
    if (part) out[out.length - 1] += cls ? `<span class="hl-${cls}">${esc(part)}</span>` : esc(part);
  });
  if (!rules) { put(null, text); return out; }
  const word = /[A-Za-z0-9_]+|[\s\S]/y;
  let i = 0, plain = "";
  while (i < text.length) {
    let hit = null;
    for (const [cls, re] of rules) {
      re.lastIndex = i;
      const m = re.exec(text);
      if (m && m[0].length) { hit = [cls, m[0]]; break; }
    }
    if (hit) { if (plain) { put(null, plain); plain = ""; } put(hit[0], hit[1]); i += hit[1].length; continue; }
    // Skip a whole word at once, so a rule never starts inside one.
    word.lastIndex = i;
    const m = word.exec(text)[0];
    plain += m; i += m.length;
  }
  if (plain) put(null, plain);
  return out;
}

// ---------- a run's scenarios ----------
// The run's numbers in one line under its title.
function runStats(t, trial) {
  const item = (k, v, d) => `<div class="rs"><div class="rs-k">${esc(k)}</div><div class="rs-v">${v}</div>${d ? `<div class="rs-d">${d}</div>` : ""}</div>`;
  const agentMs = span(t.agent_execution), verifierMs = span(t.verifier_execution);
  return `<div class="runstats">
    ${item("Skill", `<span class="${isNum(t.skill) ? (Math.round(t.skill * 100) >= 100 ? "pos" : "neg") : ""}">${times(t.skill)}</span>`, "vs reference")}
    ${item("Reward", fix(t.reward, 4), "vs hindsight bound")}
    ${item("PnL", `<span class="${cls(t.pnl_usd)}">${susd(t.pnl_usd)}</span>`, `reference ${susd(t.reference_pnl_usd)}`)}
    ${item("Scenarios", int(t.sessions), t.disqualified ? `<span class="neg">${t.disqualified} disqualifying</span>` : "none disqualifying")}
    ${item("Worst", susd(t.risk?.worst_pnl_usd), `tail ${susd(t.risk?.tail_pnl_usd)}`)}
    ${item("Max drawdown", usd(t.risk?.max_drawdown_usd), `${pct(t.risk?.profitable_share, 0)} profitable · Sharpe ${fix(t.risk?.sharpe)}`)}
    ${item("Agent", dur(agentMs), `${compact(t.tokens?.output)} output tokens`)}
    ${item("Cost", usd(t.cost_usd), `${compact(t.tokens?.input)} in · ${compact(t.tokens?.cache)} cached`)}
    ${item("Grading", dur(verifierMs), t.eval_seed_sha256 ? `set ${esc(String(t.eval_seed_sha256).slice(0, 8))}…` : "")}
  </div>`;
}
// The scenarios tab: every scenario as a small chart of the run's PnL
// through it, green or red by where it ended, on one scale; the picked one's
// timeline beside them.
async function trialScenarios(n, trial, picked) {
  const t = trial.summary;
  if (!t.details) return trialSessions(n, trial);
  const host = div(`<div class="loading">Loading the scenarios…</div>`, "scn");
  const { sessions } = await api(`/api/curves/${n}`);
  if (!sessions.length) { host.innerHTML = ""; return trialSessions(n, trial); }
  const pick = sessions.some((s) => s.name === picked) ? picked : sessions[0].name;
  host.innerHTML = `<div class="scn-list"></div><div class="scn-view"></div>`;
  const list = host.querySelector(".scn-list"), view = host.querySelector(".scn-view");
  list.innerHTML = sessions.map((s, i) => {
    const d = isNum(s.reference_pnl_usd) ? s.pnl_usd - s.reference_pnl_usd : null;
    return `<a class="scn-item" href="${link({ task: t.task, run: n, session: s.name })}" data-s="${esc(s.name)}">
      <div class="scn-top"><span class="scn-name">${esc(s.name)}</span>${s.disqualified ? `<span class="badge bad">DQ</span>` : ""}<span class="scn-pnl ${cls(s.pnl_usd)}">${susd(s.pnl_usd, 0)}</span></div>
      ${scenarioSpark(s)}
      <div class="scn-sub"><span title="${esc(s.description || "")}">${esc(describeAnnotation(s.annotation) || s.description || "")}</span><span class="${isNum(d) ? (Math.abs(d) < 0.5 ? "" : d > 0 ? "pos" : "neg") : ""}">${isNum(d) ? (Math.abs(d) < 0.5 ? "= ref" : `${susd(d, 0)} vs ref`) : ""}</span></div>
    </a>`;
  }).join("");
  // Picking another scenario redraws only the view, and keeps the list put.
  const select = async (name) => {
    list.querySelectorAll(".scn-item").forEach((a) => a.classList.toggle("on", a.dataset.s === name));
    const page = app; app = view;
    try { view.innerHTML = ""; await renderSession(n, name); } catch (e) { fail(e); } finally { app = page; }
  };
  document.getElementById("peek-body")._select = async (name) => {
    const bar = document.getElementById("peek-title");
    bar.querySelectorAll(".pt-sep, .pt-scn").forEach((e) => e.remove());
    bar.insertAdjacentHTML("beforeend", `<span class="pt-sep">›</span><span class="pt-scn">${esc(name)}</span>`);
    await select(name);
  };
  await select(pick);
  // Bring the picked card into the list's view, without scrolling the panel.
  const on = list.querySelector(".scn-item.on");
  if (on && (on.offsetTop < list.scrollTop || on.offsetTop + on.offsetHeight > list.scrollTop + list.clientHeight)) list.scrollTop = on.offsetTop - 40;
}
// A scenario's miniature: its market, the mark over the session, as the
// price chart draws it; green when the run made money on it, red when it
// lost, gray when it didn't trade.
function scenarioSpark(s) {
  const W = 288, H = 46;
  const pts = s.bot.filter((p) => isNum(p[2]));
  if (pts.length < 2) return `<div class="scn-spark empty"></div>`;
  const marks = pts.map((p) => p[2]);
  const lo = Math.min(...marks), hi = Math.max(...marks);
  const x1 = pts.at(-1)[0] || 1;
  const sx = (x) => (x / x1) * W, sy = (y) => 4 + (hi - y) / ((hi - lo) || 1) * (H - 8);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${sx(p[0]).toFixed(1)},${sy(p[2]).toFixed(1)}`).join("");
  const pnl = s.pnl_usd;
  const color = !isNum(pnl) || Math.abs(pnl) < 0.5 ? "#8e8e93" : pnl > 0 ? "var(--up)" : "var(--down)";
  const id = "s" + Math.random().toString(36).slice(2, 7);
  return `<svg class="scn-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${sx(pts.at(-1)[0]).toFixed(1)},${H}L${sx(pts[0][0]).toFixed(1)},${H}Z" fill="url(#${id})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

// ---------- trial ----------
// The run's header, in the panel's top section with its title: the run's
// numbers, then the tabs.
function trialHeader(n, t, tab, trial) {
  app.innerHTML = ""; delete app.dataset.task;
  const tabs = [["sessions", "Scenarios"], ["agent", "Agent"], ["bot", "Bot"], ["logs", "Logs"], ["raw", "Report"]];
  document.getElementById("peek-head").innerHTML = runStats(t, trial) +
    `<div class="tabs">${tabs.map(([k, label]) => `<a href="${link({ task: t.task, run: n, tab: k })}" class="${tab === k ? "on" : ""}">${label}</a>`).join("")}</div>`;
  if (t.exception) div(`<div class="error"><b>${esc(t.exception.type)}</b>: ${esc(t.exception.message)}</div>`);
}

async function renderTrial(n, tab, session) {
  const trial = await api(`/api/trial/${n}`);
  const t = trial.summary;
  trialHeader(n, t, tab, trial);
  if (tab === "sessions") return trialScenarios(n, trial, session);
  if (tab === "agent") div(phaseBar(trial.timings, t) + tokenBar(t, null), "sbars");
  if (tab === "agent") return trialAgent(n, trial);
  if (tab === "bot") return trialFiles(n, trial, trial.files.map((f) => f.path), "artifacts/app/bot/");
  if (tab === "logs") return trialLogs(n, trial);
  if (tab === "raw") {
    div(`<details open><summary>verifier/report.json (scenarios folded)</summary><pre class="code wrap">${esc(JSON.stringify(trial.report ? { ...trial.report, scenarios: `${(trial.report.scenarios || []).length} scenarios: see the Scenarios tab` } : null, null, 2))}</pre></details>
      <details><summary>verifier/reward.json</summary><pre class="code">${esc(JSON.stringify(trial.rewards, null, 2))}</pre></details>
      <details><summary>Harbor config</summary><pre class="code">${esc(JSON.stringify(trial.config, null, 2))}</pre></details>
      <details><summary>Timings</summary><pre class="code">${esc(JSON.stringify(trial.timings, null, 2))}</pre></details>
      ${trial.exception ? `<details><summary>Exception</summary><pre class="code wrap">${esc(trial.exception.exception_traceback || JSON.stringify(trial.exception, null, 2))}</pre></details>` : ""}`);
  }
}

function describeAnnotation(a) {
  if (!a) return "";
  if (a.shape) {
    const s = a.shape;
    const parts = [s.direction, s.aftermath].filter(Boolean);
    if (Array.isArray(s.legs)) parts.push(`${s.legs.length} leg${s.legs.length === 1 ? "" : "s"}`);
    return parts.join(" · ") || JSON.stringify(s).slice(0, 60);
  }
  if (Array.isArray(a.informed)) { const k = a.informed.filter(Boolean).length; return k ? `${k} informed orders` : "no informed flow"; }
  return "";
}

function trialSessions(n, trial) {
  const scenarios = trial.report?.scenarios || [];
  if (!scenarios.length) { div(`<div class="empty">No scenarios in this run's report.</div>`); return; }
  const stats = trial.session_stats || {};
  const rows = scenarios.map((s, i) => ({ i, ...s, stat: stats[s.scenario] || {}, delta: isNum(s.reference_pnl_usd) ? s.pnl_usd - s.reference_pnl_usd : null }));
  const host = div();
  const xs = [-0.6, rows.length - 0.4];
  const every = Math.max(1, Math.ceil(rows.length / 24));
  const xticks = rows.map((r) => r.i).filter((i) => i % every === 0);
  const group = new Group(); group.label = (x) => rows[Math.round(x)]?.scenario ?? "";
  const open = (x) => { const r = rows[Math.round(x)]; if (r && trial.sessions.bot.includes(r.scenario)) location.hash = link({ task: trial.summary.task, run: n, session: r.scenario }); };
  const bars = chart(host, {
    title: "PnL by scenario", height: 220, x: xs, xticks, zero: true, snap: Math.round, yfmt: (v) => usd(v, 0), xfmt: (i) => String(Math.round(i) + 1),
    series: [
      { label: "bot", type: "bars", color: "var(--accent)", width: 0.42, offset: -0.5, data: rows.map((r) => [r.i, r.pnl_usd]), colorOf: (p) => rows[p[0]].disqualified ? "var(--ask)" : "var(--accent)", fmt: susd },
      { label: "reference", type: "bars", color: "var(--ref)", width: 0.42, offset: 0.5, data: rows.map((r) => [r.i, r.reference_pnl_usd]), opacity: 0.75, fmt: susd },
    ],
    onClick: open,
  });
  let cb = 0, cr = 0;
  const cum = chart(host, {
    title: "Cumulative PnL", height: 180, x: xs, xticks, zero: true, snap: Math.round, yfmt: (v) => usd(v, 0), xfmt: (i) => String(Math.round(i) + 1),
    series: [
      { label: "bot", color: "var(--accent)", width: 2, data: rows.map((r) => [r.i, (cb += r.pnl_usd)]), fmt: susd },
      { label: "reference", color: "var(--ref)", width: 2, data: rows.map((r) => [r.i, (cr += r.reference_pnl_usd ?? 0)]), fmt: susd },
    ],
    onClick: open,
  });
  group.add(bars); group.add(cum);
  if (!trial.sessions.bot.length) div(`<div class="sub" style="margin:6px 0 0">This run has no step-by-step scenario files (it was graded before the verifier recorded them), so there's no timeline per scenario.</div>`);
  section("Scenarios", "click one for its timeline");
  const t = div();
  table(t, rows, [
    { key: "i", label: "#", r: true, fmt: (r) => r.i + 1 },
    { key: "scenario", label: "Scenario", mono: true, fmt: (r) => `${esc(r.scenario)}${r.disqualified ? ` <span class="badge bad" title="${esc(r.disqualified)}">disqualified</span>` : ""}` },
