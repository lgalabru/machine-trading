<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mth · scenario</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --panel: #09090b;
    --line: #27272a;
    --line-soft: #18181b;
    --track: #2f2f32;
    --text: #fafafa;
    --text-2: #a1a1aa;
    --text-3: #71717a;
    --text-4: #52525b;
    --accent: #a2ef5b;
    --accent-soft: rgba(162, 239, 91, 0.14);
    --accent-glow: rgba(162, 239, 91, 0.35);
    --critical: #ef4444;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-feature-settings: "cv11"; -webkit-font-smoothing: antialiased; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .page { max-width: 1265px; min-height: 100vh; margin: 0 auto; border-inline: 1px solid var(--line); display: flex; flex-direction: column; }
  .rule { border-bottom: 1px solid var(--line); }

  /* Banner: the timeline. */
  .banner {
    position: relative; height: 360px;
    background:
      radial-gradient(ellipse 70% 90% at 78% -10%, rgba(162, 239, 91, 0.11), transparent 62%),
      radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.055) 1px, transparent 0) 0 0 / 22px 22px,
      var(--bg);
  }
  .topbar { position: absolute; inset: 24px 32px auto 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .mark { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
  .brand .sub { color: var(--text-3); font-weight: 500; }

  .pill { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: 999px; background: #0e0e10; border: 1px solid rgba(63, 63, 70, 0.45); }
  .bars { display: flex; gap: 2px; }
  .bars i { width: 4px; height: 14px; border-radius: 2px; background: var(--track); transition: background 0.2s; }
  .bars i.on { background: var(--accent); }
  .pill.paused .bars i.on { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { background: var(--track); } }
  .pill .k { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
  .pill .v { font-size: 12px; font-weight: 600; color: var(--text); }
  .pill .sep { width: 1px; height: 12px; background: rgba(63, 63, 70, 0.6); }
  .ring { width: 16px; height: 16px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 2; }

  .timeline { position: absolute; left: 32px; right: 32px; bottom: 64px; z-index: 1; }
  .readout { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 10px; }
  .clock { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; color: var(--accent); line-height: 1; }
  .clock small { font-size: 15px; color: var(--text-3); font-weight: 500; margin-left: 6px; }
  .state-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
  .upnext { text-align: right; min-width: 0; }
  .upnext .k { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
  .upnext .label { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }
  .upnext .eta { color: var(--text-3); }
  #strip { display: block; width: 100%; height: 150px; overflow: visible; }
  .pulse { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
  .tick { fill: var(--text-4); font: 11px var(--mono); }

  /* Controls: the primary button matches the 402 faucet's send button. */
  .left { display: flex; align-items: flex-end; gap: 20px; }
  /* On the line between the header and the body, at the far right. */
  .controls { position: absolute; right: 32px; bottom: 0; transform: translateY(50%); z-index: 3; display: flex; align-items: center; gap: 10px; }
  .play {
    position: relative; width: 64px; height: 64px; padding: 0; border-radius: 999px; cursor: pointer;
    display: grid; place-items: center; color: #050a02; border: 0;
    background: linear-gradient(180deg, #c2f78f 0%, #a2ef5b 52%, #8ddd45 100%);
    /* A ring of page black cuts the divider around the button. */
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.55),
      inset 0 -3px 8px rgba(40, 80, 0, 0.25),
      0 0 0 6px var(--bg),
      0 0 0 7px rgba(162, 239, 91, 0.18);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, filter 0.2s ease;
  }
  .play:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.6),
      inset 0 -3px 8px rgba(40, 80, 0, 0.25),
      0 0 0 6px var(--bg),
      0 0 0 7px rgba(162, 239, 91, 0.35),
      0 0 32px rgba(162, 239, 91, 0.35);
  }
  .play:active:not(:disabled) { transform: scale(0.96); }
  .play:disabled { cursor: not-allowed; background: #3f3f46; color: #e4e4e7; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 0 6px var(--bg), 0 0 0 7px var(--line); }
  .play:focus-visible, .ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 9px; }
  .play svg { width: 26px; height: 26px; display: block; animation: pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
  .ctl {
    width: 40px; height: 40px; border-radius: 999px; cursor: pointer; display: grid; place-items: center;
    background: var(--bg); border: 1px solid #3f3f46; color: #d4d4d8; transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .ctl svg { width: 18px; height: 18px; }
  .ctl:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .ctl.danger:hover:not(:disabled) { border-color: var(--critical); color: var(--critical); }
  .ctl:disabled { cursor: not-allowed; opacity: 0.4; }
  .ctl.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }

  /* Profile. */
  .profile { padding: 28px 32px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; }
  .handle { margin-top: 2px; color: var(--text-3); }
  .description { margin: 12px 0 0; max-width: 78ch; color: var(--text-2); line-height: 1.5; }
  .stats { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .stat { padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 132px; }
  .stat .k { font-size: 11px; color: var(--text-3); }
  .stat .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .stat .v small { font-size: 12px; color: var(--text-3); font-weight: 500; margin-left: 4px; }

  /* Body: one chart per venue and dimension, stacked, one rule between. */
  .charts > .chart-card { padding: 28px 32px 30px; min-width: 0; }
  .charts > .chart-card + .chart-card { border-top: 1px solid var(--line); }
  .charts h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text); }
  .charts h2 .venue { color: var(--text-3); font-weight: 500; margin-right: 8px; }
  .charts .scale { margin-left: 8px; color: var(--text-4); font-weight: 500; font-size: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .legend { display: flex; gap: 6px 18px; font-size: 12px; color: var(--text-2); flex-wrap: wrap; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend b { font: 600 12px var(--mono); color: var(--text); }
  .legend small { font: 11px var(--mono); color: var(--text-3); }
  .sw-line { width: 16px; border-top: 2px solid var(--accent); }
  .sw-band { width: 16px; height: 10px; border-radius: 2px; background: var(--accent-soft); }
  .sw-dash { width: 16px; border-top: 2px dashed var(--text-3); }
  .sw-rule { height: 12px; border-left: 1px solid var(--line); }
  .sw-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--text-3); }
  .chart-wrap { position: relative; }
  svg.chart { display: block; width: 100%; height: 360px; }
  .chart-card.lane svg.chart { height: 92px; }
  .chart-card.lane .note { margin-top: 8px; color: var(--text-4); font-size: 12px; }
  .grid line { stroke: var(--line-soft); }
  .axis text { fill: var(--text-3); font: 11px var(--mono); }
  .tooltip {
    position: absolute; pointer-events: none; display: none; min-width: 200px; z-index: 5;
    background: #0e0e10; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-size: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  }
  .tooltip .head { color: var(--text); font-weight: 600; margin-bottom: 6px; }
  .tooltip .row { display: flex; justify-content: space-between; gap: 16px; color: var(--text-3); }
  .tooltip .row b { color: var(--text); font: 600 12px var(--mono); }
  .tooltip .row i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .tooltip .event { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--text-2); }
  .tooltip .event + .event { border-top: 0; margin-top: 2px; padding-top: 0; }
  .error { color: var(--critical); font-size: 12px; min-height: 1em; padding: 0 32px 12px; }
  .stat .sym { display: inline-flex; align-items: center; gap: 6px; }
  .stat .sym i { width: 8px; height: 8px; border-radius: 50%; }
  .stat .sub { margin-top: 2px; font: 11px var(--mono); color: var(--text-3); }

  footer { display: flex; justify-content: space-between; gap: 16px; padding: 18px 32px; border-top: 1px solid var(--line); color: var(--text-4); font-size: 12px; }
  footer code { font-family: var(--mono); color: var(--text-3); }
  .foot-right { display: inline-flex; align-items: center; gap: 14px; }

  /* Workbench: a bottom panel, like a browser's web inspector. */
  body.wb-open .page { margin-bottom: var(--wb-h, 300px); }
  .wb-toggle { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text-2); font: 12px Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  .wb-toggle:hover { border-color: #3f3f46; color: var(--text); }
  .wb-toggle kbd { font: 600 13px/14px var(--mono); color: var(--text-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .wb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); }
  .wb-dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
  .wb-dot.wait { background: #eab308; }
  .wb-dot.down { background: var(--critical); }
  .workbench {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--wb-h, 300px); z-index: 20;
    display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line);
    box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5); font-size: 12px;
  }
  .workbench[hidden] { display: none; }
  .wb-resize { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: ns-resize; z-index: 1; }
  .wb-resize:hover, .wb-resize.drag { background: linear-gradient(transparent 3px, var(--accent) 3px, var(--accent) 4px, transparent 4px); }
  .wb-bar { display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--line); flex: none; }
  .wb-tabs { display: flex; height: 100%; }
  .wb-tabs button { height: 100%; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--text-2); font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  .wb-tabs button:hover { color: var(--text); }
  .wb-tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .wb-tabs .num { margin-left: 4px; color: var(--text-3); }
  .wb-conn { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-family: var(--mono); font-size: 11px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .wb-actions input { width: 180px; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 12px var(--mono); outline: none; }
  .wb-actions input:focus { border-color: #3f3f46; }
  .wb-btn { height: 24px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text-2); font: 12px Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  .wb-btn:hover { color: var(--text); border-color: #3f3f46; }
  .wb-btn.on { color: var(--accent); border-color: rgba(162, 239, 91, 0.4); }
  .wb-x { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; border: 0; background: none; color: var(--text-3); cursor: pointer; border-radius: 6px; }
  .wb-x:hover { color: var(--text); background: var(--line-soft); }
  .wb-x svg { width: 14px; height: 14px; }
  .wb-pane { flex: 1; min-height: 0; display: flex; }
  .wb-pane[hidden] { display: none; }
  .wb-subs { list-style: none; margin: 0; padding: 6px 0; width: 280px; flex: none; border-right: 1px solid var(--line); overflow: auto; }
  .wb-subs li { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 2px 8px; padding: 6px 12px; cursor: pointer; }
  .wb-subs li:hover { background: var(--line-soft); }
  .wb-subs li.muted .name, .wb-subs li.muted .n { color: var(--text-4); }
  .wb-subs .name { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb-subs .n { color: var(--text-3); font-family: var(--mono); }
  .wb-subs .what { grid-column: 2 / 4; color: var(--text-4); font: 10px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb-subs input { margin: 0; accent-color: var(--accent); cursor: pointer; }
  .wb-log { flex: 1; min-width: 0; overflow: auto; font-family: var(--mono); font-size: 11.5px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .wb-log table { width: 100%; border-collapse: collapse; }
  .wb-log thead th { position: sticky; top: 0; background: var(--panel); text-align: left; font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .wb-log td { padding: 3px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; white-space: nowrap; color: var(--text-2); }
  .wb-log td.sum { white-space: normal; color: var(--text); width: 100%; }
  .wb-log tr.ev { cursor: pointer; }
  .wb-log tr.ev:hover td { background: rgba(255, 255, 255, 0.025); }
  .wb-log tr.ev.open td { background: rgba(162, 239, 91, 0.05); }
  .wb-log .src { color: var(--accent); }
  .wb-log .src.slot { color: var(--text-3); }
  .wb-log .src.logs { color: #93c5fd; }
  .wb-log .tag { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
  .wb-log .err { color: var(--critical); }
  .wb-log tr.detail td { padding: 0; }
  .wb-log pre { margin: 0; padding: 10px 14px 12px 24px; color: var(--text-2); white-space: pre-wrap; word-break: break-all; background: #050506; border-bottom: 1px solid var(--line); }
  .wb-log tr.mark td { color: var(--text-3); text-align: center; background: var(--line-soft); }
  .wb-empty { padding: 28px; color: var(--text-3); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  .wb-endpoints { flex: 1; overflow: auto; padding: 16px 20px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px 24px; align-content: start; }
  .wb-endpoints h3 { margin: 0 0 8px; font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
  .wb-kv { display: grid; grid-template-columns: 110px 1fr auto; align-items: center; gap: 6px 10px; }
  .wb-kv .k { color: var(--text-3); }
  .wb-kv code, .wb-cmd code { font: 11.5px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wb-kv .note { grid-column: 2 / 4; margin-top: -4px; color: var(--text-4); font-size: 11px; }
  .wb-cmd { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .wb-cmd .what { grid-column: 1 / 3; color: var(--text-3); font-size: 11px; margin-top: -4px; }
  .wb-copy { height: 22px; padding: 0 8px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--text-3); font: 11px Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  .wb-copy:hover { color: var(--text); border-color: #3f3f46; }
  .wb-copy.ok { color: var(--accent); border-color: rgba(162, 239, 91, 0.4); }

  @media (max-width: 980px) {
    .timeline { bottom: 84px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="banner">
    <div class="topbar">
      <div class="brand"><span class="mark"></span>mth <span class="sub">scenario</span></div>
      <div class="pill" id="pill">
        <div class="bars" id="bars"></div>
        <span class="k">Slot</span><span class="v num" id="pill-slot">–</span>
        <span class="sep"></span>
        <span class="k">Progress</span><span class="v num" id="pill-pct">0%</span>
        <svg class="ring" viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="6" stroke="var(--track)"></circle>
          <circle id="ring" cx="8" cy="8" r="6" stroke="var(--accent)" stroke-linecap="round" stroke-dasharray="37.7" stroke-dashoffset="37.7"></circle>
        </svg>
      </div>
    </div>

    <div class="timeline">
      <div class="readout">
        <div class="left">
          <div>
            <div class="state-tag" id="state-tag">Staged</div>
            <div class="clock num" id="clock">0:00<small id="clock-total">/ 0:00</small></div>
          </div>
        </div>
        <div class="upnext" id="next"></div>
      </div>
      <svg id="strip" aria-label="Scenario timeline"></svg>
    </div>

    <div class="controls">
      <button class="ctl" id="reset" title="Reset: restore the snapshot and stage the scenario again" aria-label="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="ctl danger" id="stop" title="Stop the surfnet and quit mth" aria-label="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="play" id="play" aria-label="Play"></button>
    </div>
  </header>
  <div class="rule"></div>

  <section class="profile">
    <h1 id="name">Loading…</h1>
    <div class="handle" id="handle"></div>
    <p class="description" id="description"></p>
    <div class="stats" id="stats"></div>
  </section>
  <div class="rule"></div>

  <section class="charts" id="charts"></section>
  <div class="error" id="error"></div>

  <footer>
    <span>Served by <code>mth scenario play</code> · Ctrl-C in the terminal stops it</span>
    <span class="foot-right">surfnet <code id="rpc"></code>
      <button class="wb-toggle" id="wb-toggle" title="Endpoints and a live websocket stream of the surfnet"><span class="wb-dot" id="wb-toggle-dot"></span>Workbench <kbd>`</kbd></button>
    </span>
  </footer>
</div>

<section class="workbench" id="workbench" hidden aria-label="Workbench">
  <div class="wb-resize" id="wb-resize" title="Drag to resize"></div>
  <div class="wb-bar">
    <div class="wb-tabs" role="tablist">
      <button role="tab" data-tab="events">Events<span class="num" id="wb-count">0</span></button>
      <button role="tab" data-tab="endpoints">Endpoints</button>
    </div>
    <div class="wb-conn"><span class="wb-dot" id="wb-dot"></span><span id="wb-conn">Not connected</span></div>
    <div class="wb-actions">
      <input id="wb-filter" placeholder="Filter events" spellcheck="false" aria-label="Filter events">
      <button class="wb-btn" id="wb-pause" title="Stop adding events to the list; subscriptions keep counting">Pause</button>
      <button class="wb-btn" id="wb-clear">Clear</button>
      <button class="wb-x" id="wb-close" title="Close the workbench (`)" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="wb-pane" data-pane="events">
    <ul class="wb-subs" id="wb-subs" aria-label="Subscriptions"></ul>
    <div class="wb-log" id="wb-log">
      <table><thead><tr><th>Time</th><th>Slot</th><th>Scenario</th><th>Source</th><th>Event</th></tr></thead><tbody id="wb-rows"></tbody></table>
      <div class="wb-empty" id="wb-empty">Waiting for the surfnet's websocket…</div>
    </div>
  </div>
  <div class="wb-pane" data-pane="endpoints" hidden><div class="wb-endpoints" id="wb-endpoints"></div></div>
</section>

<script>
const SLOT_SECONDS = 0.25;
const PRE = 16;      // slots shown before the scenario's start
const TAIL = 24;     // slots shown past its last override
const BARS = 30;
const ICONS = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 6.5v11a1.2 1.2 0 0 0 1.84 1.01l8.6-5.5a1.2 1.2 0 0 0 0-2.02l-8.6-5.5A1.2 1.2 0 0 0 9 6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5.5" width="4" height="13" rx="1.3"/><rect x="13.5" y="5.5" width="4" height="13" rx="1.3"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};

let plan = null;
let prices = null;      // the sampled chart: Phoenix prices, one series per market
let groups = [];        // overrides grouped by slot, for the banner
let samples = [];
let live = { slot: 0, base_slot: null, paused: false };
let busy = false;
let gen = null;       // the run the samples belong to
let stopped = false;
let hover = null;     // { chart, px }
let hoverDot = null;
let stripX = null;   // the strip's slot-to-pixel scale, for hovering dots

// Series colors, in the order a chart lists its instruments. The first is
// the accent; the rest stay apart from it and from each other on black.
const PALETTE = ['#a2ef5b', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa', '#2dd4bf', '#fb923c'];
// Overrides on charts mth doesn't sample: a neutral marker.
const NEUTRAL = '#a1a1aa';
const color = {};     // series key -> color

const $ = (id) => document.getElementById(id);
const usd = (v) => v == null ? '–' : '$' + v.toFixed(2);
const pct = (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '%';
const clock = (slots) => { const s = Math.max(0, Math.round(slots * SLOT_SECONDS)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = (tag, attrs, parent) => {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
};
const overrideColor = (o) => (o.series && color[o.series]) || NEUTRAL;

// Scenario time: slots since its base slot once registered. While staged,
// "now" is slot 0 and history runs to the left of it.
const started = () => live.base_slot != null;
const now = () => started() ? live.slot - live.base_slot : 0;
const anchor = () => started() ? live.base_slot : live.slot;
const done = () => started() && now() >= plan.end_slot;
// The window is the scenario itself, fixed: it never rescales as time
// passes. Samples outside it are dropped rather than squeezing the rest.
const domain = () => [-PRE, plan.end_slot + TAIL];
const inWindow = (x) => x >= -PRE && x <= plan.end_slot + TAIL;

// Several instruments share an axis only as a change from their own start:
// $143 and $400 can't share a dollar scale. One instrument keeps dollars.
const relative = () => prices.series.length > 1;
const scaled = (series, v) => v == null ? null : relative() ? (v / series.start_usd - 1) * 100 : v;
const axisLabel = (v) => relative() ? (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%' : '$' + v.toFixed(2);

/** A series' samples in the window: `{ x, mark, bid, ask }` in USD. */
function points(series) {
  const out = [];
  for (const s of samples) {
    const q = s.quotes[series.key];
    const x = s.slot - anchor();
    if (q && inWindow(x)) out.push({ x, ...q });
  }
  return out;
}

function planAt(series, x) {
  let level = series.path[0][1];
  for (const [slot, v] of series.path) if (slot <= x) level = v;
  return level;
}

const lastQuote = (series) => { for (let i = samples.length - 1; i >= 0; i--) { const q = samples[i].quotes[series.key]; if (q) return q; } return null; };

function niceTicks(lo, hi, count) {
  const step0 = (hi - lo || 1) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}

function timeTicks(lo, hi, count) {
  const seconds = [5, 10, 15, 30, 60, 120, 300].find((s) => (hi - lo) * SLOT_SECONDS / s <= count) ?? 600;
  const step = seconds / SLOT_SECONDS;
  const out = [];
  for (let v = 0; v <= hi; v += step) if (v >= lo) out.push(v);
  return out;
}

/** The price chart's y range, in its own scale, over every series. */
function yRange() {
  const ys = [];
  for (const series of prices.series) {
    for (const [, v] of series.path) ys.push(scaled(series, v));
    for (const p of points(series)) {
      ys.push(scaled(series, p.mark));
      if (!relative()) for (const v of [p.bid, p.ask]) if (v != null) ys.push(v);
    }
  }
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (relative()) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * 0.08 || Math.abs(hi) * 0.01 || 1;
  return [lo - pad, hi + pad];
}

function plannedPath(series, x, y, xMax) {
  let d = '', prev = null;
  for (const [slot, v] of series.path) {
    const sv = scaled(series, v);
    d += prev == null ? `M${x(slot)},${y(sv)}` : `L${x(slot)},${y(prev)}L${x(slot)},${y(sv)}`;
    prev = sv;
  }
  return d + `L${x(xMax)},${y(prev)}`;
}

/* ---------- Banner timeline ---------- */
function drawStrip() {
  const svg = $('strip');
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.replaceChildren();
  const [xMin, xMax] = domain();
  // The banner has no axis: every series as a change from its start, so
  // their shapes compare.
  const norm = (series, v) => (v / series.start_usd - 1) * 100;
  const ys = prices.series.flatMap((series) => [...series.path.map(([, v]) => norm(series, v)), ...points(series).map((p) => norm(series, p.mark))]);
  let yMin = Math.min(0, ...ys), yMax = Math.max(0, ...ys);
  const pad = (yMax - yMin) * 0.08 || 1;
  yMin -= pad; yMax += pad;
  const trackY = H - 30, top = 6, bottom = trackY - 14;
  const x = (v) => (v - xMin) / (xMax - xMin) * W;
  const y = (v) => top + (1 - (v - yMin) / (yMax - yMin)) * (bottom - top);
  const t = now();

  const defs = el('defs', {}, svg);
  for (const series of prices.series) {
    const id = 'fade-' + series.symbol.replace(/\W/g, '');
    const grad = el('linearGradient', { id, x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
    el('stop', { offset: '0%', 'stop-color': color[series.key], 'stop-opacity': prices.series.length > 1 ? 0.12 : 0.22 }, grad);
    el('stop', { offset: '100%', 'stop-color': color[series.key], 'stop-opacity': 0 }, grad);
    let d = '', prev = null;
    for (const [slot, v] of series.path) { const sv = norm(series, v); d += prev == null ? `M${x(slot)},${y(sv)}` : `L${x(slot)},${y(prev)}L${x(slot)},${y(sv)}`; prev = sv; }
    el('path', { d: d + `L${x(xMax)},${y(prev)}`, fill: 'none', stroke: color[series.key], 'stroke-opacity': 0.35, 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }, svg);
    const pts = points(series);
    if (pts.length > 1) {
      const played = pts.filter((p) => p.x >= 0);
      if (started() && played.length > 1) {
        const area = played.map((p, i) => (i ? 'L' : 'M') + x(p.x).toFixed(1) + ',' + y(norm(series, p.mark)).toFixed(1)).join('');
        el('path', { d: `${area}L${x(played[played.length - 1].x)},${bottom}L${x(played[0].x)},${bottom}Z`, fill: `url(#${id})` }, svg);
      }
      el('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + x(p.x).toFixed(1) + ',' + y(norm(series, p.mark)).toFixed(1)).join(''), fill: 'none', stroke: color[series.key], 'stroke-width': 2, 'stroke-linejoin': 'round' }, svg);
    }
  }

  // Track, filled up to now.
  el('line', { x1: 0, x2: W, y1: trackY, y2: trackY, stroke: 'var(--line)', 'stroke-width': 2, 'stroke-linecap': 'round' }, svg);
  if (started()) el('line', { x1: x(0), x2: x(Math.min(t, xMax)), y1: trackY, y2: trackY, stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linecap': 'round' }, svg);
  el('line', { x1: x(0), x2: x(0), y1: trackY - 6, y2: trackY + 6, stroke: 'var(--text-4)', 'stroke-width': 1 }, svg);
  for (const v of timeTicks(xMin, xMax, 8)) el('text', { x: x(v), y: H - 6, 'text-anchor': 'middle', class: 'tick' }, svg).textContent = clock(v);

  // One dot per slot with overrides, in the color of what they move.
  const next = started() ? groups.find((g) => g.slot > t) : groups[0];
  for (const g of groups) {
    const cx = x(g.slot);
    const applied = started() && g.slot <= t;
    const c = g.color;
    const node = el('g', { class: 'dot' }, svg);
    if (g === next && started() && !live.paused) el('circle', { cx, cy: trackY, r: 6, fill: 'none', stroke: c, 'stroke-width': 1.5, class: 'pulse' }, node);
    el('circle', { cx, cy: trackY, r: g === next ? 5.5 : 4.5, fill: applied ? c : 'var(--bg)', stroke: applied || g === next ? c : '#52525b', 'stroke-width': 2 }, node);
  }
  stripX = x;

  if (started()) {
    const px = x(Math.min(t, xMax));
    el('line', { x1: px, x2: px, y1: top, y2: trackY, stroke: 'var(--accent)', 'stroke-opacity': 0.5, 'stroke-width': 1 }, svg);
    el('circle', { cx: px, cy: trackY, r: 7, fill: 'var(--accent)', opacity: 0.25 }, svg);
    el('circle', { cx: px, cy: trackY, r: 3.5, fill: 'var(--accent)' }, svg);
  }

  if (hoverDot) {
    const cx = x(hoverDot.slot);
    const lines = hoverDot.items;
    const w = Math.min(360, Math.max(160, ...lines.map((o) => o.label.length * 6.6 + 40)));
    const bx = Math.min(Math.max(cx - w / 2, 0), W - w);
    const h = 26 + lines.length * 17;
    const by = trackY - 16 - h;
    const g = el('g', {}, svg);
    el('rect', { x: bx, y: by, width: w, height: h, rx: 8, fill: '#0e0e10', stroke: 'var(--line)' }, g);
    el('text', { x: bx + 12, y: by + 18, fill: 'var(--text-3)', 'font-size': 11, 'font-family': 'var(--mono)' }, g).textContent = `slot ${hoverDot.slot} · ${clock(hoverDot.slot)}`;
    lines.forEach((o, i) => {
      el('circle', { cx: bx + 16, cy: by + 32 + i * 17, r: 3.5, fill: overrideColor(o) }, g);
      el('text', { x: bx + 26, y: by + 36 + i * 17, fill: 'var(--text)', 'font-size': 12 }, g).textContent = o.label;
    });
  }
}

/* ---------- Body charts ---------- */
function buildCharts() {
  $('charts').innerHTML = plan.charts.map((c) => `
    <div class="chart-card${c.tracked ? '' : ' lane'}" data-chart="${esc(c.id)}">
      <div class="card-head">
        <h2><span class="venue">${esc(c.venue)}</span>${esc(c.title)}${c.tracked && c.series.length > 1 ? '<span class="scale">% from each start</span>' : ''}</h2>
        <div class="legend"></div>
      </div>
      <div class="chart-wrap"><svg class="chart" role="img" aria-label="${esc(c.venue + ' ' + c.title)}"></svg><div class="tooltip"></div></div>
      ${c.tracked ? '' : `<div class="note">mth doesn't sample ${esc(c.title.toLowerCase())} yet: the markers show when each override lands.</div>`}
    </div>`).join('');
  for (const card of document.querySelectorAll('.chart-card')) {
    const svg = card.querySelector('svg');
    svg.addEventListener('pointermove', (e) => { hover = { chart: card.dataset.chart, px: e.clientX - svg.getBoundingClientRect().left }; drawCharts(); });
    svg.addEventListener('pointerleave', () => { hover = null; drawCharts(); });
  }
}

function drawCharts() {
  for (const card of document.querySelectorAll('.chart-card')) {
    const chart = plan.charts.find((c) => c.id === card.dataset.chart);
    if (chart.tracked) drawPrices(card, chart); else drawLane(card, chart);
  }
}

function legend(card, chart) {
  const items = chart.series.map((series) => {
    const q = lastQuote(series);
    const value = q ? `<b>${usd(q.mark)}</b> <small>${pct((q.mark / series.start_usd - 1) * 100)}</small>` : `<small>${usd(series.start_usd)}</small>`;
    return `<span><i class="sw-line" style="border-color:${color[series.key]}"></i>${esc(series.symbol)} ${value}</span>`;
  });
  if (!relative()) items.push('<span><i class="sw-band"></i>Bid–ask</span>');
  items.push('<span><i class="sw-dash"></i>Planned</span><span><i class="sw-rule"></i>Override</span>');
  const html = items.join('');
  const node = card.querySelector('.legend');
  if (node.innerHTML !== html) node.innerHTML = html;
}

function drawPrices(card, chart) {
  legend(card, chart);
  const svg = card.querySelector('svg');
  const W = svg.clientWidth, H = svg.clientHeight;
  const M = { top: 10, right: 64, bottom: 26, left: 4 };
  svg.replaceChildren();
  const [xMin, xMax] = domain();
  const [yMin, yMax] = yRange();
  const x = (v) => M.left + (v - xMin) / (xMax - xMin) * (W - M.left - M.right);
  const y = (v) => M.top + (1 - (v - yMin) / (yMax - yMin)) * (H - M.top - M.bottom);
  const clip = 'plot-' + chart.id.replace(/\W/g, '');

  el('clipPath', { id: clip }, el('defs', {}, svg)).appendChild(el('rect', { x: M.left, y: 0, width: W - M.left - M.right, height: H - M.bottom }));
  const grid = el('g', { class: 'grid' }, svg), axis = el('g', { class: 'axis' }, svg);
  for (const v of niceTicks(yMin, yMax, 5)) {
    el('line', { x1: M.left, x2: W - M.right, y1: y(v), y2: y(v) }, grid);
    el('text', { x: W - M.right + 10, y: y(v) + 4 }, axis).textContent = axisLabel(v);
  }
  if (relative()) el('line', { x1: M.left, x2: W - M.right, y1: y(0), y2: y(0), stroke: 'var(--text-4)', 'stroke-width': 1 }, svg);
  for (const v of timeTicks(xMin, xMax, 8)) el('text', { x: x(v), y: H - 6, 'text-anchor': 'middle' }, axis).textContent = clock(v);
  const plot = el('g', { 'clip-path': `url(#${clip})` }, svg);
  for (const o of plan.overrides) if (o.chart === chart.id) el('line', { x1: x(o.slot), x2: x(o.slot), y1: M.top, y2: H - M.bottom, stroke: overrideColor(o), 'stroke-opacity': 0.22, 'stroke-width': 1 }, plot);

  for (const series of chart.series) {
    const c = color[series.key];
    const pts = points(series);
    if (!relative()) {
      const band = pts.filter((p) => p.bid != null && p.ask != null);
      if (band.length > 1) {
        const d = band.map((p, i) => (i ? 'L' : 'M') + x(p.x) + ',' + y(p.ask)).join('') + band.slice().reverse().map((p) => 'L' + x(p.x) + ',' + y(p.bid)).join('') + 'Z';
        el('path', { d, fill: 'var(--accent-soft)' }, plot);
      }
    }
    el('path', { d: plannedPath(series, x, y, xMax), fill: 'none', stroke: relative() ? c : 'var(--text-3)', 'stroke-opacity': relative() ? 0.45 : 1, 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }, plot);
    if (pts.length > 1) {
      el('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + x(p.x) + ',' + y(scaled(series, p.mark))).join(''), fill: 'none', stroke: c, 'stroke-width': 2, 'stroke-linejoin': 'round' }, plot);
      const last = pts[pts.length - 1];
      el('circle', { cx: x(last.x), cy: y(scaled(series, last.mark)), r: 4.5, fill: c, stroke: 'var(--bg)', 'stroke-width': 2 }, svg);
    }
  }

  const tip = card.querySelector('.tooltip');
  if (!hover || hover.chart !== chart.id) { tip.style.display = 'none'; return; }
  const xv = Math.round(xMin + (hover.px - M.left) / (W - M.left - M.right) * (xMax - xMin));
  el('line', { x1: x(xv), x2: x(xv), y1: M.top, y2: H - M.bottom, stroke: 'var(--text-3)', 'stroke-width': 1, 'stroke-dasharray': '2 3' }, svg);
  let rows = '';
  for (const series of chart.series) {
    const pts = points(series);
    const near = pts.reduce((b, p) => (b == null || Math.abs(p.x - xv) < Math.abs(b.x - xv) ? p : b), null);
    const sample = near && Math.abs(near.x - xv) <= 2 ? near : null;
    const c = color[series.key];
    if (sample) el('circle', { cx: x(sample.x), cy: y(scaled(series, sample.mark)), r: 4.5, fill: c, stroke: 'var(--bg)', 'stroke-width': 2 }, svg);
    const change = (v) => pct((v / series.start_usd - 1) * 100);
    rows += sample
      ? `<div class="row"><span><i style="background:${c}"></i>${esc(series.symbol)}</span><b>${usd(sample.mark)} <small style="color:var(--text-3);font-weight:500">${change(sample.mark)}</small></b></div>`
        + (relative() ? '' : `<div class="row">Bid / ask <b>${usd(sample.bid)} / ${usd(sample.ask)}</b></div>`)
      : '';
    if (xv >= 0) rows += `<div class="row"><span>${relative() ? esc(series.symbol) + ' planned' : 'Planned'}</span><b>${usd(planAt(series, xv))}</b></div>`;
  }
  const events = plan.overrides.filter((o) => o.chart === chart.id && Math.abs(o.slot - xv) <= 1);
  tip.innerHTML = `<div class="head">${xv < 0 ? 'Before start' : clock(xv)} <span style="color:var(--text-3);font-weight:500">· slot ${xv}</span></div>${rows}`
    + events.map((o) => `<div class="event"><span style="color:${overrideColor(o)}">●</span> ${esc(o.label)}</div>`).join('');
  tip.style.display = 'block';
  tip.style.left = Math.min(Math.max(x(xv) + 14, 0), W - tip.offsetWidth) + 'px';
  tip.style.top = '8px';
}

/** A chart mth doesn't sample: when each of its overrides lands. */
function drawLane(card, chart) {
  const own = plan.overrides.filter((o) => o.chart === chart.id);
  const legendHtml = `<span><i class="sw-dot" style="border-color:${NEUTRAL};background:${NEUTRAL}"></i>${own.length} override${own.length === 1 ? '' : 's'}</span>`;
  const node = card.querySelector('.legend');
  if (node.innerHTML !== legendHtml) node.innerHTML = legendHtml;
  const svg = card.querySelector('svg');
  const W = svg.clientWidth, H = svg.clientHeight;
  const M = { top: 8, right: 64, bottom: 26, left: 4 };
  svg.replaceChildren();
  const [xMin, xMax] = domain();
  const x = (v) => M.left + (v - xMin) / (xMax - xMin) * (W - M.left - M.right);
  const mid = M.top + (H - M.top - M.bottom) / 2;
  const axis = el('g', { class: 'axis' }, svg);
  for (const v of timeTicks(xMin, xMax, 8)) el('text', { x: x(v), y: H - 6, 'text-anchor': 'middle' }, axis).textContent = clock(v);
  el('line', { x1: M.left, x2: W - M.right, y1: mid, y2: mid, stroke: 'var(--line)', 'stroke-width': 1 }, svg);
  const t = now();
  if (started()) el('line', { x1: x(Math.min(t, xMax)), x2: x(Math.min(t, xMax)), y1: M.top, y2: H - M.bottom, stroke: 'var(--accent)', 'stroke-opacity': 0.5, 'stroke-width': 1 }, svg);
  for (const o of own) {
    const applied = started() && o.slot <= t;
    el('line', { x1: x(o.slot), x2: x(o.slot), y1: M.top, y2: H - M.bottom, stroke: NEUTRAL, 'stroke-opacity': 0.25 }, svg);
    el('circle', { cx: x(o.slot), cy: mid, r: 5, fill: applied ? NEUTRAL : 'var(--bg)', stroke: NEUTRAL, 'stroke-width': 2 }, svg);
  }
  const tip = card.querySelector('.tooltip');
  if (!hover || hover.chart !== chart.id) { tip.style.display = 'none'; return; }
  const xv = Math.round(xMin + (hover.px - M.left) / (W - M.left - M.right) * (xMax - xMin));
  const near = own.filter((o) => Math.abs(x(o.slot) - hover.px) <= 10);
  if (!near.length) { tip.style.display = 'none'; return; }
  tip.innerHTML = `<div class="head">${clock(near[0].slot)} <span style="color:var(--text-3);font-weight:500">· slot ${near[0].slot}</span></div>`
    + near.map((o) => {
      const values = Object.entries(o.values).map(([k, v]) => `${k}=${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' ');
      return `<div class="event">${esc(o.label)}<div style="color:var(--text-4);font:11px var(--mono);margin-top:2px">${esc(o.template)}${values ? ' · ' + esc(values) : ''}</div></div>`;
    }).join('');
  tip.style.display = 'block';
  tip.style.left = Math.min(Math.max(x(xv) + 14, 0), W - tip.offsetWidth) + 'px';
  tip.style.top = '4px';
}

/* ---------- Text ---------- */
function render() {
  const t = now();
  const total = plan.end_slot;
  const progress = started() ? Math.min(1, t / Math.max(total, 1)) : 0;

  // Progress pill.
  $('pill').classList.toggle('paused', live.paused);
  const on = Math.round(progress * BARS);
  [...$('bars').children].forEach((b, i) => b.classList.toggle('on', i < on));
  $('pill-slot').textContent = started() ? `${Math.min(t, total)} / ${total}` : `0 / ${total}`;
  $('pill-pct').textContent = Math.round(progress * 100) + '%';
  $('ring').setAttribute('stroke-dashoffset', (37.7 * (1 - progress)).toFixed(2));

  // Readout.
  const state = stopped ? 'Stopped' : live.resetting ? 'Resetting' : !started() ? 'Staged' : done() ? 'Played' : live.paused ? 'Paused' : 'Playing';
  $('state-tag').textContent = state;
  $('clock').firstChild.textContent = clock(Math.min(t, total));
  $('clock-total').textContent = '/ ' + clock(total);
  const next = started() ? plan.overrides.find((o) => o.slot > t) : plan.overrides[0];
  $('next').innerHTML = stopped
    ? `<div class="k">Stopped</div><div class="label">The surfnet is down</div><div class="eta">run mth scenario play to start again</div>`
    : live.resetting
    ? `<div class="k">Resetting</div><div class="label">Restoring ${esc(plan.snapshot)}</div>`
    : done()
    ? `<div class="k">Done</div><div class="label">${plan.overrides.length} overrides applied</div>`
    : next
      ? `<div class="k">Next</div><div class="label"><span style="color:${overrideColor(next)}">●</span> ${esc(next.label)}</div><div class="eta num">${started() ? 'in ' + ((next.slot - t) * SLOT_SECONDS).toFixed(1) + 's' : 'at ' + clock(next.slot)}</div>`
      : '';

  // Button.
  const btn = $('play');
  const mode = done() ? 'done' : started() && !live.paused ? 'pause' : 'play';
  if (btn.dataset.mode !== mode) { btn.innerHTML = ICONS[mode]; btn.dataset.mode = mode; }
  const idle = stopped || live.resetting || busy;
  btn.disabled = mode === 'done' || idle;
  $('reset').disabled = idle;
  $('reset').classList.toggle('spinning', !!live.resetting);
  $('stop').disabled = stopped;
  btn.setAttribute('aria-label', mode === 'pause' ? 'Pause' : mode === 'done' ? 'Played' : 'Play');

  // Stats: one card per sampled instrument, then the overrides.
  const applied = started() ? plan.overrides.filter((o) => o.slot <= t).length : 0;
  const html = prices.series.map((series) => {
    const q = lastQuote(series);
    const played = started() ? points(series).filter((p) => p.x >= 0).map((p) => p.mark) : [];
    return `<div class="stat"><div class="k"><span class="sym"><i style="background:${color[series.key]}"></i>${esc(series.symbol)} · ${esc(prices.venue)} perp</span></div>
      <div class="v num">${usd(q?.mark)}<small>${q ? pct((q.mark / series.start_usd - 1) * 100) : 'from ' + usd(series.start_usd)}</small></div>
      <div class="sub">${q ? `${usd(q.bid)} / ${usd(q.ask)}` : '–'}${played.length ? ` · ${usd(Math.min(...played))}–${usd(Math.max(...played))}` : ''}</div></div>`;
  }).join('') + `<div class="stat"><div class="k">Overrides</div><div class="v num">${applied}<small>/ ${plan.overrides.length}</small></div><div class="sub">${plan.charts.length} chart${plan.charts.length === 1 ? '' : 's'}</div></div>`;
  if ($('stats').innerHTML !== html) $('stats').innerHTML = html;
}

function frame() { render(); drawStrip(); drawCharts(); }

async function poll() {
  if (stopped) return;
  try {
    const r = await (await fetch('/api/live/' + samples.length)).json();
    if (gen !== null && r.generation !== gen) {
      // A reset: the old run's samples are gone; fetch the new one's.
      gen = r.generation; samples = [];
      live = r; setTimeout(poll, 0); return;
    }
    gen = r.generation;
    samples = samples.slice(0, r.from).concat(r.samples);
    live = r;
    stopped = !!r.stopped;
    $('rpc').textContent = r.rpc_url;
    wbSync(r);
    $('error').textContent = r.error ? 'Reading the market: ' + r.error : '';
    frame();
  } catch (e) {
    $('error').textContent = 'mth is not reachable: ' + e.message;
  }
  if (!stopped) setTimeout(poll, 250);
}

async function post(path) {
  const r = await fetch(path, { method: 'POST' });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) $('error').textContent = body.error || r.statusText;
  return r.ok ? body : null;
}

async function reset() {
  if ($('reset').disabled) return;
  live.resetting = true; render();
  await post('/api/reset');
}

async function stop() {
  if ($('stop').disabled || !confirm('Stop the surfnet? This ends mth scenario play.')) return;
  if (await post('/api/stop')) { stopped = true; wbSync(live); frame(); }
}

async function toggle() {
  const btn = $('play');
  if (btn.disabled) return;
  const pausing = btn.dataset.mode === 'pause';
  busy = true; render();
  try {
    const body = await post(pausing ? '/api/pause' : '/api/play');
    // Reflect the change before the next poll lands.
    if (body && pausing) live.paused = true;
    if (body && !pausing) { live.paused = false; if (body.base_slot != null) live.base_slot = body.base_slot; }
  } finally {
    busy = false; frame();
  }
}

$('play').addEventListener('click', toggle);
$('reset').addEventListener('click', reset);
$('stop').addEventListener('click', stop);
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); toggle(); } });
const strip = $('strip');
strip.addEventListener('pointermove', (e) => {
  if (!stripX) return;
  const px = e.clientX - strip.getBoundingClientRect().left;
  const near = groups.reduce((b, g) => (b == null || Math.abs(stripX(g.slot) - px) < Math.abs(stripX(b.slot) - px) ? g : b), null);
  const hit = near && Math.abs(stripX(near.slot) - px) <= 10 ? near : null;
  if (hit !== hoverDot) { hoverDot = hit; drawStrip(); }
});
strip.addEventListener('pointerleave', () => { hoverDot = null; drawStrip(); });
window.addEventListener('resize', frame);

/* ---------- Workbench ----------
   The surfnet's own websocket, subscribed to from the page: slots, the
   accounts the scenario's overrides write, and logs that mention the market.
   It reconnects to the new surfnet after a reset. */
const WB_MAX = 600;
const WB_STORE = 'mth.workbench';
const wb = {
  open: false, tab: 'events', height: 300,
  ws: null, url: null, surfnet: null, retry: null, nextId: 1, requests: new Map(),
  subs: [], rows: [], paused: false, filter: '', last: new Map(), stick: true,
};

function wbLoad() {
  try { Object.assign(wb, JSON.parse(localStorage.getItem(WB_STORE) || '{}')); } catch {}
  if (/workbench/.test(location.hash)) wb.open = true;
}
function wbSave() { localStorage.setItem(WB_STORE, JSON.stringify({ open: wb.open, tab: wb.tab, height: wb.height })); }

function wbLayout() {
  const panel = $('workbench');
  panel.hidden = !wb.open;
  document.body.classList.toggle('wb-open', wb.open);
  document.documentElement.style.setProperty('--wb-h', wb.height + 'px');
  for (const b of document.querySelectorAll('.wb-tabs button')) b.classList.toggle('on', b.dataset.tab === wb.tab);
  for (const p of document.querySelectorAll('.wb-pane')) p.hidden = p.dataset.pane !== wb.tab;
  $('wb-filter').style.visibility = wb.tab === 'events' ? 'visible' : 'hidden';
  $('wb-pause').style.visibility = $('wb-clear').style.visibility = wb.tab === 'events' ? 'visible' : 'hidden';
}
function wbToggle(open = !wb.open) { wb.open = open; wbSave(); wbLayout(); if (open) wbScroll(); }

function wbDefs() {
  const markets = plan.watch.filter((w) => / market$/.test(w.label));
  const logs = (markets.length ? markets : [null]).map((market) => ({
    key: 'logs:' + (market ? market.pubkey : 'all'), label: market ? `Logs · ${market.label}` : 'Logs', what: `logsSubscribe ${market ? market.pubkey : 'all'}`,
    method: 'logsSubscribe', params: [market ? { mentions: [market.pubkey] } : 'all', { commitment: 'confirmed' }],
  }));
  return [
    { key: 'slot', label: 'Slots', what: 'slotSubscribe', method: 'slotSubscribe', params: [], muted: true },
    ...plan.watch.map((w) => ({
      key: w.pubkey, label: w.label, what: `accountSubscribe ${w.pubkey}`, note: w.note, account: w.pubkey,
      method: 'accountSubscribe', params: [w.pubkey, { encoding: 'base64', commitment: 'confirmed' }],
    })),
    ...logs,
  ].map((d) => ({ ...d, id: null, count: 0, state: 'idle' }));
}

function wbConnect(url) {
  if (!url || (wb.url === url && wb.ws)) return;
  wbClose();
  wb.url = url;
  const ws = new WebSocket(url);
  wb.ws = ws;
  wbStatus('wait', `Connecting to ${url}`);
  ws.onopen = () => {
    if (ws !== wb.ws) return;
    wbStatus('live', url);
    for (const sub of wb.subs) {
      const id = wb.nextId++;
      wb.requests.set(id, sub);
      sub.state = 'pending';
      ws.send(JSON.stringify({ jsonrpc: '2.0', id, method: sub.method, params: sub.params }));
    }
    wbRenderSubs();
  };
  ws.onmessage = (m) => { if (ws === wb.ws) wbMessage(JSON.parse(m.data)); };
  ws.onclose = () => {
    if (ws !== wb.ws) return;
    wb.ws = null;
    for (const sub of wb.subs) { sub.state = 'idle'; sub.id = null; }
    wbRenderSubs();
    if (stopped) { wbStatus('down', 'The surfnet is stopped'); return; }
    wbStatus('wait', `Reconnecting to ${url}`);
    // Allow a reconnect to the same URL.
    wb.url = null;
    wb.retry = setTimeout(() => wbConnect(live.ws_url), 1000);
  };
}

function wbClose() {
  clearTimeout(wb.retry);
  if (wb.ws) { const ws = wb.ws; wb.ws = null; ws.close(); }
  wb.requests.clear();
  for (const sub of wb.subs) { sub.state = 'idle'; sub.id = null; }
}

function wbStatus(kind, text) {
  for (const id of ['wb-dot', 'wb-toggle-dot']) $(id).className = 'wb-dot ' + kind;
  $('wb-conn').textContent = text;
}

function wbMessage(msg) {
  if (msg.id != null) {
    const sub = wb.requests.get(msg.id);
    wb.requests.delete(msg.id);
    if (!sub) return;
    if (msg.error) { sub.state = 'error'; wbPush(sub, null, `subscription refused: ${msg.error.message}`, msg, 'err'); }
    else { sub.id = msg.result; sub.state = 'live'; }
    wbRenderSubs();
    return;
  }
  const sub = wb.subs.find((s) => s.id === msg.params?.subscription);
  if (!sub) return;
  sub.count++;
  const r = msg.params.result;
  if (sub.key === 'slot') {
    wbPush(sub, r.slot, `slot ${r.slot} · parent ${r.parent} · root ${r.root}`, r);
  } else if (sub.account) {
    const bytes = Uint8Array.from(atob(r.value.data[0]), (c) => c.charCodeAt(0));
    const prev = wb.last.get(sub.account);
    wb.last.set(sub.account, bytes);
    let changed = 0;
    if (prev) for (let i = 0; i < Math.max(prev.length, bytes.length); i++) if (prev[i] !== bytes[i]) changed++;
    const sol = (r.value.lamports / 1e9).toLocaleString(undefined, { maximumFractionDigits: 4 });
    const what = prev ? `${changed.toLocaleString()} of ${bytes.length.toLocaleString()} bytes changed` : `${bytes.length.toLocaleString()} bytes (first update)`;
    const raw = { ...r, value: { ...r.value, data: [`<${bytes.length} bytes, base64>`, 'base64'] } };
    wbPush(sub, r.context.slot, `${what} · ${sol} SOL`, raw);
  } else {
    const v = r.value;
    const sig = v.signature.slice(0, 8) + '…' + v.signature.slice(-6);
    wbPush(sub, r.context.slot, `${sig} · ${v.err ? 'failed' : 'ok'} · ${v.logs.length} log lines`, r, v.err ? 'err' : '');
  }
  wbRenderSubs();
}

// The override a slot's event most likely came from: Surfpool applies an
// override at its slot, give or take one.
function wbOverrideAt(slot) {
  if (slot == null || !started()) return null;
  const x = slot - live.base_slot;
  let best = null;
  for (const o of plan.overrides) if (Math.abs(o.slot - x) <= 1 && (!best || Math.abs(o.slot - x) < Math.abs(best.slot - x))) best = o;
  return best;
}

function wbPush(sub, slot, summary, raw, cls = '') {
  if (sub.muted || wb.paused) return;
  const at = new Date();
  const x = slot != null && started() ? slot - live.base_slot : null;
  const override = sub.account ? wbOverrideAt(slot) : null;
  const row = { sub, slot, x, summary, raw, cls, override, at, open: false };
  wb.rows.push(row);
  // Trimmed in batches, so a long session doesn't re-render on every event.
  if (wb.rows.length > WB_MAX + 100) { wb.rows.splice(0, wb.rows.length - WB_MAX); wbRenderRows(); return; }
  if (wbMatches(row)) $('wb-rows').appendChild(wbRow(row));
  $('wb-count').textContent = wb.rows.filter((r) => !r.marker).length;
  $('wb-empty').hidden = true;
  wbScroll();
}

function wbMarker(text) {
  const row = { marker: text, at: new Date() };
  wb.rows.push(row);
  $('wb-rows').appendChild(wbRow(row));
  $('wb-empty').hidden = true;
  wbScroll();
}

const wbTime = (d) => d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
const wbMatches = (row) => row.marker || !wb.filter || `${row.sub.label} ${row.summary} ${row.override?.label ?? ''} ${row.slot ?? ''}`.toLowerCase().includes(wb.filter);

function wbRow(row) {
  const tr = document.createElement('tr');
  if (row.marker) { tr.className = 'mark'; tr.innerHTML = `<td colspan="5">${esc(row.marker)} · ${wbTime(row.at)}</td>`; return tr; }
  tr.className = 'ev';
  const src = row.sub.key === 'slot' ? 'slot' : row.sub.key.startsWith('logs') ? 'logs' : '';
  tr.innerHTML = `<td>${wbTime(row.at)}</td><td>${row.slot ?? ''}</td><td>${row.x == null ? '' : row.x < 0 ? 'before' : clock(row.x)}</td>`
    + `<td class="src ${src}">${esc(row.sub.label)}</td>`
    + `<td class="sum ${row.cls}">${esc(row.summary)}${row.override ? `<span class="tag">${esc(row.override.label)}</span>` : ''}</td>`;
  tr.addEventListener('click', () => {
    row.open = !row.open;
    tr.classList.toggle('open', row.open);
    if (row.open) {
      const d = document.createElement('tr');
      d.className = 'detail';
      d.innerHTML = `<td colspan="5"><pre>${esc(JSON.stringify(row.raw, null, 2))}</pre></td>`;
      tr.after(d);
    } else if (tr.nextElementSibling?.classList.contains('detail')) tr.nextElementSibling.remove();
  });
  return tr;
}

function wbRenderRows() {
  $('wb-rows').replaceChildren(...wb.rows.filter(wbMatches).map(wbRow));
  $('wb-count').textContent = wb.rows.filter((r) => !r.marker).length;
  $('wb-empty').hidden = wb.rows.length > 0;
  wbScroll(true);
}

function wbScroll(force) {
  const log = $('wb-log');
  if (wb.open && (wb.stick || force)) log.scrollTop = log.scrollHeight;
}

function wbRenderSubs() {
  $('wb-subs').innerHTML = wb.subs.map((s, i) => {
    const dot = s.state === 'live' ? 'live' : s.state === 'error' ? 'down' : s.state === 'pending' ? 'wait' : '';
    return `<li data-i="${i}" class="${s.muted ? 'muted' : ''}" title="${esc(s.note ? s.note + ' · ' : '')}${s.muted ? 'Muted: counted, not listed. Click to list.' : 'Click to mute'}">`
      + `<input type="checkbox" ${s.muted ? '' : 'checked'} aria-label="List ${esc(s.label)} events">`
      + `<span class="name"><span class="wb-dot ${dot}" style="display:inline-block;margin-right:7px;vertical-align:1px"></span>${esc(s.label)}</span>`
      + `<span class="n">${s.count.toLocaleString()}</span><span class="what">${esc(s.what)}</span></li>`;
  }).join('');
}

function wbCopyable(text) { return `<code title="${esc(text)}">${esc(text)}</code><button class="wb-copy" data-copy="${esc(text)}">Copy</button>`; }

function wbRenderEndpoints() {
  const rpc = live.rpc_url || '', ws = live.ws_url || '';
  const body = JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'getSlot' });
  const cmd = (what, text) => `<div class="wb-cmd">${wbCopyable(text)}<span class="what">${esc(what)}</span></div>`;
  $('wb-endpoints').innerHTML = `
    <div>
      <h3>Surfnet</h3>
      <div class="wb-kv">
        <span class="k">RPC (HTTP)</span>${wbCopyable(rpc)}
        <span class="k">Websocket</span>${wbCopyable(ws)}
        <span class="k">Snapshot</span><code>${esc(plan.snapshot)}</code><span></span>
        <span class="k">Base slot</span><code>${live.base_slot ?? 'not started'}</code><span></span>
      </div>
      <h3 style="margin-top:18px">Try it</h3>
      ${cmd('Read the current slot over HTTP', `curl -s ${rpc} -H 'content-type: application/json' -d '${body}'`)}
      ${cmd('Point the Solana CLI at it', `solana config set --url ${rpc} --ws ${ws}`)}
      ${cmd('Open the websocket, then send {"jsonrpc":"2.0","id":1,"method":"slotSubscribe"}', `npx wscat -c ${ws}`)}
    </div>
    <div>
      <h3>Watched accounts</h3>
      <div class="wb-kv">
        ${plan.watch.map((w) => `<span class="k">${esc(w.label)}</span>${wbCopyable(w.pubkey)}<span class="note">${esc(w.note)}</span>`).join('')}
      </div>
      <h3 style="margin-top:18px">Inspect one</h3>
      ${plan.watch[0] ? cmd(`Fetch ${plan.watch[0].label}`, `solana account ${plan.watch[0].pubkey} --url ${rpc}`) : ''}
      <p style="color:var(--text-4);margin:10px 0 0">The surfnet is offline: it serves the snapshot and the scenario's overrides, nothing from mainnet. Reset starts a new surfnet on new ports.</p>
    </div>`;
}

function wbSync(r) {
  if (stopped) { wbClose(); wbStatus('down', 'The surfnet is stopped'); return; }
  // A new websocket URL is a new surfnet: Reset starts one on new ports.
  if (r.ws_url && r.ws_url !== wb.surfnet) {
    if (wb.surfnet) wbMarker(`Reset: new surfnet at ${r.ws_url}`);
    wb.surfnet = r.ws_url;
    wb.last.clear();
    for (const sub of wb.subs) sub.count = 0;
    wbRenderSubs();
  }
  // A no-op while connected to it; otherwise (re)connects.
  if (r.ws_url) wbConnect(r.ws_url);
  if (wb.endpointsFor !== `${r.rpc_url} ${r.ws_url} ${r.base_slot}`) { wb.endpointsFor = `${r.rpc_url} ${r.ws_url} ${r.base_slot}`; wbRenderEndpoints(); }
}

function wbInit() {
  wbLoad();
  wb.subs = wbDefs();
  wbRenderSubs();
  wbLayout();
  $('wb-toggle').addEventListener('click', () => wbToggle());
  $('wb-close').addEventListener('click', () => wbToggle(false));
  for (const b of document.querySelectorAll('.wb-tabs button')) b.addEventListener('click', () => { wb.tab = b.dataset.tab; wbSave(); wbLayout(); });
  $('wb-subs').addEventListener('click', (e) => {
    const li = e.target.closest('li'); if (!li) return;
    const sub = wb.subs[+li.dataset.i];
    sub.muted = !sub.muted;
    wbRenderSubs();
  });
  $('wb-filter').addEventListener('input', (e) => { wb.filter = e.target.value.trim().toLowerCase(); wbRenderRows(); });
  $('wb-pause').addEventListener('click', () => { wb.paused = !wb.paused; $('wb-pause').classList.toggle('on', wb.paused); $('wb-pause').textContent = wb.paused ? 'Resume' : 'Pause'; });
  $('wb-clear').addEventListener('click', () => { wb.rows = []; wbRenderRows(); });
  $('wb-log').addEventListener('scroll', () => { const l = $('wb-log'); wb.stick = l.scrollHeight - l.scrollTop - l.clientHeight < 24; });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.wb-copy'); if (!b) return;
    navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = 'Copied'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok'); }, 1200); });
  });
  const handle = $('wb-resize');
  handle.addEventListener('pointerdown', (e) => {
    handle.setPointerCapture(e.pointerId); handle.classList.add('drag');
    const move = (ev) => { wb.height = Math.round(Math.min(Math.max(innerHeight - ev.clientY, 140), innerHeight * 0.85)); wbLayout(); };
    const up = () => { handle.classList.remove('drag'); handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); wbSave(); };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '`' && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { e.preventDefault(); wbToggle(); }
  });
}

(async () => {
  plan = await (await fetch('/api/plan')).json();
  prices = plan.charts.find((c) => c.tracked);
  prices.series.forEach((series, i) => { color[series.key] = PALETTE[i % PALETTE.length]; });
  const bySlot = new Map();
  for (const o of plan.overrides) {
    if (!bySlot.has(o.slot)) bySlot.set(o.slot, { slot: o.slot, items: [] });
    bySlot.get(o.slot).items.push(o);
  }
  // A slot's dot takes the color of what its overrides move; mixed, neutral.
  groups = [...bySlot.values()].map((g) => {
    const colors = new Set(g.items.map(overrideColor));
    return { ...g, color: colors.size === 1 ? [...colors][0] : NEUTRAL };
  });
  $('bars').innerHTML = '<i></i>'.repeat(BARS);
  $('name').textContent = plan.name;
  const venues = [...new Set(plan.charts.map((c) => c.venue))];
  $('handle').textContent = `${prices.series.map((s) => s.symbol).join(', ')} · ${venues.join(', ')} · ${plan.snapshot}`;
  $('description').textContent = plan.description;
  document.title = `mth · ${plan.name}`;
  buildCharts();
  wbInit();
  poll();
})();
</script>
</body>
</html>
