[package]
name = "mtx-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "mtx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap = { workspace = true, features = ["env"] }
flate2 = "1"
# glibc's allocator holds on to what a session frees: a verifier grading
# 144 sessions grows past its memory limit.
mimalloc = { version = "0.1", default-features = false }
futures.workspace = true
mtx-kit.workspace = true
mtx-core.workspace = true
mtx-grader.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }
schemars = "1"
sha2 = "0.10"
solana-keypair.workspace = true
solana-pubkey.workspace = true
solana-rpc-client.workspace = true
solana-signer.workspace = true
surfpool-core.workspace = true
surfpool-types.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
include_dir = "0.7"
qrcode = { version = "0.14", default-features = false }
