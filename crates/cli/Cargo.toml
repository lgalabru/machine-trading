[package]
name = "mtx-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mtx"
path = "src/main.rs"

[features]
default = ["generate"]
# What runs on a person's machine and never in an agent's container: the
# studio, the bench's results, snapshots, calibration, scenario authoring,
# and the `mtx bot` commands that start from a checkout. The agent image
# builds `--no-default-features`: its `mtx` grades a bot on scenario files
# (`mtx grade`) and checks a bot (`mtx bot check`) or a scenario file
# (`mtx scenario check`), and that is all it does.
host = [
  "dep:axum",
  "dep:flate2",
  "dep:futures",
  "dep:include_dir",
  "dep:mtx-acp",
  "dep:mtx-kit",
  "dep:qrcode",
  "dep:reqwest",
  "dep:sha2",
  "dep:solana-keypair",
  "dep:solana-pubkey",
  "dep:solana-rpc-client",
  "dep:solana-signer",
  "dep:surfpool-core",
  "dep:surfpool-types",
  "dep:tar",
  "dep:thiserror",
  "dep:toml",
  "dep:uuid",
]
# Drawing scenarios from a task's family (`mtx scenario generate`,
# `mtx grade --draw`), and authoring tasks: host-side too. Without it an
# agent can't sample the distribution the hidden set is drawn from.
generate = ["host", "mtx-grader/generators", "dep:rmcp", "dep:schemars"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
# glibc's allocator holds on to what a session frees: a verifier grading
# 144 sessions grows past its memory limit.
mimalloc = { version = "0.1", default-features = false }
mtx-core.workspace = true
mtx-grader.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The host's commands only (`host`): the agent's `mtx` uses none of them
# itself (the grader it runs has its own).
axum = { workspace = true, optional = true }
flate2 = { version = "1", optional = true }
futures = { workspace = true, optional = true }
include_dir = { version = "0.7", optional = true }
# The Claude Code and Codex ACP agents the composer and `scenario new` talk to.
mtx-acp = { workspace = true, optional = true }
mtx-kit = { workspace = true, optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
solana-keypair = { workspace = true, optional = true }
solana-pubkey = { workspace = true, optional = true }
solana-rpc-client = { workspace = true, optional = true }
solana-signer = { workspace = true, optional = true }
surfpool-core = { workspace = true, optional = true }
surfpool-types = { workspace = true, optional = true }
tar = { version = "0.4", optional = true }
thiserror = { workspace = true, optional = true }
toml = { version = "1", optional = true }
uuid = { workspace = true, optional = true }

# Task authoring only (`generate`).
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io", "elicitation"], optional = true }
schemars = { version = "1", optional = true }
