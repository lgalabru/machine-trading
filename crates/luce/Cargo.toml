# No workspace inheritance: like mth-botkit, this crate ships inside the task
# image at /opt/mth/sdk, where bots build against it outside this workspace.
# Versions match the workspace's [workspace.dependencies].
[package]
name = "luce"
description = "Trading library: an exact, Decimal-based trading model, a Solana runtime, and protocol adapters."
edition = "2024"
version = "0.1.0"
license = "MIT"

[features]
default = []
# Phoenix Eternal perpetuals: market metadata, exact tick/lot conversions, a
# trader, and an ExecutionDriver.
phoenix = ["dep:phoenix-rise", "dep:serde_json"]
# The deterministic in-memory chain client, for tests in dependent crates.
test-util = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rust_decimal = { version = "1.39", features = ["serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

solana-account = "4"
solana-account-decoder-client-types = "4.3"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-keypair = "3"
solana-program-pack = "3"
solana-pubkey = "4"
solana-rpc-client = "4.3"
solana-rpc-client-api = "4.3"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["wincode"] }
solana-transaction = { version = "4.3", features = ["wincode"] }
solana-transaction-status-client-types = "4.3"
spl-associated-token-account-interface = "2"
spl-token-interface = "3"

phoenix-rise = { version = "=0.6.15", default-features = false, features = ["api", "sdk", "tx-builder", "serde"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
rust_decimal_macros = "1.39"
serde_json = "1"
# Signature verification, for tests that check what was signed.
solana-transaction = { version = "4.3", features = ["wincode", "verify"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wincode = "0.6"
