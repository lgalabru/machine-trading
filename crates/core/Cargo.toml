# No workspace inheritance: like mtx-kit, this crate ships inside the task
# image at /opt/mtx/sdk, where bots build against it outside this workspace.
# Versions match the workspace's [workspace.dependencies].
[package]
name = "mtx-core"
description = "The mtx vocabulary: instruments, orders, fills, positions and holdings, the account meter, the mandate, and the turn protocol. No chain code."
edition = "2024"
version = "0.1.0"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rust_decimal = { version = "1.39", features = ["serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rust_decimal_macros = "1.39"
