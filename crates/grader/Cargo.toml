[package]
name = "mtx-grader"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
async-trait = "0.1"
base64 = "0.22"
borsh = "1"
bytemuck = "1"
bs58 = "0.5"
flate2 = "1"
libc.workspace = true
mtx-core.workspace = true
mtx-kit = { workspace = true, features = ["phoenix-v1", "openbook-v2", "raydium-clmm", "meteora-dlmm", "orca-whirlpool"] }
phoenix-rise.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Derives each session's keypairs from the grade's secret (see src/keys.rs), and
# hashes a snapshot recipe.
sha2 = "0.10"
solana-keypair.workspace = true
# Raw sends (src/raw.rs): program addresses, v0 messages with lookup
# tables, and the wire encoding their simulations take.
solana-message = "4"
solana-pubkey = { workspace = true, features = ["curve25519"] }
solana-rpc-client.workspace = true
solana-rpc-client-api.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
surfpool-sdk.workspace = true
# For ClockCommand, which surfpool-sdk doesn't re-export.
thiserror.workspace = true
tokio.workspace = true
toml = "1"
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
wincode = "0.6"
# Strategies built as wasm components (docs/rfd/0002-wasm-strategies.md).
wasmtime = "50.0.1"
wasmtime-wasi = "50.0.1"
# Seeds the strategies' WASI randomness.
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }

[dev-dependencies]
# A Token-2022 mint with a transfer fee, and v0 transactions, on a surfnet
# behind the guard (tests/tokens_and_v0.rs).
solana-system-interface = { version = "3", features = ["wincode"] }
solana-transaction.workspace = true
spl-token-2022-interface = "3.1"
wincode = "0.6"
