[package]
name = "mtx-grader"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
async-trait = "0.1"
base64 = "0.22"
borsh = "1"
bytemuck = "1"
bs58 = "0.5"
flate2 = "1"
libc.workspace = true
mtx-core.workspace = true
mtx-kit = { workspace = true, features = ["phoenix-v1", "openbook-v2"] }
phoenix-rise.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Market-calibration files (src/market): read, and pinned by SHA-256.
sha2 = "0.10"
toml = "1"
solana-keypair.workspace = true
solana-pubkey.workspace = true
solana-rpc-client.workspace = true
solana-rpc-client-api.workspace = true
solana-signer.workspace = true
surfpool-sdk.workspace = true
# For ClockCommand, which surfpool-sdk doesn't re-export.
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
# Strategies built as wasm components (docs/rfd/0002-wasm-strategies.md).
wasmtime = "50.0.1"
wasmtime-wasi = "50.0.1"
# Seeds the strategies' WASI randomness.
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
