[package]
name = "mtx-grader"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
async-trait = "0.1"
base64 = "0.22"
borsh = "1"
bytemuck = "1"
bs58 = "0.5"
flate2 = "1"
libc.workspace = true
mtx-core.workspace = true
# Whirlpool and Raydium CLMM: the pools a recipe clones (src/pools.rs).
mtx-kit = { workspace = true, features = ["phoenix-v1", "openbook-v2", "orca-whirlpool", "raydium-clmm"] }
phoenix-rise.workspace = true
reqwest.workspace = true
serde.workspace = true
# A component's seats send through the transaction layer's chain client
# (src/txlayer/client.rs).
solana-account = "4"
serde_json.workspace = true
# Derives each session's keypairs from the grade's secret (see src/keys.rs),
# hashes a snapshot recipe, and pins market-calibration files (src/market).
sha2 = "0.10"
# The clock a scenario's warp sets (surfpool's own version).
solana-clock = { version = "3.2", default-features = false }
solana-keypair.workspace = true
# Raw sends (src/raw.rs): program addresses, v0 messages with lookup
# tables, and the wire encoding their simulations take.
solana-message = "4"
solana-pubkey = { workspace = true, features = ["curve25519"] }
solana-rpc-client.workspace = true
solana-rpc-client-api.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
surfpool-sdk.workspace = true
# For ClockCommand, which surfpool-sdk doesn't re-export.
thiserror.workspace = true
tokio.workspace = true
toml = "1"
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
wincode = "0.6"
# The host of strategies built as wasm components
# (docs/rfd/0002-wasm-strategies.md).
mtx-runtime.workspace = true

[dev-dependencies]
# A chain held in memory, for reading wallets without a surfnet.
mtx-kit = { workspace = true, features = ["test-util"] }
solana-account = "4"
# The scenario script engine, to run the impact script without a surfnet.
surfpool-core.workspace = true
surfpool-types.workspace = true
# A Token-2022 mint with a transfer fee, and v0 transactions, on a surfnet
# behind the guard (tests/tokens_and_v0.rs).
solana-system-interface = { version = "3", features = ["wincode"] }
solana-transaction.workspace = true
spl-token-2022-interface = "3.1"
wincode = "0.6"

[features]
# The task families' generators (`mtx scenario generate`, `mtx grade --draw`).
# Off in the agent's `mtx`: it holds only the practice files a task ships.
generators = []

# Runs the generators, so only with them (CI: --features generators).
[[test]]
name = "informed_boundary"
required-features = ["generators"]
