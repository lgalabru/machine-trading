# No workspace inheritance: this crate also ships inside the task image at
# /opt/mt/sdk, where bots build against it outside this workspace.
[package]
name = "mt-botkit"
description = "Plumbing for mt trading bots: the runtime contract, Phoenix access, and transactions, on luce."
edition = "2024"
version = "0.1.0"
license = "MIT"

[dependencies]
luce = { path = "../luce", features = ["phoenix"] }
serde_json = "1"
solana-commitment-config = "3"
solana-keypair = "3"
solana-pubkey = "4"
solana-rpc-client = "4.3"
solana-rpc-client-api = "4.3"
solana-signer = "3"
solana-transaction = { version = "4.3", features = ["wincode"] }
thiserror = "2"
tracing = "0.1"
