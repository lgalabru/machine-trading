[package]
name = "mtx-runtime"
description = "What runs a strategy component: the wasm host the grader and the mainnet runtime share (docs/rfd/0004-strategies-on-mainnet.md)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
mtx-core.workspace = true
# The kit's strategy types, which the host converts to and from the WIT
# world's, and its venues, which the seats trade on.
mtx-kit = { workspace = true, features = ["phoenix-v1", "openbook-v2"] }
phoenix-rise.workspace = true
solana-keypair.workspace = true
solana-pubkey = { workspace = true, features = ["curve25519"] }
solana-rpc-client-api.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
tracing.workspace = true
reqwest.workspace = true
serde.workspace = true
# Anchor's account and instruction discriminators (src/venue/kamino).
sha2 = "0.10"
serde_json.workspace = true
thiserror.workspace = true
# Strategies built as wasm components (docs/rfd/0002-wasm-strategies.md).
wasmtime = "50.0.1"
wasmtime-wasi = "50.0.1"
# Seeds the strategies' WASI randomness.
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
tokio.workspace = true

[dev-dependencies]
# A chain held in memory, for the backfill's tests.
mtx-kit = { workspace = true, features = ["test-util"] }
solana-account = "4"

[features]
# The runtime that runs strategies against a live chain
# (docs/rfd/0004-strategies-on-mainnet.md): the feed, the account cache and
# the readers over it. Off in the grader.
live = []
