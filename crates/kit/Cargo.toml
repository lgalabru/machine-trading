# No workspace inheritance: this crate ships inside the task image at
# /opt/mtx/sdk, with mtx-core, where bots build against it outside this
# workspace. Versions match the workspace's [workspace.dependencies].
[package]
name = "mtx-kit"
description = "Trading on Solana for mtx bots: a Solana runtime, protocol adapters, risk and simulation on mtx-core's types, and the bot plumbing (the runtime contract, the run loop, a Phoenix trader)."
edition = "2024"
version = "0.1.0"
license = "MIT"

[features]
default = ["phoenix"]
# The chain: the Solana client, transactions and tokens, lending, and the
# protocol adapters. Off, the kit is the strategy and the trading model,
# which build for wasm32-wasip2 (with `component`).
chain = [
    "dep:tokio",
    "dep:solana-account",
    "dep:solana-account-decoder-client-types",
    "dep:solana-commitment-config",
    "dep:solana-compute-budget-interface",
    "dep:solana-instruction",
    "dep:solana-keypair",
    "dep:solana-message",
    "dep:solana-address-lookup-table-interface",
    "dep:solana-program-pack",
    "dep:solana-pubkey",
    "solana-pubkey/curve25519",
    "dep:solana-rpc-client",
    "dep:solana-rpc-client-api",
    "dep:solana-signer",
    "dep:solana-system-interface",
    "dep:solana-transaction",
    "dep:solana-transaction-status-client-types",
    "dep:spl-associated-token-account-interface",
    "dep:spl-token-interface",
]
# A strategy as a WebAssembly component the grader calls: the WIT world
# (wit/strategy.wit) and `export!`. Build for wasm32-wasip2.
component = ["dep:wit-bindgen"]
# Phoenix Eternal perpetuals: market metadata, exact tick/lot conversions, a
# trader, and an ExecutionDriver; and the bot plumbing, which trades on them.
phoenix = [
    "chain",
    "venue",
    "phoenix-rise/api",
    "phoenix-rise/tx-builder",
    "dep:tracing-subscriber",
]
# What a strategy reads of Phoenix without the chain: the market metadata a
# session hands it (Session::venue), tick and lot conversions, account
# addresses, and Phoenix's account decoding. Builds for wasm32-wasip2.
venue = ["dep:phoenix-rise", "phoenix-rise/sdk", "dep:solana-pubkey", "solana-pubkey/curve25519"]
# Phoenix v1 spot order books, as the Phoenix venue profile's spot markets:
# market and seat decoding, exact tick/lot conversions, the trader's
# instructions, its holdings, a trader and an ExecutionDriver.
phoenix-v1 = ["chain", "pyth", "phoenix-v1-venue"]
# What a strategy reads of Phoenix v1 without the chain: market and seat
# decoding, exact tick/lot conversions, the book, and the trader's
# instructions. Builds for wasm32-wasip2.
phoenix-v1-venue = ["spot-venue"]
# OpenBook v2 spot order books, as the OpenBook venue profile defines them:
# market, book side, open orders and indexer decoding, exact lot
# conversions, the trader's instructions, its holdings, a trader and an
# ExecutionDriver.
openbook-v2 = ["chain", "pyth", "openbook-v2-venue"]
# What a strategy reads of OpenBook v2 without the chain: market, book side
# and open orders decoding, exact lot conversions, the book, and the
# trader's instructions. Builds for wasm32-wasip2.
openbook-v2-venue = ["spot-venue"]
# What both spot venues share without the chain: named markets, token
# program addresses and associated token accounts, and Token-2022 mint and
# account decoding.
spot-venue = ["dep:solana-pubkey", "solana-pubkey/curve25519", "dep:solana-instruction"]
# Pyth push-oracle price feeds: PriceUpdateV2 decoding and feed addresses;
# the spot venues value their base assets at them.
pyth = ["chain"]
# The deterministic in-memory chain client, for tests in dependent crates.
test-util = ["chain"]

[dependencies]
mtx-core = { path = "../core" }
wit-bindgen = { version = "0.63", optional = true }
async-trait = "0.1"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rust_decimal = { version = "1.39", features = ["serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

solana-account = { version = "4", optional = true }
solana-account-decoder-client-types = { version = "4.3", optional = true }
solana-commitment-config = { version = "3", optional = true }
solana-compute-budget-interface = { version = "3", optional = true }
solana-instruction = { version = "3.5", optional = true }
solana-keypair = { version = "3", optional = true }
solana-message = { version = "4.6", optional = true }
solana-address-lookup-table-interface = { version = "3.2", features = ["bincode"], optional = true }
solana-program-pack = { version = "3", optional = true }
solana-pubkey = { version = "4", optional = true }
solana-rpc-client = { version = "4.3", optional = true }
solana-rpc-client-api = { version = "4.3", optional = true }
solana-signer = { version = "3", optional = true }
solana-system-interface = { version = "3", features = ["wincode"], optional = true }
solana-transaction = { version = "4.3", features = ["wincode"], optional = true }
solana-transaction-status-client-types = { version = "4.3", optional = true }
spl-associated-token-account-interface = { version = "2", optional = true }
spl-token-interface = { version = "3", optional = true }

phoenix-rise = { version = "=0.6.15", default-features = false, features = ["serde"], optional = true }

[dev-dependencies]
rust_decimal_macros = "1.39"
serde_json = "1"
# Signature verification, for tests that check what was signed.
solana-transaction = { version = "4.3", features = ["wincode", "verify"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wincode = "0.6"
# Checks the kit's own Token-2022 decoding against the program's crate.
spl-token-2022-interface = "3.1"
