# No workspace inheritance: this crate ships inside the task image at
# /opt/mtx/sdk, with mtx-core, where bots build against it outside this
# workspace. Versions match the workspace's [workspace.dependencies].
[package]
name = "mtx-kit"
description = "Trading on Solana for mtx bots: a Solana runtime, protocol adapters, risk and simulation on mtx-core's types, and the bot plumbing (the runtime contract, the run loop, a Phoenix trader)."
edition = "2024"
version = "0.1.0"
license = "MIT"

[features]
default = ["phoenix"]
# Phoenix Eternal perpetuals: market metadata, exact tick/lot conversions, a
# trader, and an ExecutionDriver; and the bot plumbing, which trades on them.
phoenix = ["dep:phoenix-rise", "dep:tracing-subscriber"]
# Phoenix v1 spot order books, as the Phoenix venue profile's spot markets:
# market and seat decoding, exact tick/lot conversions, the trader's
# instructions, its holdings, a trader and an ExecutionDriver.
phoenix-v1 = []
# OpenBook v2 spot order books, as the OpenBook venue profile defines them:
# market, book side, open orders and indexer decoding, exact lot
# conversions, the trader's instructions, its holdings, a trader and an
# ExecutionDriver.
openbook-v2 = []
# Pyth push-oracle price feeds: PriceUpdateV2 decoding and feed addresses.
pyth = []
# The deterministic in-memory chain client, for tests in dependent crates.
test-util = []

[dependencies]
mtx-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rust_decimal = { version = "1.39", features = ["serde-with-str", "maths"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

solana-account = "4"
solana-account-decoder-client-types = "4.3"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-keypair = "3"
solana-program-pack = "3"
solana-pubkey = "4"
solana-rpc-client = "4.3"
solana-rpc-client-api = "4.3"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["wincode"] }
solana-transaction = { version = "4.3", features = ["wincode"] }
solana-transaction-status-client-types = "4.3"
spl-associated-token-account-interface = "2"
spl-token-interface = "3"

phoenix-rise = { version = "=0.6.15", default-features = false, features = ["api", "sdk", "tx-builder", "serde"], optional = true }

[dev-dependencies]
rust_decimal_macros = "1.39"
serde_json = "1"
# Signature verification, for tests that check what was signed.
solana-transaction = { version = "4.3", features = ["wincode", "verify"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wincode = "0.6"
