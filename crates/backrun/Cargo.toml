[package]
name = "mth-backrun"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
base64 = "0.22"
bs58 = "0.5"
clap = { workspace = true, features = ["env"] }
hex = "0.4"
futures.workspace = true
tokio-tungstenite = "0.28"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
solana-account = "4"
solana-fee = "=4.3.2"
solana-address-lookup-table-interface = { version = "3.2", features = ["wincode"] }
solana-commitment-config.workspace = true
solana-compute-budget-interface.workspace = true
solana-instruction = "3"
solana-keypair.workspace = true
solana-message = { version = "4", features = ["wincode"] }
solana-pubkey = { workspace = true, features = ["curve25519"] }
solana-rpc-client.workspace = true
solana-rpc-client-api.workspace = true
solana-signer.workspace = true
solana-system-interface = { version = "3", features = ["wincode"] }
solana-transaction = { workspace = true, features = ["verify"] }
spl-associated-token-account-interface = "2"
spl-token-interface = "3"
surfpool-sdk.workspace = true
surfpool-types.workspace = true
tokio.workspace = true
tracing.workspace = true
wincode = "0.6"

[dev-dependencies]
tempfile = "3"
